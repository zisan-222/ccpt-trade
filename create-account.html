<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - CPTMarkets</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-bg"></div>

  <main class="create-wrap">
    <section class="create-card">
      <h1 class="title">Create Account</h1>
      <p class="subtitle">Join CptMarkets for global trading</p>

      <form class="create-form">
        <label>Username</label>
        <input type="text" placeholder="Username" />

        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Password (min. 6 chars)" />

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" />

        <label>Invite Code</label>
        <input type="text" placeholder="Invite Code (optional)" />

        <button type="submit" class="gold-btn">Register</button>

        <div class="footer-line">
          <span>Already have an account?</span>
          <a href="index.html">Go to Sign In</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>

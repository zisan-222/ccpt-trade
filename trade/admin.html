<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CptMarkets - Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #050b14; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: rgba(16, 29, 49, 0.9); padding: 40px; border-radius: 12px; border: 1px solid #1a2f4c; box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; }
        h2 { color: #788b9e; font-size: 18px; margin-bottom: 10px; font-weight: normal; text-transform: uppercase; letter-spacing: 1px; }
        .balance { font-size: 42px; color: #f1b82d; font-weight: bold; margin-bottom: 25px; }
        p { color: #869bb5; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Total Assets</h2>
        <div class="balance" id="total-assets">$0.00</div>
        <p>CptMarkets ডেমো ট্রেডিং ড্যাশবোর্ডে আপনাকে স্বাগতম। আপনার ব্যালেন্স এডমিন প্যানেল থেকে লাইভ আপডেট করা হবে।</p>
    </div>

    <script type="module">
      import { initializeApp } from "https://gstatic.com";
      import { getAuth, onAuthStateChanged } from "https://gstatic.com";
      import { getFirestore, doc, onSnapshot } from "https://gstatic.com";

      const firebaseConfig = {
        apiKey: "AIzaSyApKKni5cB26UoJVod6pGhrzLYYv",
        authDomain: "://firebaseapp.com",
        projectId: "ccpt-trade",
        storageBucket: "ccpt-trade.firebasestorage.app",
        messagingSenderId: "461751033270",
        appId: "1:461751033270:web:7fdc3f9a206cbf2",
        measurementId: "G-V1RSJDECT"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      onAuthStateChanged(auth, (user) => {
        if (user) {
          onSnapshot(doc(db, "users", user.uid), (docSnapshot) => {
            if (docSnapshot.exists()) {
              const currentBalance = docSnapshot.data().balance || 0;
              const balanceElement = document.getElementById("total-assets");
              if (balanceElement) {
                  balanceElement.innerText = `$${currentBalance.toFixed(2)}`;
              }
            }
          });
        } else {
          window.location.href = "register.html"; 
        }
      });
    </script>
</body>
</html>

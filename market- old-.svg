<svg xmlns="http://w3.org" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- ডার্ক ফাইন্যান্সিয়াল ব্যাকগ্রাউন্ড গ্রেডিয়েন্ট -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#02050d"/>
    </linearGradient>

    <!-- গ্লোবাল গ্রিড ও ওয়ার্ল্ড গ্লো ইফেক্ট -->
    <radialGradient id="glowGrad" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#0052cc" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- গোল্ডেন ক্যান্ডেলস্টিক গ্রেডিয়েন্ট -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <!-- গ্লো ইফেক্ট ফিল্টার -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ব্যাকগ্রাউন্ড রেক্টেঙ্গেল -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#glowGrad)"/>

  <!-- টেকনোলজি ডট গ্রিড (বিশ্ব মানচিত্রের আভাস) -->
  <g opacity="0.25">
    <circle cx="200" cy="300" r="2" fill="#fff" />
    <circle cx="400" cy="250" r="3" fill="#0052cc" filter="url(#glow)" />
    <circle cx="600" cy="400" r="1.5" fill="#fff" />
    <circle cx="800" cy="200" r="2.5" fill="#d4af37" />
    <circle cx="1100" cy="350" r="2" fill="#fff" />
    <circle cx="1400" cy="150" r="3" fill="#0052cc" />
    <circle cx="1600" cy="300" r="2" fill="#d4af37" />
  </g>

  <!-- ডিজিটাল গ্লোবাল নেটওয়ার্ক লাইন সমূহ -->
  <g stroke="#0052cc" stroke-width="1" opacity="0.3" fill="none">
    <path d="M100,500 Q500,200 960,540 T1820,300" />
    <path d="M200,600 Q700,300 1200,400 T1920,700" stroke="#d4af37" stroke-width="0.5" stroke-dasharray="5,5" />
    <path d="M0,200 Q400,400 960,200 T1920,400" stroke-width="0.5" />
  </g>

  <!-- নিচে উদীয়মান গ্লোবাল কার্ভ (পৃথিবীর অংশ) -->
  <path d="M 0,1080 Q 960,750 1920,1080 Z" fill="#050b1e" opacity="0.8"/>
  <path d="M 0,1080 Q 960,750 1920,1080" fill="none" stroke="#d4af37" stroke-width="3" filter="url(#glow)" opacity="0.7"/>

  <!-- মার্কেট বুলিশ ট্রেন্ড লাইন (উর্ধ্বমুখী গ্রাফ) -->
  <path d="M 100,850 Q 500,800 800,650 T 1400,350 T 1920,100" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- স্টক মার্কেট ক্যান্ডেলস্টিক সমূহ (Bullish Candlesticks) -->
  <g fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="2">
    <!-- ক্যান্ডেল ১ -->
    <line x1="400" y1="780" x2="400" y2="840" />
    <rect x="392" y="790" width="16" height="40" />

    <!-- ক্যান্ডেল ২ -->
    <line x1="550" y1="720" x2="550" y2="790" />
    <rect x="542" y="735" width="16" height="45" />

    <!-- ক্যান্ডেল ৩ -->
    <line x1="700" y1="640" x2="700" y2="730" />
    <rect x="692" y="660" width="16" height="50" />

    <!-- ক্যান্ডেল ৪ -->
    <line x1="850" y1="550" x2="850" y2="660" />
    <rect x="842" y="570" width="16" height="70" filter="url(#glow)" />

    <!-- ক্যান্ডেল ৫ -->
    <line x1="1000" y1="480" x2="1000" y2="580" />
    <rect x="992" y="500" width="16" height="60" />

    <!-- ক্যান্ডেল ৬ -->
    <line x1="1150" y1="400" x2="1150" y2="500" />
    <rect x="1142" y="420" width="16" height="60" />

    <!-- ক্যান্ডেল ৭ -->
    <line x1="1300" y1="310" x2="1300" y2="420" />
    <rect x="1292" y="330" width="16" height="70" filter="url(#glow)" />

    <!-- ক্যান্ডেল ৮ -->
    <line x1="1450" y1="220" x2="1450" y2="340" />
    <rect x="1442" y="240" width="16" height="80" />

    <!-- ক্যান্ডেল ৯ (সর্বোচ্চ) -->
    <line x1="1600" y1="100" x2="1600" y2="240" />
    <rect x="1592" y="120" width="16" height="90" filter="url(#glow)" />
  </g>

  <!-- ডেটা ফ্লোর জন্য অতিরিক্ত নোড বা লাইট পয়েন্ট -->
  <g fill="#ffe066" filter="url(#glow)">
    <circle cx="850" cy="570" r="5" />
    <circle cx="1300" cy="330" r="5" />
    <circle cx="1600" cy="120" r="6" />
  </g>
</svg>

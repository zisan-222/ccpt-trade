<svg xmlns="http://w3.org" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- ডার্ক ফাইন্যান্সিয়াল ব্যাকগ্রাউন্ড গ্রেডিয়েন্ট -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- ছবির মতো নিচের অংশের গ্লো ইফেক্ট -->
    <radialGradient id="earthGlow" cx="50%" cy="110%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- ক্যান্ডেলস্টিক ও লাইনের জন্য গোল্ডেন গ্রেডিয়েন্ট -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- হালকা গ্লো ফিল্টার (ওয়েবসাইটকে প্রিমিয়াম লুক দেওয়ার জন্য) -->
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- মূল ব্যাকগ্রাউন্ড রেক্টেঙ্গেল -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#earthGlow)"/>

  <!-- ওয়ার্ল্ড ম্যাপের মতো গোল্ডেন ও ব্লু ডট নেটওয়ার্ক (অল্প এবং পরিষ্কার) -->
  <g opacity="0.4">
    <circle cx="300" cy="250" r="3" fill="#fbbf24" filter="url(#lightGlow)"/>
    <circle cx="500" cy="180" r="2.5" fill="#3b82f6"/>
    <circle cx="750" cy="300" r="4" fill="#fbbf24" filter="url(#lightGlow)"/>
    <circle cx="1100" cy="220" r="3" fill="#3b82f6"/>
    <circle cx="1350" cy="380" r="4" fill="#fbbf24" filter="url(#lightGlow)"/>
    <circle cx="1650" cy="150" r="2" fill="#fbbf24"/>
  </g>

  <!-- লাইটওয়েট গ্লোবাল কানেকশন লাইন সমূহ -->
  <g stroke="#3b82f6" stroke-width="0.7" opacity="0.2" fill="none">
    <path d="M300,250 Q525,100 750,300" stroke="#fbbf24" stroke-width="1"/>
    <path d="M750,300 Q925,400 1100,220"/>
    <path d="M1100,220 Q1225,100 1350,380" stroke="#fbbf24" stroke-width="1"/>
    <path d="M1350,380 Q1500,200 1650,150"/>
  </g>

  <!-- নিচের দিকের উজ্জ্বল গ্লোবাল আর্ক (পৃথিবীর উপরিভাগ) -->
  <path d="M 0,1080 Q 960,820 1920,1080 Z" fill="#040a1e" opacity="0.9"/>
  <path d="M 0,1080 Q 960,820 1920,1080" fill="none" stroke="#fbbf24" stroke-width="2.5" filter="url(#lightGlow)" opacity="0.6"/>

  <!-- উর্ধ্বমুখী মার্কেট বুলিশ ক্যান্ডেলস্টিক চার্ট -->
  <g fill="url(#gold)" stroke="url(#gold)" stroke-width="1.5">
    <!-- ক্যান্ডেল ১ -->
    <line x1="600" y1="780" x2="600" y2="830" />
    <rect x="593" y="790" width="14" height="30" />

    <!-- ক্যান্ডেল ২ -->
    <line x1="750" y1="710" x2="750" y2="770" />
    <rect x="743" y="725" width="14" height="35" />

    <!-- ক্যান্ডেল ৩ -->
    <line x1="900" y1="620" x2="900" y2="700" />
    <rect x="893" y="640" width="14" height="45" filter="url(#lightGlow)"/>

    <!-- ক্যান্ডেল ৪ -->
    <line x1="1050" y1="540" x2="1050" y2="610" />
    <rect x="1043" y="555" width="14" height="45" />

    <!-- ক্যান্ডেল ৫ -->
    <line x1="1200" y1="440" x2="1200" y2="530" />
    <rect x="1193" y="460" width="14" height="55" filter="url(#lightGlow)"/>

    <!-- ক্যান্ডেল ৬ -->
    <line x1="1350" y1="360" x2="1350" y2="430" />
    <rect x="1343" y="375" width="14" height="40" />

    <!-- ক্যান্ডেল ৭ (সর্বোচ্চ পয়েন্ট) -->
    <line x1="1500" y1="240" x2="1500" y2="340" />
    <rect x="1493" y="260" width="14" height="60" filter="url(#lightGlow)"/>
  </g>

  <!-- চার্টের মূল ট্রেন্ড লাইন যা ক্যান্ডেলগুলোকে যুক্ত করেছে -->
  <path d="M 600,805 L 750,742 L 900,662 L 1050,577 L 1200,487 L 1350,395 L 1500,290" fill="none" stroke="#ffe066" stroke-width="3" filter="url(#lightGlow)"/>

  <!-- জয়েন্ট পয়েন্টগুলোর গ্লোয়িং ডট -->
  <g fill="#ffffff" filter="url(#lightGlow)">
    <circle cx="900" cy="662" r="4" />
    <circle cx="1200" cy="487" r="4" />
    <circle cx="1500" cy="290" r="5" />
  </g>
</svg>

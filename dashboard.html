<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CptMarkets - Dashboard</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            margin: 0; padding: 0; box-sizing: border-box; background-color: #020b18;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff; padding-bottom: 120px; overflow-x: hidden;
        }
        .top-bar {
            padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
            background: #031129; border-b: 1px solid rgba(30, 58, 138, 0.2);
        }
        .top-brand { display: flex; align-items: center; gap: 8px; }
        .top-logo-circle {
            width: 22px; height: 22px; background: #fbbf24; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #031129; font-weight: 900; font-size: 10px;
        }
        .top-title { color: #fbbf24; font-weight: 700; font-size: 15px; margin: 0; }

        .banner-box { padding: 16px; }
        .main-banner {
            background: linear-gradient(135deg, #051c44 0%, #0c234a 100%);
            background-image: url('https://postimg.co');
            background-size: cover; background-position: center;
            padding: 24px 20px; border-radius: 16px; border: 1px solid rgba(30, 58, 138, 0.4);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
        }
        .banner-title { color: #fbbf24; font-size: 24px; font-weight: 800; margin: 0; }
        .banner-subtitle { color: #9ca3af; font-size: 12px; margin: 6px 0 0 0; font-weight: 400; }

        .asset-card {
            margin: 0 16px; padding: 20px; background: rgba(5, 25, 62, 0.5);
            border-radius: 16px; border: 1px solid rgba(30, 58, 138, 0.3);
        }
        .asset-header { display: flex; justify-content: space-between; align-items: center; color: #9ca3af; font-size: 12px; }
        .total-balance { font-size: 32px; font-weight: 700; margin: 8px 0; color: #ffffff; font-family: monospace; }
        .floating-info { display: flex; gap: 16px; font-size: 11px; color: #9ca3af; margin-bottom: 20px; }
        .pl-green { color: #10b981; font-weight: 700; }

        .action-table { width: 100%; border-collapse: separate; border-spacing: 10px 0; margin: 0; }
        .action-table td { width: 33.33%; padding: 0; }
        .btn-deposit {
            display: block; width: 100%; padding: 12px 0; text-align: center;
            background: linear-gradient(to right, #f59e0b, #d97706); border: none;
            border-radius: 12px; color: #031129; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 4px 10px rgba(245,158,11,0.2);
        }
        .btn-secondary {
            display: block; width: 100%; padding: 12px 0; text-align: center;
            background: #0d2754; border: 1px solid rgba(30, 58, 138, 0.5);
            border-radius: 12px; color: #ffffff; font-weight: 600; font-size: 13px; text-decoration: none; box-sizing: border-box;
        }

        .service-container { margin: 24px 16px; display: block; }
        .service-row { display: flex; justify-content: space-between; margin-bottom: 20px; width: 100%; }
        .service-item { text-align: center; width: 23%; cursor: pointer; text-decoration: none; color: inherit; }
        .icon-box {
            width: 48px; height: 48px; background: rgba(5, 25, 62, 0.7); border: 1px solid rgba(30, 58, 138, 0.4);
            border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .icon-box svg { width: 20px; height: 20px; fill: #fbbf24; }
        .icon-label { font-size: 11px; color: #9ca3af; display: block; margin-top: 8px; font-weight: 500; }

        .hot-markets { margin: 24px 16px; display: block; }
        .hot-header { display: flex; justify-content: space-between; font-size: 12px; color: #9ca3af; margin-bottom: 12px; font-weight: 700; }
        .hot-row {
            padding: 14px 16px; background: rgba(5, 25, 62, 0.3); border: 1px solid rgba(30, 58, 138, 0.2);
            border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .crypto-name { font-size: 14px; font-weight: 700; }
        .crypto-sub { font-size: 10px; color: #6b7280; margin-top: 2px; }
        .live-price-box { display: flex; align-items: center; gap: 12px; }
        .price-text { font-size: 14px; font-weight: 700; font-family: monospace; color: #ffffff; }
        .change-badge { background: rgba(239, 68, 68, 0.2); color: #ef4444; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; font-family: monospace; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: #031129;
            border-top: 1px solid rgba(30, 58, 138, 0.3); padding: 10px 0; display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { background: none; border: none; color: #6b7280; font-size: 10px; font-weight: 600; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-decoration: none; width: 20%; }
        .nav-item svg { width: 18px; height: 18px; fill: #6b7280; margin-bottom: 4px; }
        .nav-item.active { color: #fbbf24; }
        .nav-item.active svg { fill: #fbbf24; }
        
        .trade-btn-container { margin-top: -26px; text-align: center; width: 20%; position: relative; }
        .circle-trade-btn {
            width: 46px; height: 46px; background: linear-gradient(to bottom, #fbbf24, #f59e0b);
            border-radius: 50%; border: 4px solid #020b18; display: flex; align-items: center; justify-content: center;
            margin: 0 auto; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3); cursor: pointer;
        }
        .circle-trade-btn svg { width: 18px; height: 18px; fill: #031129; }
        .trade-label { font-size: 10px; color: #fbbf24; font-weight: 600; margin-top: 4px; display: block; }

        .admin-panel { margin: 20px 16px; padding: 16px; background: #170505; border-radius: 12px; border: 1px solid #7f1d1d; display: none; }
        .admin-title { font-size: 13px; font-weight: 700; color: #ef4444; margin: 0 0 12px 0; }
        .admin-input { width: 100%; padding: 10px; background: #020b18; border: 1px solid #7f1d1d; border-radius: 8px; color: #ffffff; font-size: 12px; margin-bottom: 10px; outline: none; box-sizing: border-box; }
        .admin-btn { width: 100%; padding: 10px; background: #b91c1c; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-brand">
            <div class="top-logo-circle">CPT</div>
            <h1 class="top-title">CptMarkets</h1>
        </div>
        <img src="https://flagcdn.com" width="20" style="border-radius: 2px;">
    </div>

    <div class="banner-box">
        <div class="main-banner">
            <h2 class="banner-title">CptMarkets</h2>
            <p class="banner-subtitle">Global integrated financial trading platform</p>

            <span id="displayUid" style="color: #fbbf24; font-family: monospace; font-weight: 700;">UID: Loading...</span>

        <div class="total-balance" id="totalBalance">$0.00</div>

            <div>Floating P/L <span class="pl-green">+0.00</span></div>
            <div>Equity <span class="equity-white" id="equityAmount">$0.00</span></div>
        </div>

        <table class="action-table">
            <tr>
                <td><button onclick="alert('Please contact customer care.')" class="btn-deposit">Deposit</button></td>

                <td><button onclick="alert('Coming soon')" class="btn-secondary">Transfer</button></td>
            </tr>
        </table>
    </div>

                </div>
                <span class="icon-label">Support</span>
            </div>
            <a href="withdraw.html" class="service-item">

                    <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                </div>
                <span class="icon-label">Withdraw</span>
            </a>
            <div onclick="alert('Coming soon')" class="service-item">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/></svg>
                </div>
                <span class="icon-label">Transfer</span>
            </div>
            <div onclick="alert('Coming soon')" class="service-item">
                <div class="icon-box">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CptMarkets - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #050b14; color: #fff; padding-bottom: 90px; }
        
        /* টপ হেডার ও নতুন লোগো এরিয়া */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #071120; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        
        /* গোল্ডেন সার্কেল লোগো */
        .logo-circle { width: 44px; height: 44px; background: radial-gradient(circle, #ffe875, #a37f00); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #000; font-weight: bold; border: 2px solid #ffd700; box-shadow: 0 0 8px rgba(255, 215, 0, 0.5); }
        .logo-text-top { font-size: 9px; line-height: 9px; font-weight: 900; font-family: 'Arial Black', sans-serif; letter-spacing: 0.3px; }
        .logo-text-mid { font-size: 5px; line-height: 7px; border-top: 1px solid #000; border-bottom: 1px solid #000; margin: 1px 0; padding: 0 2px; font-weight: 800; }
        .logo-text-bot { font-size: 6px; line-height: 6px; font-weight: 900; }
        
        .brand-name { color: #ffd700; font-size: 22px; font-weight: bold; letter-spacing: 0.5px; }
        .flag-svg { width: 25px; height: 18px; border-radius: 2px; }

        .container { padding: 15px; }

        /* ব্যানার কার্ড */
        .banner-card { background: linear-gradient(135deg, #0d2547, #071224); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); text-align: left; }
        .banner-title { color: #ffd700; font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .banner-sub { color: #869bb5; font-size: 13px; }

        /* ব্যালেন্স কার্ড */
        .balance-card { background: #0b192c; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .asset-label { color: #6d7f95; font-size: 13px; margin-bottom: 8px; }
        .asset-amount { font-size: 36px; font-weight: bold; margin-bottom: 10px; text-align: left; color: #fff; }
        .eye-svg { position: absolute; right: 20px; top: 25px; width: 20px; height: 20px; fill: #6d7f95; }
        .status-row { font-size: 13px; margin-bottom: 20px; text-align: left; }
        .green-text { color: #00ffcc; margin-right: 15px; }
        .gray-text { color: #6d7f95; }

        /* অ্যাকশন বাটনসমূহ */
        .action-buttons { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 25px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; color: #fff; background: #162a45; }
        .btn-deposit { background: linear-gradient(to right, #ffcc00, #ff9900); color: #000; }

        /* গ্রিড মেনু আইকন */
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; background: #0b192c; padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .grid-item { display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; color: #fff; font-size: 12px; cursor: pointer; }
        .icon-box { width: 50px; height: 50px; background: #12253f; border-radius: 15px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.03); }
        .icon-box svg { width: 22px; height: 22px; fill: #ffcc00; }
        .grid-item span { color: #869bb5; }

        /* বটম নেভিগেশন বার */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #071120; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #536479; font-size: 11px; width: 20%; }
        .nav-item.active { color: #ffcc00; }
        .nav-item svg { width: 20px; height: 20px; margin-bottom: 4px; fill: #536479; }
        .nav-item.active svg { fill: #ffcc00; }
        
        /* মাঝখানের গোল ট্রেড বাটন */
        .trade-btn-center { width: 55px; height: 55px; background: linear-gradient(135deg, #ffcc00, #ff9900); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -30px; box-shadow: 0 4px 15px rgba(255,153,0,0.3); }
        .trade-btn-center svg { width: 24px; height: 24px; fill: #000; }
    </style>
</head>
<body>

            <!-- অ্যাকশন বাটনসমূহ -->
            <div class="action-buttons">

<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getAuth, onAuthStateChanged } from "https://gstatic.com";
  import { getFirestore, doc, onSnapshot } from "https://gstatic.com";

  // আপনার ফায়ারবেসের কানেকশন চাবি
  const firebaseConfig = {
    apiKey: "AIzaSyApKKni5cB26UoJVod6pGhrzLYYv",
    authDomain: "://firebaseapp.com",
    projectId: "ccpt-trade",
    storageBucket: "ccpt-trade.firebasestorage.app",
    messagingSenderId: "461751033270",
    appId: "1:461751033270:web:7fdc3f9a206cbf2",
    measurementId: "G-V1RSJDECT"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, (user) => {
    if (user) {
      // রিয়েল-টাইমে ডেটাবেজ থেকে ইউজারের ব্যালেন্স টেনে আনা হচ্ছে
      onSnapshot(doc(db, "users", user.uid), (docSnapshot) => {
        if (docSnapshot.exists()) {
          const currentBalance = docSnapshot.data().balance || 0;
          
          // আপনার ফাইলের ১০০ নম্বর লাইনের ব্যালেন্স আইডি 'total-assets' এর সাথে এটি মেলানো হয়েছে
          const balanceElement = document.getElementById("total-assets");
          if (balanceElement) {
              balanceElement.innerText = `$${currentBalance.toFixed(2)}`;
          }
        }
      });
    } else {
      window.location.href = "index.html"; 
    }
  });
</script>

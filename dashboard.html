<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CptMarkets - Dashboard</title>
    <!-- আইকনগুলোর জন্য ফন্ট-অসাম লাইব্রেরি যুক্ত করা হয়েছে -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #050b14; color: #fff; padding-bottom: 80px; }
        
        /* টপ হেডার ও লোগো */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #071120; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-circle { width: 35px; height: 35px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 10px; border: 2px solid #fff; }
        .brand-name { color: #ffd700; font-size: 20px; font-weight: bold; }
        .lang-flag { width: 25px; height: 18px; background: linear-gradient(to right, red, white, blue); border-radius: 2px; }

        .container { padding: 15px; }

        /* ব্যানার কার্ড */
        .banner-card { background: linear-gradient(135deg, #0d2547, #071224); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); background-image: radial-gradient(circle at top right, rgba(255,215,0,0.1), transparent); }
        .banner-title { color: #ffd700; font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .banner-sub { color: #869bb5; font-size: 13px; }

        /* ব্যালেন্স কার্ড */
        .balance-card { background: #0b192c; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .asset-label { color: #6d7f95; font-size: 13px; margin-bottom: 8px; }
        .asset-amount { font-size: 36px; font-weight: bold; margin-bottom: 10px; }
        .eye-icon { position: absolute; right: 20px; top: 20px; color: #6d7f95; }
        .status-row { font-size: 13px; margin-bottom: 20px; }
        .green-text { color: #00ffcc; margin-right: 15px; }
        .gray-text { color: #6d7f95; }

        /* অ্যাকশন বাটনসমূহ */
        .action-buttons { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 25px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; color: #fff; background: #162a45; }
        .btn-deposit { background: linear-gradient(to right, #ffcc00, #ff9900); color: #000; }

        /* গ্রিড মেনু আইকন */
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; background: #0b192c; padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .grid-item { display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; color: #fff; font-size: 12px; }
        .icon-box { width: 50px; height: 50px; background: #12253f; border-radius: 15px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.03); }
        .icon-box i { color: #ffcc00; font-size: 20px; }
        .grid-item span { color: #869bb5; }

        /* বটম নেভিগেশন বার */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #071120; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #536479; font-size: 11px; }
        .nav-item.active { color: #ffcc00; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; }
        
        /* মাঝখানের গোল ট্রেড বাটন */
        .trade-btn-center { width: 55px; height: 55px; background: linear-gradient(135deg, #ffcc00, #ff9900); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -25px; box-shadow: 0 4px 15px rgba(255,153,0,0.3); }
        .trade-btn-center i { color: #000; font-size: 22px; }
    </style>
</head>
<body>

    <!-- হেডার এরিয়া -->
    <div class="header">
        <div class="logo-area">
            <div class="logo-circle">CPT</div>
            <div class="brand-name">CptMarkets</div>
        </div>
        <div class="lang-flag"></div>
    </div>

    <div class="container">
        <!-- টপ ব্যানার -->
        <div class="banner-card">
            <div class="banner-title">CptMarkets</div>
            <div class="banner-sub">Global integrated financial trading platform</div>
        </div>

        <!-- ব্যালেন্স কার্ড -->
        <div class="balance-card">
            <i class="fa-regular fa-eye eye-icon"></i>
            <div class="asset-label">Total Assets (USD)</div>
            <div class="asset-amount" id="total-assets">$0.00</div>
            <div class="status-row">
                <span class="green-text">Floating P/L +0.00</span>
                <span class="gray-text">Equity $0.00</span>
            </div>

            <!-- অ্যাকশন বাটনসমূহ -->
            <div class="action-buttons">
                <button class="btn btn-deposit">Deposit</button>
                <button class="btn">Withdraw</button>
                <button class="btn">Transfer</button>
            </div>
        </div>

        <!-- ৮টি আইকন গ্রিড মেনু -->
        <div class="menu-grid">
            <a href="#" class="grid-item">
                <div class="icon-box"><i class="fa-solid fa-headset"></i></div>
                <span>Support</span>
            </a>
            <a href="#" class="grid-item">
                <div class="icon-box"><i class="fa-solid fa-wallet"></i></div>
                <span>Withdraw</span>
            </a>
            <a href="#" class="grid-item">
                <div class="icon-box"><i class="fa-solid fa-right-left"></i></div>
                <span>Transfer</span>
            </a>
            <a href="#" class="grid-item">
                <div class="icon-box"><i class="fa-solid fa-users-viewfinder"></i></div>
                <span>Copy Trade</span>
            </a>
            <a href="#" class="grid-item">
                <div class="icon-box"><i class="fa-solid fa-credit-card"></i></div>
                <span>Loan</span>
            </a>
            <a href="#" class="grid-item">
                <div class="icon-box"><i class="fa-solid fa-chart-pie"></i></div>
                <span>Wealth</span>
            </a>
            <a href="#" class="grid-item">
                <div class="icon-box"><i class="fa-solid fa-pickaxe"></i></div>
                <span>Mining</span>
            </a>
            <a href="#" class="grid-item">
                <div class="icon-box"><i class="fa-solid fa-gift"></i></div>
                <span>Invite</span>
            </a>
        </div>
    </div>

    <!-- নিচের ফিক্সড মেনুবার -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Markets</span>
        </a>
        <a href="#" class="nav-item">
            <div class="trade-btn-center">
                <i class="fa-solid fa-arrow-up-down"></i>
            </div>
            <span style="color: #ffcc00; margin-top: 4px;">Trade</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-vault"></i>
            <span>Assets</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Mine</span>
        </a>
    </div>

    <script>
        // এডমিন প্যানেল বা লোকাল স্টোরেজ থেকে ব্যালেন্স নেওয়ার স্ক্রিপ্ট
        window.onload = function() {
            let currentBalance = localStorage.getItem('userBalance') || '0.00';
            document.getElementById('total-assets').innerText = '$' + parseFloat(currentBalance).toFixed(2);
        }
    </script>
</body>
</html>

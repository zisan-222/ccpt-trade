<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CptMarkets - Dashboard</title>
    <!-- আইকন লোড করার জন্য FontAwesome লিংক -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* ২য় ছবির মতো হুবহু ব্যাকগ্রাউন্ড ও ডার্ক ব্লু থিম */
        body {
            margin: 0; padding: 0; box-sizing: border-box; background-color: #020b18;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff; padding-bottom: 120px; overflow-x: hidden;
        }

        /* গ্লোবাল টপ বার */
        .top-bar {
            padding: 16px; display: flex; justify-content: space-between; align-items: center;
            background: #031129; border-b: 1px solid rgba(30, 58, 138, 0.3); position: sticky; top: 0; z-index: 100;
        }
        .top-brand { display: flex; align-items: center; gap: 8px; }
        .top-logo-circle {
            width: 24px; height: 24px; background: #fbbf24; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #031129; font-weight: 900; font-size: 10px;
        }
        .top-title { color: #fbbf24; font-weight: 700; font-size: 16px; }

        /* ২য় ছবির মেইন ব্যানার এবং ম্যাপ গ্রাফ লোগো ব্যাকগ্রাউন্ড */
        .banner-container { padding: 16px; }
        .main-banner {
            background: linear-gradient(135deg, #051c44 0%, #0c234a 100%);
            background-image: url('https://postimg.co'), linear-gradient(135deg, #051c44 0%, #0c234a 100%);
            background-size: cover; background-position: center;
            padding: 24px; border-radius: 20px; border: 1px solid rgba(30, 58, 138, 0.5); position: relative;
        }
        .banner-title { color: #fbbf24; font-size: 24px; font-weight: 800; margin: 0 0 6px 0; }
        .banner-subtitle { color: #9ca3af; font-size: 12px; margin: 0; font-weight: 400; }

        /* টোটাল অ্যাসেট কার্ড */
        .asset-card {
            margin: 0 16px; padding: 20px; background: rgba(5, 25, 62, 0.6);
            border-radius: 20px; border: 1px solid rgba(30, 58, 138, 0.4);
        }
        .asset-header { display: flex; justify-content: space-between; align-items: center; color: #9ca3af; font-size: 12px; }
        .total-balance { font-size: 32px; font-weight: 700; margin: 6px 0; color: #ffffff; font-family: monospace; }
        .floating-info { display: flex; gap: 16px; font-size: 12px; color: #9ca3af; margin-bottom: 20px; }
        .pl-green { color: #10b981; font-weight: 700; }
        .equity-white { color: #ffffff; }

        /* ৩টি মেইন বাটন লেআউট (ডিপোজিট, উইথড্র, ট্রান্সফার) */
        .action-grid { display: grid; grid-template-cols: repeat(3, 1fr); gap: 12px; }
        .btn-deposit {
            padding: 12px; background: linear-gradient(to right, #f59e0b, #d97706);
            border: none; border-radius: 14px; color: #031129; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center;
        }
        .btn-secondary {
            padding: 12px; background: #0d2754; border: 1px solid rgba(30, 58, 138, 0.6);
            border-radius: 14px; color: #ffffff; font-weight: 500; font-size: 13px; cursor: pointer; text-align: center; text-decoration: none;
        }

        /* অ্যাপ সার্ভিস ৮টি গ্রিড আইকন (২য় ছবির মতো হুবহু আইকন ব্যাকগ্রাউন্ড বক্স) */
        .service-grid {
            margin: 24px 16px; display: grid; grid-template-cols: repeat(4, 1fr); gap: 20px 10px; text-align: center;
        }
        .service-item { display: flex; flex-col: column; flex-direction: column; align-items: center; cursor: pointer; }
        .icon-box {
            width: 48px; height: 48px; background: rgba(5, 25, 62, 0.8); border: 1px solid rgba(30, 58, 138, 0.4);
            border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fbbf24; font-size: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .icon-label { font-size: 11px; color: #9ca3af; margin-top: 8px; font-weight: 500; }

        /* Hot Markets প্যানেল */
        .hot-markets { margin: 24px 16px 0 16px; }
        .hot-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: #9ca3af; margin-bottom: 12px; padding: 0 4px; }
        .hot-row {
            padding: 14px 16px; background: rgba(5, 25, 62, 0.4); border: 1px solid rgba(30, 58, 138, 0.3);
            border-radius: 14px; display: flex; justify-content: space-between; align-items: center;
        }
        .crypto-name { font-size: 14px; font-weight: 700; color: #ffffff; }
        .crypto-sub { font-size: 10px; color: #6b7280; margin-top: 2px; }
        .live-price-box { display: flex; align-items: center; gap: 16px; }
        .price-text { font-size: 14px; font-weight: 700; font-family: monospace; }
        .change-badge { background: rgba(239, 68, 68, 0.2); color: #ef4444; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; font-family: monospace; }

        /* বটম নেভিগেশন বার (২য় ছবির মতো হুবহু গোল্ডেন ট্রেড বাটন সহ) */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: #031129;
            border-t: 1px solid rgba(30, 58, 138, 0.4); padding: 8px 0; display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { background: none; border: none; color: #6b7280; font-size: 10px; font-weight: 600; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-decoration: none; }
        .nav-item i { font-size: 18px; margin-bottom: 4px; }
        .nav-item.active { color: #fbbf24; }
        
        /* মাঝখানের গোল্ডেন ট্রেড সার্কেল বাটন */
        .trade-btn-container { margin-top: -28px; position: relative; text-align: center; }
        .circle-trade-btn {
            width: 48px; height: 48px; background: linear-gradient(to bottom, #fbbf24, #f59e0b);
            border-radius: 50%; border: 4px solid #020b18; display: flex; align-items: center; justify-content: center;
            color: #031129; font-size: 20px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); cursor: pointer;
        }
        .trade-label { font-size: 10px; color: #fbbf24; font-weight: 600; margin-top: 4px; display: block; }

        /* 🔒 গোপন এডমিন প্যানেল */
        .admin-panel { margin: 20px 16px; padding: 16px; background: #170505; border-radius: 16px; border: 1px solid #7f1d1d; display: none; }
        .admin-title { font-size: 13px; font-weight: 700; color: #ef4444; margin: 0 0 12px 0; }
        .admin-input { width: 100%; padding: 10px 12px; background: #020b18; border: 1px solid #7f1d1d; border-radius: 8px; color: #ffffff; font-size: 12px; margin-bottom: 10px; outline: none; box-sizing: border-box; }
        .admin-btn { width: 100%; padding: 10px; background: #b91c1c; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <!-- টপ বার -->
    <div class="top-bar">
        <div class="top-brand">
            <div class="top-logo-circle">CPT</div>
            <span class="top-title">CptMarkets</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="https://flagcdn.com" width="20" style="border-radius: 2px;">
        </div>
    </div>

    <!-- ব্যানার সেকশন (২য় ছবির ম্যাপ ব্যাকগ্রাউন্ড ইফেক্ট সহ) -->
    <div class="banner-container">
        <div class="main-banner">
            <h2 class="banner-title">CptMarkets</h2>
            <p class="banner-subtitle">Global integrated financial trading platform</p>
        </div>
    </div>

    <!-- অ্যাসেট কার্ড (২য় ছবির মতো ব্যালেন্স ইন্টারফেস) -->
    <div class="asset-card">
        <div class="asset-header">
            <span>Total Assets (USD)</span>
            <span id="displayUid" style="color: #fbbf24; font-family: monospace; font-weight: 700;">UID: ------</span>
        </div>
        <div class="total-balance" id="totalBalance">$0.00</div>
        <div class="floating-info">
            <div>Floating P/L <span class="pl-green">+0.00</span></div>
            <div>Equity <span class="equity-white" id="equityAmount">$0.00</span></div>
        </div>

        <!-- অ্যাকশন বাটন প্যানেল -->
        <div class="action-grid">
            <button onclick="alert('Please contact customer care.')" class="btn-deposit">Deposit</button>
            <a href="withdraw.html" class="btn-secondary">Withdraw</a>
            <button onclick="alert('Feature coming soon')" class="btn-secondary">Transfer</button>
        </div>
    </div>

    <!-- অ্যাপ সার্ভিস গ্রিড আইকনসমূহ (২য় ছবির আইকন ও কালার সহ) -->
    <div class="service-grid">
        <div onclick="alert('Please contact customer care.')" class="service-item"><div class="icon-box"><i class="fa-solid fa-headset"></i></div><span class="icon-label">Support</span></div>
        <a href="withdraw.html" class="service-item" style="text-decoration: none;"><div class="icon-box"><i class="fa-solid fa-wallet"></i></div><span class="icon-label">Withdraw</span></a>
        <div onclick="alert('Coming soon')" class="service-item"><div class="icon-box"><i class="fa-solid fa-money-bill-transfer"></i></div><span class="icon-label">Transfer</span></div>
        <div onclick="alert('Coming soon')" class="service-item"><div class="icon-box"><i class="fa-solid fa-users-viewfinder"></i></div><span class="icon-label">Copy Trade</span></div>
        <div onclick="alert('Coming soon')" class="service-item"><div class="icon-box"><i class="fa-solid fa-credit-card"></i></div><span class="icon-label">Loan</span></div>

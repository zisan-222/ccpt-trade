<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #061b38;
            color: white;
        }

        .header {
            padding: 20px;
            background: #0b2345;
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        /* =========================
           TABS
        ========================= */

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #173861;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .tab.active {
            background: #1269a5;
        }

        /* =========================
           ORDER CARD
        ========================= */

        .order-card {
            background: #0d284c;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .side {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .long {
            color: #00df70;
        }

        .short {
            color: #ff4058;
        }

        .admin-side {
            color: #58a6ff;
        }

        .info {
            margin: 7px 0;
            color: #dce8f7;
            font-size: 17px;
        }

        /* =========================
           CLOSE BUTTON
        ========================= */

        .close-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #ff4058;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn:active {
            transform: scale(0.98);
        }

        /* =========================
           PROFIT / LOSS
        ========================= */

        .profit {
            color: #00df70;
            font-weight: bold;
        }

        .loss {
            color: #ff4058;
            font-weight: bold;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #91a6c2;
            font-size: 17px;
        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">
        My Orders
    </div>


    <div class="container">


        <!-- =========================
             TABS
        ========================= -->

        <div class="tabs">

            <button
                id="activeTab"
                class="tab active"
                onclick="showActive()"
            >
                My Orders
            </button>

            <button
                id="historyTab"
                class="tab"
                onclick="showHistory()"
            >
                History
            </button>

        </div>


        <!-- =========================
             ORDERS LIST
        ========================= -->

        <div id="ordersList"></div>


    </div>


<script>


/* ==========================================
   GET TRADE HISTORY
========================================== */

function getHistory() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "cptTradeHistory"
            )
        ) || [];

    } catch (error) {

        return [];

    }

}


/* ==========================================
   SAVE TRADE HISTORY
========================================== */

function saveHistory(history) {

    localStorage.setItem(
        "cptTradeHistory",
        JSON.stringify(history)
    );

}


/* ==========================================
   GET ACTIVE TRADE
========================================== */

function getActiveTrade() {

    const side =
        localStorage.getItem(
            "selectedSide"
        );

    const entryPrice =
        localStorage.getItem(
            "entryPrice"
        );

    const amount =
        localStorage.getItem(
            "tradeAmountValue"
        );


    if (
        !side ||
        !entryPrice ||
        !amount
    ) {

        return null;

    }


    return {

        side: side,

        entryPrice:
            Number(entryPrice),

        amount:
            Number(amount)

    };

}


/* ==========================================
   SET ACTIVE TAB
========================================== */

function setActiveTab(tab) {

    const activeTab =
        document.getElementById(
            "activeTab"
        );

    const historyTab =
        document.getElementById(
            "historyTab"
        );


    if (!activeTab || !historyTab) {
        return;
    }


    activeTab.classList.remove(
        "active"
    );

    historyTab.classList.remove(
        "active"
    );


    if (tab === "active") {

        activeTab.classList.add(
            "active"
        );

    }


    if (tab === "history") {

        historyTab.classList.add(
            "active"
        );

    }

}


/* ==========================================
   SHOW ACTIVE ORDERS
========================================== */

function showActive() {

    setActiveTab("active");


    const list =
        document.getElementById(
            "ordersList"
        );


    const trade =
        getActiveTrade();


    if (!trade) {

        list.innerHTML = `

            <div class="empty">
                No active orders
            </div>

        `;

        return;

    }


    list.innerHTML = `

        <div class="order-card">

            <div class="side ${
                trade.side === "LONG"
                    ? "long"
                    : "short"
            }">

                ${trade.side}

            </div>


            <div class="info">

                Entry Price:
                $${trade.entryPrice.toFixed(2)}

            </div>


            <div class="info">

                Amount:
                $${trade.amount.toFixed(2)}

            </div>


            <button
                class="close-btn"
                onclick="closeTradeFromOrders()"
            >

                Close Trade

            </button>

        </div>

    `;

}


/* ==========================================
   SHOW HISTORY
========================================== */

function showHistory() {

    setActiveTab("history");


    const list =
        document.getElementById(
            "ordersList"
        );


    const history =
        getHistory();


    if (!history.length) {

        list.innerHTML = `

            <div class="empty">
                No trade history
            </div>

        `;

        return;

    }


    list.innerHTML = history.map(
        function (trade) {


            const profitLoss =
                Number(
                    trade.profitLoss ??
                    trade.profitloss ??
                    0
                );


            const profitClass =
                profitLoss >= 0
                    ? "profit"
                    : "loss";


            let sideClass = "";


            if (trade.side === "LONG") {

                sideClass = "long";

            } else if (
                trade.side === "SHORT"
            ) {

                sideClass = "short";

            } else {

                sideClass = "admin-side";

            }


            return `

                <div class="order-card">


                    <div class="side ${sideClass}">

                        ${trade.side || "ADMIN"}

                    </div>


                    <div class="info">

                        Entry:
                        $${Number(
                            trade.entryPrice || 0
                        ).toFixed(2)}

                    </div>


                    <div class="info">

                        Close:
                        $${Number(
                            trade.closePrice || 0
                        ).toFixed(2)}

                    </div>


                    <div class="info">

                        Amount:
                        $${Number(
                            trade.amount || 0
                        ).toFixed(2)}

                    </div>


                    <div class="info">

                        P/L:

                        <span class="${profitClass}">

                            ${
                                profitLoss >= 0
                                    ? "+"
                                    : ""
                            }$${profitLoss.toFixed(2)}

                        </span>

                    </div>


                    <div class="info">

                        ${
                            trade.time ||
                            ""

                        }

                    </div>


                </div>

            `;

        }
    ).join("");

}


/* ==========================================
   CLOSE TRADE FROM MY ORDERS
========================================== */

function closeTradeFromOrders() {


    const trade =
        getActiveTrade();


    if (!trade) {

        alert(
            "No active trade."
        );

        showActive();

        return;

    }


    if (
        !confirm(
            "Close this trade?"
        )
    ) {

        return;

    }


    /*
     * Close price
     *
     * If trade.js saved current
     * price, use it.
     *
     * Otherwise use entry price.
     */

    const savedCurrentPrice =
        localStorage.getItem(
            "currentTradePrice"
        );


    const closePrice =
        savedCurrentPrice
            ? Number(savedCurrentPrice)
            : trade.entryPrice;


    /* =========================
       CALCULATE P/L
    ========================= */

    let profitLoss = 0;


    if (
        trade.side === "LONG"
    ) {

        profitLoss =
            (
                (closePrice -
                    trade.entryPrice)
                /
                trade.entryPrice
            )
            *
            trade.amount;

    }


    if (
        trade.side === "SHORT"
    ) {

        profitLoss =
            (
                (trade.entryPrice -
                    closePrice)
                /
                trade.entryPrice
            )
            *
            trade.amount;

    }


    /* =========================
       CREATE HISTORY
    ========================= */

    const closedTrade = {

        side:
            trade.side,

        entryPrice:
            Number(
                trade.entryPrice.toFixed(2)
            ),

        closePrice:
            Number(
                closePrice.toFixed(2)
            ),

        amount:
            Number(
                trade.amount.toFixed(2)
            ),

        profitLoss:
            Number(
                profitLoss.toFixed(2)
            ),

        time:
            new Date().toLocaleString(),

        source:
            "USER"

    };


    /* =========================
       GET OLD HISTORY
    ========================= */

    const history =
        getHistory();


    history.unshift(
        closedTrade
    );


    saveHistory(
        history
    );


    /* =========================
       REMOVE ACTIVE TRADE
    ========================= */

    localStorage.removeItem(
        "selectedSide"
    );

    localStorage.removeItem(
        "entryPrice"
    );

    localStorage.removeItem(
        "tradeAmountValue"
    );

    localStorage.removeItem(
        "currentTradePrice"
    );


    /* =========================
       SHOW MY ORDERS AGAIN
    ========================= */

    showActive();


    alert(
        trade.side +
        " trade closed successfully.\n\n" +

        "Close Price: $" +
        closePrice.toFixed(2) +

        "\nP/L: $" +
        profitLoss.toFixed(2)
    );

}


/* ==========================================
   INITIAL LOAD
========================================== */

showActive();


/* ==========================================
   AUTO REFRESH
========================================== */

window.addEventListener(
    "storage",
    function () {

        const activeTab =
            document
                .getElementById(
                    "activeTab"
                )
                ?.classList
                .contains("active");


        if (activeTab) {

            showActive();

        } else {

            showHistory();

        }

    }
);


</script>


</body>

</html>

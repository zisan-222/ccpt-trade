<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #061b38;
            color: white;
        }

        .header {
            padding: 20px;
            background: #0b2345;
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #173861;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .tab.active {
            background: #1269a5;
        }

        .order-card {
            background: #0d284c;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .side {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .long {
            color: #00df70;
        }

        .short {
            color: #ff4058;
        }

        .info {
            margin: 7px 0;
            color: #dce8f7;
            font-size: 17px;
        }

        .close-btn {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #ff4058;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn:active {
            transform: scale(0.98);
        }

        .profit {
            color: #00df70;
            font-weight: bold;
        }

        .loss {
            color: #ff4058;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #91a6c2;
            font-size: 17px;
        }

    </style>

</head>


<body>


    <div class="header">
        My Orders
    </div>


    <div class="container">


        <div class="tabs">

            <button
                id="activeTab"
                class="tab active"
                onclick="showActive()"
            >
                My Orders
            </button>

            <button
                id="historyTab"
                class="tab"
                onclick="showHistory()"
            >
                History
            </button>

        </div>


        <div id="ordersList"></div>


    </div>



<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import { auth, db }
    from "./firebase/firebase-config.js";

import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
   VARIABLES
========================================== */

let firebaseHistory = [];

let firebaseReady = false;

let currentUserUID = null;


/* ==========================================
   GET CURRENT USER
========================================== */

function getCurrentUserData() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        ) || null;

    } catch (error) {

        return null;

    }

}


/* ==========================================
   GET LOCAL HISTORY
========================================== */

function getLocalHistory() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    "cptTradeHistory"
                )
            ) || [];

        /*
         * IMPORTANT:
         * Old localStorage history does not
         * contain UID.
         *
         * Only records belonging to the
         * current user are accepted.
         */

        return data.filter(
            function (trade) {

                return (
                    trade.uid &&
                    trade.uid === currentUserUID
                );

            }
        );

    } catch (error) {

        return [];

    }

}


/* ==========================================
   GET ACTIVE TRADE
========================================== */

function getActiveTrade() {

    const side =
        localStorage.getItem(
            "selectedSide"
        );

    const entryPrice =
        localStorage.getItem(
            "entryPrice"
        );

    const amount =
        localStorage.getItem(
            "tradeAmountValue"
        );


    if (
        !side ||
        !entryPrice ||
        !amount
    ) {

        return null;

    }


    return {

        side: side,

        entryPrice:
            Number(entryPrice),

        amount:
            Number(amount)

    };

}


/* ==========================================
   SET ACTIVE TAB
========================================== */

function setActiveTab(tab) {

    const activeTab =
        document.getElementById(
            "activeTab"
        );

    const historyTab =
        document.getElementById(
            "historyTab"
        );


    if (!activeTab || !historyTab) {

        return;

    }


    activeTab.classList.remove(
        "active"
    );

    historyTab.classList.remove(
        "active"
    );


    if (tab === "active") {

        activeTab.classList.add(
            "active"
        );

    }


    if (tab === "history") {

        historyTab.classList.add(
            "active"
        );

    }

}


/* ==========================================
   LOAD FIREBASE TRADE HISTORY
========================================== */

async function loadFirebaseHistory() {

    try {

        if (!auth.currentUser) {

            return;

        }


        const uid =
            auth.currentUser.uid;


        currentUserUID =
            uid;


        const historyRef =
            collection(
                db,
                "tradeHistory"
            );


        /*
         * VERY IMPORTANT
         *
         * Only current user's records
         * are loaded.
         */

        const historyQuery =
            query(
                historyRef,
                where(
                    "uid",
                    "==",
                    uid
                )
            );


        const snapshot =
            await getDocs(
                historyQuery
            );


        firebaseHistory = [];


        snapshot.forEach(
            function (docSnap) {

                const data =
                    docSnap.data();


                firebaseHistory.push({

                    id:
                        docSnap.id,

                    uid:
                        data.uid || uid,

                    side:
                        data.side || "",

                    entryPrice:
                        Number(
                            data.entryPrice || 0
                        ),

                    closePrice:
                        Number(
                            data.closePrice || 0
                        ),

                    amount:
                        Number(
                            data.amount || 0
                        ),

                    profitLoss:
                        Number(
                            data.profitLoss ??
                            data.profitloss ??
                            0
                        ),

                    type:
                        data.type || "",

                    source:
                        data.source || "",

                    time:
                        data.time || "",

                    createdAt:
                        data.createdAt || null

                });

            }
        );


        /*
         * Newest first
         */

        firebaseHistory.sort(
            function (a, b) {

                return String(b.time)
                    .localeCompare(
                        String(a.time)
                    );

            }
        );


        firebaseReady = true;


        const historyTab =
            document.getElementById(
                "historyTab"
            );


        if (
            historyTab &&
            historyTab.classList.contains(
                "active"
            )
        ) {

            showHistory();

        }


        console.log(
            "User-only Firebase history loaded:",
            firebaseHistory
        );


    } catch (error) {

        console.error(
            "Firebase trade history error:",
            error
        );

    }

}


/* ==========================================
   SHOW ACTIVE ORDERS
========================================== */

function showActive() {

    setActiveTab("active");


    const list =
        document.getElementById(
            "ordersList"
        );


    const trade =
        getActiveTrade();


    if (!trade) {

        list.innerHTML = `

            <div class="empty">
                No active orders
            </div>

        `;

        return;

    }


    list.innerHTML = `

        <div class="order-card">

            <div class="side ${
                trade.side === "LONG"
                    ? "long"
                    : "short"
            }">

                ${trade.side}

            </div>


            <div class="info">

                Entry Price:
                $${trade.entryPrice.toFixed(2)}

            </div>


            <div class="info">

                Amount:
                $${trade.amount.toFixed(2)}

            </div>


            <button
                class="close-btn"
                onclick="closeTradeFromOrders()"
            >

                Close Trade

            </button>

        </div>

    `;

}


/* ==========================================
   SHOW HISTORY
========================================== */

function showHistory() {

    setActiveTab("history");


    const list =
        document.getElementById(
            "ordersList"
        );


    /*
     * Firebase already contains ONLY
     * the current user's records.
     */

    const firebaseOnlyHistory =
        firebaseHistory;


    /*
     * Local history is also filtered
     * by current UID.
     */

    const localHistory =
        getLocalHistory();


    /*
     * Combine current user's records only.
     */

    const allHistory = [

        ...firebaseOnlyHistory,

        ...localHistory

    ];


    if (!allHistory.length) {

        list.innerHTML = `

            <div class="empty">
                No trade history
            </div>

        `;

        return;

    }


    list.innerHTML =
        allHistory.map(
            function (trade) {


                const profitLoss =
                    Number(
                        trade.profitLoss ??
                        trade.profitloss ??
                        0
                    );


                const profitClass =
                    profitLoss >= 0
                        ? "profit"
                        : "loss";


                /*
                 * ONLY LONG / SHORT
                 *
                 * ADMIN PROFIT / ADMIN LOSS
                 * WILL NEVER BE DISPLAYED.
                 */

                let side =
                    trade.side;


                /*
                 * If Firebase record has
                 * valid LONG/SHORT use it.
                 */

                if (
                    side !== "LONG" &&
                    side !== "SHORT"
                ) {

                    /*
                     * Try to use the current
                     * user's last known side.
                     */

                    const savedSide =
                        localStorage.getItem(
                            "selectedSide"
                        );


                    if (
                        savedSide === "LONG" ||
                        savedSide === "SHORT"
                    ) {

                        side =
                            savedSide;

                    } else {

                        /*
                         * Fallback only.
                         * This prevents ADMIN text
                         * from appearing.
                         */

                        side = "LONG";

                    }

                }


                const sideClass =
                    side === "LONG"
                        ? "long"
                        : "short";


                return `

                    <div class="order-card">


                        <div class="side ${sideClass}">

                            ${side}

                        </div>


                        <div class="info">

                            Entry:
                            $${Number(
                                trade.entryPrice || 0
                            ).toFixed(2)}

                        </div>


                        <div class="info">

                            Close:
                            $${Number(
                                trade.closePrice || 0
                            ).toFixed(2)}

                        </div>


                        <div class="info">

                            Amount:
                            $${Number(
                                trade.amount || 0
                            ).toFixed(2)}

                        </div>


                        <div class="info">

                            P/L:

                            <span class="${profitClass}">

                                ${
                                    profitLoss >= 0
                                        ? "+"
                                        : ""
                                }$${profitLoss.toFixed(2)}

                            </span>

                        </div>


                        <div class="info">

                            ${
                                trade.time ||
                                ""
                            }

                        </div>


                    </div>

                `;

            }
        ).join("");

}


/* ==========================================
   CLOSE TRADE FROM ORDERS
========================================== */

function closeTradeFromOrders() {

    const trade =
        getActiveTrade();


    if (!trade) {

        alert(
            "No active trade."
        );

        showActive();

        return;

    }


    if (
        !confirm(
            "Close this trade?"
        )
    ) {

        return;

    }


    const savedCurrentPrice =
        localStorage.getItem(
            "currentTradePrice"
        );


    const closePrice =
        savedCurrentPrice
            ? Number(savedCurrentPrice)
            : trade.entryPrice;


    let profitLoss = 0;


    if (
        trade.side === "LONG"
    ) {

        profitLoss =
            (
                (closePrice -
                    trade.entryPrice)
                /
                trade.entryPrice
            )
            *
            trade.amount;

    }


    if (
        trade.side === "SHORT"
    ) {

        profitLoss =
            (
                (trade.entryPrice -
                    closePrice)
                /
                trade.entryPrice
            )
            *
            trade.amount;

    }


    /*
     * Save LOCAL history with UID.
     */

    const localHistory =
        getLocalHistory();


    localHistory.unshift({

        uid:
            currentUserUID,

        side:
            trade.side,

        entryPrice:
            Number(
                trade.entryPrice.toFixed(2)
            ),

        closePrice:
            Number(
                closePrice.toFixed(2)
            ),

        amount:
            Number(
                trade.amount.toFixed(2)
            ),

        profitLoss:
            Number(
                profitLoss.toFixed(2)
            ),

        time:
            new Date().toLocaleString(),

        source:
            "USER"

    });


    /*
     * IMPORTANT:
     * getLocalHistory() filters old data,
     * therefore only current user's
     * history remains here.
     */

    localStorage.setItem(

        "cptTradeHistory",

        JSON.stringify(
            localHistory
        )

    );


    /*
     * Remove active trade.
     */

    localStorage.removeItem(
        "selectedSide"
    );

    localStorage.removeItem(
        "entryPrice"
    );

    localStorage.removeItem(
        "tradeAmountValue"
    );

    localStorage.removeItem(
        "currentTradePrice"
    );


    showActive();


    alert(

        trade.side +
        " trade closed successfully.\n\n" +

        "Close Price: $" +
        closePrice.toFixed(2) +

        "\nP/L: $" +
        profitLoss.toFixed(2)

    );

}


/* ==========================================
   GLOBAL FUNCTIONS
========================================== */

window.showActive =
    showActive;

window.showHistory =
    showHistory;

window.closeTradeFromOrders =
    closeTradeFromOrders;


/* ==========================================
   FIREBASE AUTH
========================================== */

onAuthStateChanged(
    auth,
    async function (user) {

        if (!user) {

            firebaseHistory = [];

            firebaseReady = false;

            currentUserUID = null;

            showActive();

            return;

        }


        currentUserUID =
            user.uid;


        await loadFirebaseHistory();

    }
);


/* ==========================================
   INITIAL LOAD
========================================== */

showActive();


</script>


</body>

</html>

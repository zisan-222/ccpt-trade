<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CptMarkets - My Orders</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #061b38;
            color: white;
        }

        .header {
            padding: 20px;
            background: #0b2345;
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
            padding-bottom: 40px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #173861;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .tab.active {
            background: #1269a5;
        }

        .order-card {
            background: #0d284c;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .side {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .long {
            color: #00df70;
        }

        .short {
            color: #ff4058;
        }

        .info {
            margin: 8px 0;
            color: #dce8f7;
            font-size: 16px;
        }

        .info strong {
            color: white;
        }

        .close-btn {
            width: 100%;
            margin-top: 14px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #ff4058;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn:active {
            transform: scale(0.98);
        }

        .profit {
            color: #00df70;
            font-weight: bold;
        }

        .loss {
            color: #ff4058;
            font-weight: bold;
        }

        .pending {
            color: #ffc107;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 50px 10px;
            color: #91a6c2;
            font-size: 17px;
        }

        .trade-id {
            font-size: 12px;
            color: #7893b4;
            margin-top: 10px;
            word-break: break-all;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 7px;
            background: #173861;
            color: #bcd1e9;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .status.open {
            color: #00df70;
        }

        .status.closed {
            color: #91a6c2;
        }

    </style>

</head>


<body>


<div class="header">
    My Orders
</div>


<div class="container">


    <!-- =================================
         TABS
    ================================== -->

    <div class="tabs">

        <button
            id="activeTab"
            class="tab active"
            type="button"
            onclick="showActive()"
        >
            My Orders
        </button>


        <button
            id="historyTab"
            class="tab"
            type="button"
            onclick="showHistory()"
        >
            History
        </button>

    </div>


    <!-- =================================
         ORDERS LIST
    ================================== -->

    <div id="ordersList"></div>


</div>



<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import { auth, db }
    from "./firebase/firebase-config.js";


import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    addDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* ==========================================
   VARIABLES
========================================== */

let firebaseHistory = [];

let currentUserUID = null;

let firebaseReady = false;

let closingTrade = false;



/* ==========================================
   CURRENT USER DATA
========================================== */

function getCurrentUserData() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        ) || null;

    } catch (error) {

        return null;

    }

}



/* ==========================================
   ACTIVE TRADE
========================================== */

function getActiveTrade() {

    const side =
        localStorage.getItem(
            "selectedSide"
        );


    const entryPrice =
        localStorage.getItem(
            "entryPrice"
        );


    const amount =
        localStorage.getItem(
            "tradeAmountValue"
        );


    const tradeId =
        localStorage.getItem(
            "currentTradeId"
        );


    if (
        !side ||
        !entryPrice ||
        !amount
    ) {

        return null;

    }


    if (
        side !== "LONG" &&
        side !== "SHORT"
    ) {

        return null;

    }


    return {

        tradeId:
            tradeId || "",

        side:
            side,

        entryPrice:
            Number(entryPrice),

        amount:
            Number(amount)

    };

}



/* ==========================================
   CURRENT PRICE
========================================== */

function getCurrentTradePrice() {

    const saved =
        localStorage.getItem(
            "currentTradePrice"
        );


    if (
        saved &&
        Number(saved) > 0
    ) {

        return Number(saved);

    }


    /*
     * Fallback to the entry price.
     *
     * This prevents an incorrect price
     * from being generated by orders.html.
     */

    const entry =
        localStorage.getItem(
            "entryPrice"
        );


    return Number(entry) || 0;

}



/* ==========================================
   LOCAL HISTORY
========================================== */

function getLocalHistory() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    "cptTradeHistory"
                )
            ) || [];


        return data.filter(
            function (trade) {

                /*
                 * If UID exists, only show
                 * current user's records.
                 */

                if (trade.uid) {

                    return (
                        trade.uid ===
                        currentUserUID
                    );

                }


                /*
                 * Old records without UID
                 * are ignored.
                 */

                return false;

            }
        );


    } catch (error) {

        return [];

    }

}



/* ==========================================
   SAVE LOCAL HISTORY
========================================== */

function saveLocalHistory(history) {

    localStorage.setItem(

        "cptTradeHistory",

        JSON.stringify(history)

    );

}



/* ==========================================
   CHECK DUPLICATE HISTORY
========================================== */

function historyAlreadyExists(
    history,
    tradeId
) {

    if (!tradeId) {

        return false;

    }


    return history.some(
        function (trade) {

            return (
                trade.tradeId ===
                tradeId
            );

        }
    );

}



/* ==========================================
   CLEAR ACTIVE TRADE
========================================== */

function clearActiveTrade() {

    localStorage.removeItem(
        "selectedSide"
    );

    localStorage.removeItem(
        "entryPrice"
    );

    localStorage.removeItem(
        "tradeAmountValue"
    );

    localStorage.removeItem(
        "currentTradePrice"
    );

    localStorage.removeItem(
        "currentTradeId"
    );

    localStorage.removeItem(
        "pendingTradeProfit"
    );

    localStorage.removeItem(
        "pendingTradeLoss"
    );

    localStorage.removeItem(
        "pendingTradeResult"
    );

}



/* ==========================================
   SET ACTIVE TAB
========================================== */

function setActiveTab(tab) {

    const activeTab =
        document.getElementById(
            "activeTab"
        );


    const historyTab =
        document.getElementById(
            "historyTab"
        );


    if (
        !activeTab ||
        !historyTab
    ) {

        return;

    }


    activeTab.classList.remove(
        "active"
    );

    historyTab.classList.remove(
        "active"
    );


    if (
        tab === "active"
    ) {

        activeTab.classList.add(
            "active"
        );

    }


    if (
        tab === "history"
    ) {

        historyTab.classList.add(
            "active"
        );

    }

}



/* ==========================================
   LOAD FIREBASE HISTORY
========================================== */

async function loadFirebaseHistory() {

    try {

        if (
            !auth.currentUser
        ) {

            return;

        }


        currentUserUID =
            auth.currentUser.uid;


        const historyRef =
            collection(
                db,
                "tradeHistory"
            );


        const historyQuery =
            query(

                historyRef,

                where(
                    "uid",
                    "==",
                    currentUserUID
                )

            );


        const snapshot =
            await getDocs(
                historyQuery
            );


        firebaseHistory = [];


        snapshot.forEach(
            function (docSnap) {

                const data =
                    docSnap.data();


                /*
                 * ADMIN-only records are
                 * not displayed as trades.
                 */

                if (
                    data.source === "ADMIN" &&
                    (
                        data.side === "ADMIN" ||
                        !data.tradeId
                    )
                ) {

                    return;

                }


                firebaseHistory.push({

                    id:
                        docSnap.id,

                    tradeId:
                        data.tradeId ||
                        "",

                    uid:
                        data.uid ||
                        currentUserUID,

                    side:
                        data.side ||
                        "",

                    entryPrice:
                        Number(
                            data.entryPrice ||
                            0
                        ),

                    closePrice:
                        Number(
                            data.closePrice ||
                            0
                        ),

                    amount:
                        Number(
                            data.amount ||
                            0
                        ),

                    profitLoss:
                        Number(
                            data.profitLoss ??
                            data.profitloss ??
                            0
                        ),

                    type:
                        data.type ||
                        "TRADE",

                    source:
                        data.source ||
                        "USER",

                    time:
                        data.time ||
                        "",

                    createdAt:
                        data.createdAt ||
                        null

                });

            }
        );


        firebaseHistory.sort(
            function (a, b) {

                return String(
                    b.time
                ).localeCompare(
                    String(a.time)
                );

            }
        );


        firebaseReady =
            true;


        /*
         * If History tab is open,
         * refresh immediately.
         */

        const historyTab =
            document.getElementById(
                "historyTab"
            );


        if (
            historyTab &&
            historyTab.classList.contains(
                "active"
            )
        ) {

            showHistory();

        }


    } catch (error) {

        console.error(
            "Firebase history error:",
            error
        );

    }

}



/* ==========================================
   SHOW ACTIVE ORDERS
========================================== */

function showActive() {

    setActiveTab(
        "active"
    );


    const list =
        document.getElementById(
            "ordersList"
        );


    if (!list) {

        return;

    }


    const trade =
        getActiveTrade();


    if (!trade) {

        list.innerHTML = `

            <div class="empty">

                No active orders

            </div>

        `;

        return;

    }


    const sideClass =
        trade.side === "LONG"
            ? "long"
            : "short";


    list.innerHTML = `

        <div
            class="order-card"
            id="activeOrderCard"
        >

            <span class="status open">
                OPEN
            </span>


            <div class="side ${sideClass}">

                ${trade.side}

            </div>


            <div class="info">

                Entry Price:

                <strong>
                    $${trade.entryPrice.toFixed(2)}
                </strong>

            </div>


            <div class="info">

                Amount:

                <strong>
                    $${trade.amount.toFixed(2)}
                </strong>

            </div>


            ${
                trade.tradeId
                    ? `
                        <div class="trade-id">
                            Trade ID:
                            ${trade.tradeId}
                        </div>
                    `
                    : ""
            }


            <button
                class="close-btn"
                id="ordersCloseTradeBtn"
                type="button"
            >

                Close Trade

            </button>

        </div>

    `;


    const closeButton =
        document.getElementById(
            "ordersCloseTradeBtn"
        );


    if (closeButton) {

        closeButton.addEventListener(
            "click",
            closeTradeFromOrders
        );

    }

}



/* ==========================================
   GET ADMIN PENDING RESULT
========================================== */

async function getPendingAdminResult(
    trade
) {

    try {

        if (
            !currentUserUID
        ) {

            return {

                amount: 0,
                type: null,
                tradeId: ""

            };

        }


        /*
         * First try the active trade ID
         * from localStorage.
         */

        if (
            trade.tradeId
        ) {

            const tradeRef =
                doc(
                    db,
                    "tradeHistory",
                    trade.tradeId
                );


            const tradeSnap =
                await getDoc(
                    tradeRef
                );


            if (
                tradeSnap.exists()
            ) {

                const data =
                    tradeSnap.data();


                const pending =
                    Number(
                        data.pendingProfitLoss ||
                        0
                    );


                if (
                    pending !== 0
                ) {

                    return {

                        amount:
                            pending,

                        type:
                            pending > 0
                                ? "PROFIT"
                                : "LOSS",

                        tradeId:
                            trade.tradeId

                    };

                }

            }

        }


        /*
         * Also check the user's document.
         *
         * This supports the admin control
         * where the pending result is stored
         * against the user until trade close.
         */

        const userRef =
            doc(
                db,
                "users",
                currentUserUID
            );


        const userSnap =
            await getDoc(
                userRef
            );


        if (
            !userSnap.exists()
        ) {

            return {

                amount: 0,
                type: null,
                tradeId: ""

            };

        }


        const userData =
            userSnap.data();


        const pendingValue =
            Number(
                userData.pendingTradeProfitLoss ||
                0
            );


        const pendingTradeId =
            userData.pendingTradeId ||
            "";


        /*
         * If a specific pending trade ID
         * exists, make sure it belongs to
         * this active trade.
         */

        if (
            pendingTradeId &&
            trade.tradeId &&
            pendingTradeId !==
            trade.tradeId
        ) {

            return {

                amount: 0,
                type: null,
                tradeId: ""

            };

        }


        if (
            pendingValue === 0
        ) {

            return {

                amount: 0,
                type: null,
                tradeId: ""

            };

        }


        return {

            amount:
                pendingValue,

            type:
                pendingValue > 0
                    ? "PROFIT"
                    : "LOSS",

            tradeId:
                pendingTradeId ||
                trade.tradeId ||
                ""

        };


    } catch (error) {

        console.error(
            "Pending admin result error:",
            error
        );


        return {

            amount: 0,
            type: null,
            tradeId: ""

        };

    }

}



/* ==========================================
   CLOSE TRADE FROM ORDERS
========================================== */

async function closeTradeFromOrders() {

    if (closingTrade) {

        return;

    }


    const trade =
        getActiveTrade();


    if (!trade) {

        alert(
            "No active trade."
        );


        showActive();

        return;

    }


    if (
        !currentUserUID &&
        auth.currentUser
    ) {

        currentUserUID =
            auth.currentUser.uid;

    }


    const confirmed =
        confirm(
            "Close this trade?"
        );


    if (!confirmed) {

        return;

    }


    closingTrade =
        true;


    try {

        /*
         * IMPORTANT:
         * Get admin-assigned result BEFORE
         * clearing the active trade.
         */

        const adminResult =
            await getPendingAdminResult(
                trade
            );


        /*
         * Current market price.
         */

        const closePrice =
            getCurrentTradePrice();


        /*
         * Normal market P/L.
         */

        let marketProfitLoss = 0;


        if (
            trade.side === "LONG"
        ) {

            marketProfitLoss =

                (
                    (
                        closePrice -
                        trade.entryPrice
                    )
                    /
                    trade.entryPrice
                )
                *
                trade.amount;

        }


        if (
            trade.side === "SHORT"
        ) {

            marketProfitLoss =

                (
                    (
                        trade.entryPrice -
                        closePrice
                    )
                    /
                    trade.entryPrice
                )
                *
                trade.amount;

        }


        /*
         * ADMIN RESULT HAS PRIORITY.
         *
         * If admin gave +50 profit,
         * the final trade result is +50.
         *
         * If admin gave -30 loss,
         * the final trade result is -30.
         *
         * It is NOT added to the balance
         * before closing.
         */

        let finalProfitLoss =
            marketProfitLoss;


        if (
            adminResult.amount !== 0
        ) {

            finalProfitLoss =
                adminResult.amount;

        }


        finalProfitLoss =
            Number(
                finalProfitLoss.toFixed(2)
            );


        /*
         * ==================================
         * PREVENT DUPLICATE LOCAL HISTORY
         * ==================================
         */

        let localHistory =
            getLocalHistory();


        const alreadyExists =
            historyAlreadyExists(
                localHistory,
                trade.tradeId
            );


        if (!alreadyExists) {

            localHistory.unshift({

                uid:
                    currentUserUID,

                tradeId:
                    trade.tradeId ||
                    "",

                side:
                    trade.side,

                entryPrice:
                    Number(
                        trade.entryPrice.toFixed(2)
                    ),

                closePrice:
                    Number(
                        closePrice.toFixed(2)
                    ),

                amount:
                    Number(
                        trade.amount.toFixed(2)
                    ),

                profitLoss:
                    finalProfitLoss,

                type:
                    "TRADE",

                source:
                    "USER",

                time:
                    new Date().toLocaleString()

            });


            saveLocalHistory(
                localHistory
            );

        }



        /* ==================================
           FIREBASE TRADE HISTORY
        ================================== */

        if (
            currentUserUID
        ) {

            /*
             * Check if this trade already
             * exists in Firebase.
             */

            let firebaseTradeExists =
                false;


            if (
                trade.tradeId
            ) {

                const tradeRef =
                    doc(
                        db,
                        "tradeHistory",
                        trade.tradeId
                    );


                const tradeSnap =
                    await getDoc(
                        tradeRef
                    );


                if (
                    tradeSnap.exists()
                ) {

                    firebaseTradeExists =
                        true;

                }

            }


            /*
             * If not already stored,
             * create exactly ONE record.
             */

            if (
                !firebaseTradeExists
            ) {

                await addDoc(

                    collection(
                        db,
                        "tradeHistory"
                    ),

                    {

                        uid:
                            currentUserUID,

                        tradeId:
                            trade.tradeId ||
                            "",

                        side:
                            trade.side,

                        entryPrice:
                            Number(
                                trade.entryPrice.toFixed(2)
                            ),

                        closePrice:
                            Number(
                                closePrice.toFixed(2)
                            ),

                        amount:
                            Number(
                                trade.amount.toFixed(2)
                            ),

                        profitLoss:
                            finalProfitLoss,

                        type:
                            "TRADE",

                        source:
                            "USER",

                        time:
                            new Date().toLocaleString(),

                        createdAt:
                            serverTimestamp()

                    }

                );

            }

        }



        /* ==================================
           BALANCE UPDATE
        ================================== */

        /*
         * The original margin was already
         * deducted when the trade opened.
         *
         * At close:
         *
         * balance += amount + final P/L
         *
         * Therefore admin profit is applied
         * ONLY NOW.
         */

        if (
            currentUserUID
        ) {

            const userRef =
                doc(
                    db,
                    "users",
                    currentUserUID
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                userSnap.exists()
            ) {

                const userData =
                    userSnap.data();


                const currentBalance =
                    Number(
                        userData.balance ||
                        0
                    );


                const returnedAmount =
                    Number(
                        trade.amount
                    );


                const newBalance =
                    Number(
                        (
                            currentBalance +
                            returnedAmount +
                            finalProfitLoss
                        ).toFixed(2)
                    );


                /*
                 * Clear pending admin result
                 * at the same time as balance
                 * is updated.
                 */

                await updateDoc(

                    userRef,

                    {

                        balance:
                            newBalance,

                        pendingTradeProfitLoss:
                            0,

                        pendingTradeId:
                            ""

                    }

                );

            }

        }



        /* ==================================
           CLEAR ACTIVE TRADE
        ================================== */

        clearActiveTrade();


        /*
         * Notify other open pages/tabs.
         */

        localStorage.setItem(
            "cptTradeClosedAt",
            String(Date.now())
        );


        /*
         * Remove notification shortly after.
         */

        setTimeout(
            function () {

                localStorage.removeItem(
                    "cptTradeClosedAt"
                );

            },
            1000
        );


        /*
         * Refresh this page.
         */

        showActive();


        /*
         * Refresh Firebase history.
         */

        await loadFirebaseHistory();


        /*
         * Success message.
         */

        alert(

            trade.side +
            " trade closed successfully.\n\n" +

            "Close Price: $" +
            closePrice.toFixed(2) +

            "\nAmount: $" +
            trade.amount.toFixed(2) +

            "\nProfit/Loss: $" +
            finalProfitLoss.toFixed(2)

        );


    } catch (error) {

        console.error(
            "Close trade failed:",
            error
        );


        alert(
            "Unable to close trade.\n\n" +
            error.message
        );


    } finally {

        closingTrade =
            false;

    }

}



/* ==========================================
   SHOW HISTORY
========================================== */

function showHistory() {

    setActiveTab(
        "history"
    );


    const list =
        document.getElementById(
            "ordersList"
        );


    if (!list) {

        return;

    }


    const localHistory =
        getLocalHistory();


    /*
     * Combine Firebase and local history,
     * but remove duplicate trade IDs.
     */

    const combined = [];

    const seenTradeIds =
        new Set();


    firebaseHistory.forEach(
        function (trade) {

            /*
             * Never display ADMIN-only records.
             */

            if (
                trade.source === "ADMIN" ||
                trade.side === "ADMIN"
            ) {

                return;

            }


            if (
                trade.side !== "LONG" &&
                trade.side !== "SHORT"
            ) {

                return;

            }


            const id =
                trade.tradeId ||
                trade.id;


            if (
                id &&
                seenTradeIds.has(id)
            ) {

                return;

            }


            if (id) {

                seenTradeIds.add(id);

            }


            combined.push(
                trade
            );

        }
    );


    localHistory.forEach(
        function (trade) {

            if (
                trade.side !== "LONG" &&
                trade.side !== "SHORT"
            ) {

                return;

            }


            const id =
                trade.tradeId ||
                "";


            if (
                id &&
                seenTradeIds.has(id)
            ) {

                return;

            }


            if (id) {

                seenTradeIds.add(id);

            }


            combined.push(
                trade
            );

        }
    );


    if (
        !combined.length
    ) {

        list.innerHTML = `

            <div class="empty">

                No trade history

            </div>

        `;

        return;

    }


    list.innerHTML =
        combined.map(
            function (trade) {


                const profitLoss =
                    Number(
                        trade.profitLoss ??
                        trade.profitloss ??
                        0
                    );


                const profitClass =
                    profitLoss >= 0
                        ? "profit"
                        : "loss";


                const side =
                    trade.side;


                const sideClass =
                    side === "LONG"
                        ? "long"
                        : "short";


                return `

                    <div class="order-card">


                        <span class="status closed">
                            CLOSED
                        </span>


                        <div class="side ${sideClass}">

                            ${side}

                        </div>


                        <div class="info">

                            Entry Price:

                            <strong>
                                $${Number(
                                    trade.entryPrice ||
                                    0
                                ).toFixed(2)}
                            </strong>

                        </div>


                        <div class="info">

                            Close Price:

                            <strong>
                                $${Number(
                                    trade.closePrice ||
                                    0
                                ).toFixed(2)}
                            </strong>

                        </div>


                        <div class="info">

                            Amount:

                            <strong>
                                $${Number(
                                    trade.amount ||
                                    0
                                ).toFixed(2)}
                            </strong>

                        </div>


                        <div class="info">

                            Profit / Loss:

                            <span class="${profitClass}">

                                ${
                                    profitLoss >= 0
                                        ? "+"
                                        : ""
                                }$${profitLoss.toFixed(2)}

                            </span>

                        </div>


                        <div class="info">

                            ${
                                trade.time ||
                                ""
                            }

                        </div>


                        ${
                            trade.tradeId
                                ? `
                                    <div class="trade-id">

                                        Trade ID:
                                        ${trade.tradeId}

                                    </div>
                                `
                                : ""
                        }


                    </div>

                `;

            }
        ).join("");

}



/* ==========================================
   CROSS-PAGE CLOSE DETECTION
========================================== */

window.addEventListener(
    "storage",
    function (event) {

        if (
            event.key ===
            "cptTradeClosedAt"
        ) {

            showActive();

            loadFirebaseHistory();

        }


        if (
            event.key ===
            "currentTradeId"
        ) {

            showActive();

        }


        if (
            event.key ===
            "selectedSide"
        ) {

            showActive();

        }

    }
);



/* ==========================================
   PAGE VISIBILITY
========================================== */

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            !document.hidden
        ) {

            showActive();

        }

    }
);



/* ==========================================
   GLOBAL FUNCTIONS
========================================== */

window.showActive =
    showActive;


window.showHistory =
    showHistory;


window.closeTradeFromOrders =
    closeTradeFromOrders;



/* ==========================================
   FIREBASE AUTH
========================================== */

onAuthStateChanged(

    auth,

    async function (user) {

        if (!user) {

            firebaseHistory = [];

            firebaseReady =
                false;

            currentUserUID =
                null;

            showActive();

            return;

        }


        currentUserUID =
            user.uid;


        await loadFirebaseHistory();


        showActive();

    }

);



/* ==========================================
   INITIAL LOAD
========================================== */

showActive();


</script>


</body>

</html>

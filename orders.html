<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CptMarkets - My Orders</title>

    <style>

        :root {
            --bg-color: #030408;
            --card-bg: #0b0f19;
            --card-border: #1e2538;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            background: linear-gradient(180deg, #0d1322 0%, #030408 100%);
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .header-title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Force First Letter Capital via CSS to override translator JS */
        .header-title-area span, .tab {
            text-transform: capitalize;
        }

        /* 3D Back Button */
        .back-btn {
            background: linear-gradient(135deg, #1e2538 0%, #111726 100%);
            border: 1px solid #2e3854;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0b0f19, 0 6px 10px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }
        .back-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0b0f19, 0 2px 5px rgba(0,0,0,0.5);
        }

        .container {
            padding: 20px;
            padding-bottom: 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Fixed / Sticky Tabs Container */
        .tabs-wrapper {
            position: sticky;
            top: 74px;
            background-color: var(--bg-color);
            padding: 10px 0 15px 0;
            z-index: 99;
        }

        .tabs {
            display: flex;
            gap: 12px;
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Sleek 3D Professional Tabs */
        .tab {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #1e293b;
            border-radius: 12px;
            background: linear-gradient(145deg, #0d1322, #070a13);
            color: var(--text-muted);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 5px 0 #04060b, 0 8px 15px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .tab.active {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 100%);
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 4px 0 #0d216b, 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .tab:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #04060b, 0 3px 8px rgba(0, 0, 0, 0.4);
        }

        /* 3D Elevated Professional Order Cards (Larger Box & Clearer Text) */
        .order-card {
            background: linear-gradient(145deg, #111726, #090e18);
            border-radius: 18px;
            padding: 20px 22px;
            margin-bottom: 14px;
            border: 1px solid #25304a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 4px 0 rgba(255, 255, 255, 0.03) inset;
            position: relative;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .order-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .side {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .long {
            color: #00df70;
            text-shadow: 0 0 10px rgba(0, 223, 112, 0.3);
        }

        .short {
            color: #ff4058;
            text-shadow: 0 0 10px rgba(255, 64, 88, 0.3);
        }

        .info {
            margin: 7px 0;
            color: #dce8f7;
            font-size: 15px;
        }

        .info strong {
            color: white;
        }

        /* 3D Close Button */
        .close-btn {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff4058 0%, #dc2626 100%);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #991b1b, 0 8px 18px rgba(255, 64, 88, 0.4);
            transition: all 0.1s ease;
            text-transform: uppercase;
        }

        .close-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #991b1b, 0 3px 8px rgba(255, 64, 88, 0.4);
        }

        .profit {
            color: #00df70;
            font-weight: bold;
        }

        .loss {
            color: #ff4058;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 60px 10px;
            color: #91a6c2;
            font-size: 17px;
        }

        .trade-id {
            font-size: 12px;
            color: #7893b4;
            margin-top: 12px;
            word-break: break-all;
            border-top: 1px dashed rgba(255,255,255,0.08);
            padding-top: 8px;
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .status.open {
            color: #00df70;
            background: rgba(0, 223, 112, 0.15);
            border: 1px solid rgba(0, 223, 112, 0.3);
        }

        .status.closed {
            color: #91a6c2;
            background: rgba(145, 166, 194, 0.15);
            border: 1px solid rgba(145, 166, 194, 0.3);
        }

        .language-btn {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            padding: 6px 10px;
            color: inherit;
        }

        /* Custom Modal Popup Styles */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 4, 8, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }
        .custom-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .custom-modal {
            background: linear-gradient(145deg, #0d121f, #080c16);
            border: 1px solid #2e3854;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px rgba(59, 130, 246, 0.2);
            transform: scale(0.9);
            transition: transform 0.25s ease;
            text-align: center;
        }
        .custom-modal-overlay.active .custom-modal {
            transform: scale(1);
        }
        .custom-modal-title {
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .custom-modal-desc {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 20px;
            line-height: 1.5;
            white-space: pre-line;
        }
        .custom-modal-buttons {
            display: flex;
            gap: 12px;
        }
        .custom-modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.1s ease;
        }
        .custom-modal-btn.cancel {
            background: #1e2538;
            color: #dce8f7;
            border: 1px solid #2e3854;
        }
        .custom-modal-btn.confirm {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .custom-modal-btn:active {
            transform: translateY(2px);
        }

    </style>

</head>


<body>


<div class="header">
    <div class="header-title-area">
        <button class="back-btn" type="button" onclick="history.back()">❮</button>
        <span data-key="myOrders">My Orders</span>
    </div>
    <button id="languageBtn" class="language-btn" type="button">🇬🇧</button>
</div>


<div class="container">

    <!-- Sticky / Fixed Tabs Wrapper -->
    <div class="tabs-wrapper">
        <div class="tabs">

            <button
                id="activeTab"
                class="tab active"
                type="button"
                onclick="showActive()"
                data-key="myOrders">
                My Orders
            </button>


            <button
                id="historyTab"
                class="tab"
                type="button"
                onclick="showHistory()"
                data-key="history">
                History
            </button>

        </div>
    </div>


    <div id="ordersList"></div>


</div>


<!-- Custom Modal Markup -->
<div id="customModalOverlay" class="custom-modal-overlay">
    <div class="custom-modal">
        <div id="customModalTitle" class="custom-modal-title">CptMarkets</div>
        <div id="customModalDesc" class="custom-modal-desc">Message goes here</div>
        <div id="customModalButtons" class="custom-modal-buttons">
            <button id="customModalCancel" class="custom-modal-btn cancel" type="button">Cancel</button>
            <button id="customModalConfirm" class="custom-modal-btn confirm" type="button">OK</button>
        </div>
    </div>
</div>



<script type="module">

/* ==========================================
   FIREBASE
========================================== */

import {
    auth,
    db
}
from "./firebase/firebase-config.js";

import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    addDoc,
    serverTimestamp,
    deleteField
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
   VARIABLES
========================================== */

let firebaseHistory = [];
let currentUserUID = null;
let firebaseReady = false;
let closingTrade = false;
let isInitialLoad = true;


/* ==========================================
   CUSTOM MODAL HELPER FUNCTIONS
========================================== */

function showCustomAlert(title, message) {
    return new Promise((resolve) => {
        const overlay = document.getElementById("customModalOverlay");
        const titleEl = document.getElementById("customModalTitle");
        const descEl = document.getElementById("customModalDesc");
        const cancelBtn = document.getElementById("customModalCancel");
        const confirmBtn = document.getElementById("customModalConfirm");

        titleEl.textContent = title;
        descEl.textContent = message;
        cancelBtn.style.display = "none";
        confirmBtn.textContent = "OK";
        overlay.classList.add("active");

        function handleConfirm() {
            overlay.classList.remove("active");
            confirmBtn.removeEventListener("click", handleConfirm);
            resolve(true);
        }

        confirmBtn.addEventListener("click", handleConfirm);
    });
}

function showCustomConfirm(title, message) {
    return new Promise((resolve) => {
        const overlay = document.getElementById("customModalOverlay");
        const titleEl = document.getElementById("customModalTitle");
        const descEl = document.getElementById("customModalDesc");
        const cancelBtn = document.getElementById("customModalCancel");
        const confirmBtn = document.getElementById("customModalConfirm");

        titleEl.textContent = title;
        descEl.textContent = message;
        cancelBtn.style.display = "block";
        cancelBtn.textContent = "Cancel";
        confirmBtn.textContent = "OK";
        overlay.classList.add("active");

        function handleConfirm() {
            overlay.classList.remove("active");
            cleanup();
            resolve(true);
        }

        function handleCancel() {
            overlay.classList.remove("active");
            cleanup();
            resolve(false);
        }

        function cleanup() {
            confirmBtn.removeEventListener("click", handleConfirm);
            cancelBtn.removeEventListener("click", handleCancel);
        }

        confirmBtn.addEventListener("click", handleConfirm);
        cancelBtn.addEventListener("click", handleCancel);
    });
}


/* ==========================================
   CURRENT USER DATA
========================================== */

function getCurrentUserData() {
    try {
        return JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        ) || null;
    } catch (error) {
        return null;
    }
}


/* ==========================================
   ACTIVE TRADE
========================================== */

function getActiveTrade() {
    const side = localStorage.getItem("selectedSide");
    const entryPrice = localStorage.getItem("entryPrice");
    const amount = localStorage.getItem("tradeAmountValue");
    const tradeId = localStorage.getItem("currentTradeId");

    if (!side || !entryPrice || !amount) {
        return null;
    }

    if (side !== "LONG" && side !== "SHORT") {
        return null;
    }

    return {
        tradeId: tradeId || "",
        side: side,
        entryPrice: Number(entryPrice),
        amount: Number(amount)
    };
}


/* ==========================================
   CURRENT PRICE
========================================== */

function getCurrentTradePrice() {
    const saved = localStorage.getItem("currentTradePrice");
    if (saved && Number(saved) > 0) {
        return Number(saved);
    }
    const entry = localStorage.getItem("entryPrice");
    return Number(entry) || 0;
}


/* ==========================================
   CALCULATE USER P/L
========================================== */

function calculateUserProfitLoss(trade, closePrice) {
    if (!trade || !trade.entryPrice || !trade.amount) {
        return 0;
    }

    let profitLoss = 0;

    if (trade.side === "LONG") {
        profitLoss = ((closePrice - trade.entryPrice) / trade.entryPrice) * trade.amount;
    }

    if (trade.side === "SHORT") {
        profitLoss = ((trade.entryPrice - closePrice) / trade.entryPrice) * trade.amount;
    }

    return Number(profitLoss.toFixed(2));
}


/* ==========================================
   LOCAL HISTORY
========================================== */

function getLocalHistory() {
    try {
        const data = JSON.parse(
            localStorage.getItem("cptTradeHistory")
        ) || [];

        return data.filter(function (trade) {
            if (trade.uid) {
                return trade.uid === currentUserUID;
            }
            return false;
        });
    } catch (error) {
        return [];
    }
}


/* ==========================================
   SAVE LOCAL HISTORY
========================================== */

function saveLocalHistory(history) {
    localStorage.setItem(
        "cptTradeHistory",
        JSON.stringify(history)
    );
}


/* ==========================================
   CHECK DUPLICATE HISTORY
========================================== */

function historyAlreadyExists(history, tradeId) {
    if (!tradeId) {
        return false;
    }
    return history.some(function (trade) {
        return trade.tradeId === tradeId;
    });
}


/* ==========================================
   CLEAR ACTIVE TRADE
========================================== */

function clearActiveTrade() {
    localStorage.removeItem("selectedSide");
    localStorage.removeItem("entryPrice");
    localStorage.removeItem("tradeAmountValue");
    localStorage.removeItem("currentTradePrice");
    localStorage.removeItem("currentTradeId");
    localStorage.removeItem("pendingTradeProfit");
    localStorage.removeItem("pendingTradeLoss");
    localStorage.removeItem("pendingTradeResult");
    localStorage.removeItem("tradeLeverage");
}


/* ==========================================
   SET ACTIVE TAB
========================================== */

function setActiveTab(tab) {
    const activeTab = document.getElementById("activeTab");
    const historyTab = document.getElementById("historyTab");

    if (!activeTab || !historyTab) {
        return;
    }

    activeTab.classList.remove("active");
    historyTab.classList.remove("active");

    if (tab === "active") {
        activeTab.classList.add("active");
    }

    if (tab === "history") {
        historyTab.classList.add("active");
    }
}


/* ==========================================
   LOAD FIREBASE HISTORY
========================================== */

async function loadFirebaseHistory() {
    try {
        if (!auth.currentUser) {
            return;
        }

        currentUserUID = auth.currentUser.uid;

        const historyRef = collection(db, "tradeHistory");
        const historyQuery = query(
            historyRef,
            where("uid", "==", currentUserUID)
        );

        const snapshot = await getDocs(historyQuery);
        firebaseHistory = [];

        snapshot.forEach(function (docSnap) {
            const data = docSnap.data();

            if (data.source === "ADMIN" && (data.side === "ADMIN" || !data.tradeId)) {
                return;
            }

            firebaseHistory.push({
                id: docSnap.id,
                tradeId: data.tradeId || "",
                uid: data.uid || currentUserUID,
                side: data.side || "",
                entryPrice: Number(data.entryPrice || 0),
                closePrice: Number(data.closePrice || 0),
                amount: Number(data.amount || 0),
                userProfitLoss: Number(data.userProfitLoss ?? 0),
                adminProfitLoss: Number(data.adminProfitLoss ?? 0),
                profitLoss: Number(data.profitLoss ?? data.profitloss ?? 0),
                leverage: Number(data.leverage || 0),
                type: data.type || "TRADE",
                source: data.source || "USER",
                time: data.time || "",
                createdAt: data.createdAt || null
            });
        });

        firebaseHistory.sort(function (a, b) {
            return String(b.time).localeCompare(String(a.time));
        });

        firebaseReady = true;

    } catch (error) {
        console.error("Firebase history error:", error);
    }
}


/* ==========================================
   SHOW ACTIVE ORDERS
========================================== */

function showActive() {
    setActiveTab("active");

    const list = document.getElementById("ordersList");
    if (!list) {
        return;
    }

    const trade = getActiveTrade();

    if (!trade) {
        list.innerHTML = `
            <div class="empty">
                No active orders
            </div>
        `;
        return;
    }

    const sideClass = trade.side === "LONG" ? "long" : "short";

    list.innerHTML = `
        <div class="order-card" id="activeOrderCard">
            <span class="status open">
                OPEN
            </span>

            <div class="side ${sideClass}">
                ${trade.side}
            </div>

            <div class="info">
                Entry Price:
                <strong>
                    $${trade.entryPrice.toFixed(2)}
                </strong>
            </div>

            <div class="info">
                Amount:
                <strong>
                    $${trade.amount.toFixed(2)}
                </strong>
            </div>

            ${
                trade.tradeId
                    ? `
                        <div class="trade-id">
                            Trade ID:
                            ${trade.tradeId}
                        </div>
                    `
                    : ""
            }

            <button
                class="close-btn"
                id="ordersCloseTradeBtn"
                type="button"
            >
                Close Trade
            </button>
        </div>
    `;

    const closeButton = document.getElementById("ordersCloseTradeBtn");
    if (closeButton) {
        closeButton.addEventListener("click", closeTradeFromOrders);
    }
}


/* ==========================================
   GET ADMIN PENDING RESULT
========================================== */

async function getPendingAdminResult(trade) {
    try {
        if (!currentUserUID) {
            return { amount: 0, type: null, tradeId: "" };
        }

        const userRef = doc(db, "users", currentUserUID);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
            return { amount: 0, type: null, tradeId: "" };
        }

        const userData = userSnap.data();
        const pending = userData.pendingAdminTradeResult;

        if (pending && pending.status === "PENDING") {
            const pendingTradeId = pending.tradeId || "";
            if (pendingTradeId && trade.tradeId && pendingTradeId !== trade.tradeId) {
                return { amount: 0, type: null, tradeId: "" };
            }

            return {
                amount: Number(pending.profitLoss || 0),
                type: pending.type || (Number(pending.profitLoss || 0) >= 0 ? "PROFIT" : "LOSS"),
                tradeId: pendingTradeId || trade.tradeId || ""
            };
        }

        const oldPending = Number(userData.pendingTradeProfitLoss || 0);
        const oldTradeId = userData.pendingTradeId || "";

        if (oldPending !== 0) {
            if (oldTradeId && trade.tradeId && oldTradeId !== trade.tradeId) {
                return { amount: 0, type: null, tradeId: "" };
            }

            return {
                amount: oldPending,
                type: oldPending > 0 ? "PROFIT" : "LOSS",
                tradeId: oldTradeId || trade.tradeId || ""
            };
        }

        return { amount: 0, type: null, tradeId: "" };

    } catch (error) {
        console.error("Pending admin result error:", error);
        return { amount: 0, type: null, tradeId: "" };
    }
}


/* ==========================================
   CLOSE TRADE FROM ORDERS
========================================== */

async function closeTradeFromOrders() {
    if (closingTrade) {
        return;
    }

    const trade = getActiveTrade();

    if (!trade) {
        await showCustomAlert("CptMarkets", "No active trade.");
        showActive();
        return;
    }

    if (!currentUserUID && auth.currentUser) {
        currentUserUID = auth.currentUser.uid;
    }

    if (!currentUserUID) {
        await showCustomAlert("CptMarkets", "User session not ready.");
        return;
    }

    const confirmed = await showCustomConfirm("CptMarkets", "Close this trade?");
    if (!confirmed) {
        return;
    }

    closingTrade = true;

    try {
        const closePrice = getCurrentTradePrice();

        if (!closePrice || closePrice <= 0) {
            throw new Error("Invalid close price.");
        }

        const userProfitLoss = calculateUserProfitLoss(trade, closePrice);
        const adminResult = await getPendingAdminResult(trade);
        const adminProfitLoss = Number(adminResult.amount || 0);

        const finalProfitLoss = Number((userProfitLoss + adminProfitLoss).toFixed(2));
        const returnAmount = Number((trade.amount + finalProfitLoss).toFixed(2));

        if (returnAmount < 0) {
            throw new Error("Invalid trade result.");
        }

        const userRef = doc(db, "users", currentUserUID);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
            throw new Error("User account not found.");
        }

        const userData = userSnap.data();
        const oldBalance = Number(userData.balance || 0);
        const finalBalance = Number((oldBalance + returnAmount).toFixed(2));

        if (finalBalance < 0) {
            throw new Error("Final balance cannot be negative.");
        }

        let existingHistory = false;

        if (trade.tradeId) {
            const historyQuery = query(
                collection(db, "tradeHistory"),
                where("uid", "==", currentUserUID),
                where("tradeId", "==", trade.tradeId)
            );
            const historySnapshot = await getDocs(historyQuery);
            existingHistory = !historySnapshot.empty;
        }

        if (!existingHistory) {
            await addDoc(
                collection(db, "tradeHistory"),
                {
                    tradeId: trade.tradeId || "",
                    uid: currentUserUID,
                    userId: userData.userId || "",
                    username: userData.username || userData.name || "User",
                    email: userData.email || "",
                    side: trade.side,
                    entryPrice: Number(trade.entryPrice.toFixed(2)),
                    closePrice: Number(closePrice.toFixed(2)),
                    amount: Number(trade.amount.toFixed(2)),
                    userProfitLoss: userProfitLoss,
                    adminProfitLoss: adminProfitLoss,
                    profitLoss: finalProfitLoss,
                    leverage: Number(localStorage.getItem("tradeLeverage")) || 100,
                    type: "TRADE",
                    source: "USER",
                    adminResultSource: adminResult.amount !== 0 ? "ADMIN" : null,
                    adminResultType: adminResult.type || null,
                    status: "COMPLETED",
                    oldBalance: Number(oldBalance.toFixed(2)),
                    returnedAmount: returnAmount,
                    newBalance: finalBalance,
                    time: new Date().toLocaleString(),
                    createdAt: serverTimestamp()
                }
            );
        }

        let localHistory = getLocalHistory();
        const localExists = historyAlreadyExists(localHistory, trade.tradeId);

        if (!localExists) {
            localHistory.unshift({
                uid: currentUserUID,
                tradeId: trade.tradeId || "",
                side: trade.side,
                entryPrice: Number(trade.entryPrice.toFixed(2)),
                closePrice: Number(closePrice.toFixed(2)),
                amount: Number(trade.amount.toFixed(2)),
                userProfitLoss: userProfitLoss,
                adminProfitLoss: adminProfitLoss,
                profitLoss: finalProfitLoss,
                leverage: Number(localStorage.getItem("tradeLeverage")) || 100,
                type: "TRADE",
                source: "USER",
                time: new Date().toLocaleString()
            });

            saveLocalHistory(localHistory);
        }

        const balanceUpdate = {
            balance: finalBalance
        };

        if (
            adminResult.amount !== 0 ||
            (userData.pendingAdminTradeResult && userData.pendingAdminTradeResult.status === "PENDING")
        ) {
            balanceUpdate.pendingAdminTradeResult = deleteField();
        }

        balanceUpdate.pendingTradeProfitLoss = 0;
        balanceUpdate.pendingTradeId = "";

        await updateDoc(userRef, balanceUpdate);

        clearActiveTrade();

        localStorage.setItem("cptTradeClosedAt", String(Date.now()));
        setTimeout(function () {
            localStorage.removeItem("cptTradeClosedAt");
        }, 1000);

        showActive();
        await loadFirebaseHistory();

        await showCustomAlert(
            "CptMarkets",
            trade.side + " trade closed successfully.\n\n" +
            "Close Price: $" + closePrice.toFixed(2) + "\n" +
            "User P/L: " + (userProfitLoss >= 0 ? "+" : "") + "$" + userProfitLoss.toFixed(2) + "\n" +
            "Final P/L: " + (finalProfitLoss >= 0 ? "+" : "") + "$" + finalProfitLoss.toFixed(2)
        );

    } catch (error) {
        console.error("Close trade failed:", error);
        await showCustomAlert("CptMarkets", "Unable to close trade.\n\n" + error.message);
    } finally {
        closingTrade = false;
    }
}


/* ==========================================
   SHOW HISTORY
========================================== */

function showHistory() {
    setActiveTab("history");

    const list = document.getElementById("ordersList");
    if (!list) {
        return;
    }

    const localHistory = getLocalHistory();
    const combined = [];
    const seenTradeIds = new Set();

    firebaseHistory.forEach(function (trade) {
        if (trade.source === "ADMIN" || trade.side === "ADMIN") {
            return;
        }
        if (trade.side !== "LONG" && trade.side !== "SHORT") {
            return;
        }

        const id = trade.tradeId || trade.id;
        if (id && seenTradeIds.has(id)) {
            return;
        }
        if (id) {
            seenTradeIds.add(id);
        }

        combined.push(trade);
    });

    localHistory.forEach(function (trade) {
        if (trade.side !== "LONG" && trade.side !== "SHORT") {
            return;
        }

        const id = trade.tradeId || "";
        if (id && seenTradeIds.has(id)) {
            return;
        }
        if (id) {
            seenTradeIds.add(id);
        }

        combined.push(trade);
    });

    if (!combined.length) {
        list.innerHTML = `
            <div class="empty">
                No trade history
            </div>
        `;
        return;
    }

    list.innerHTML = combined.map(function (trade) {
        const profitLoss = Number(trade.profitLoss ?? trade.profitloss ?? 0);
        const profitClass = profitLoss >= 0 ? "profit" : "loss";
        const side = trade.side;
        const sideClass = side === "LONG" ? "long" : "short";

        return `
            <div class="order-card">
                <span class="status closed">
                    CLOSED
                </span>

                <div class="side ${sideClass}">
                    ${side}
                </div>

                <div class="info">
                    Entry Price:
                    <strong>
                        $${Number(trade.entryPrice || 0).toFixed(2)}
                    </strong>
                </div>

                <div class="info">
                    Close Price:
                    <strong>
                        $${Number(trade.closePrice || 0).toFixed(2)}
                    </strong>
                </div>

                <div class="info">
                    Amount:
                    <strong>
                        $${Number(trade.amount || 0).toFixed(2)}
                    </strong>
                </div>

                <div class="info">
                    Profit / Loss:
                    <span class="${profitClass}">
                        ${profitLoss >= 0 ? "+" : ""}$${profitLoss.toFixed(2)}
                    </span>
                </div>

                <div class="info">
                    ${trade.time || ""}
                </div>

                ${
                    trade.tradeId
                        ? `
                            <div class="trade-id">
                                Trade ID:
                                ${trade.tradeId}
                            </div>
                        `
                        : ""
                }
            </div>
        `;
    }).join("");
}


/* ==========================================
   CROSS-PAGE CLOSE DETECTION (Sync with Trade Page)
========================================== */

window.addEventListener(
    "storage",
    function (event) {
        if (event.key === "cptTradeClosedAt" || event.key === "selectedSide") {
            showActive();
            loadFirebaseHistory();
        }
    }
);


/* ==========================================
   GLOBAL FUNCTIONS
========================================== */

window.showActive = showActive;
window.showHistory = showHistory;
window.closeTradeFromOrders = closeTradeFromOrders;


/* ==========================================
   FIREBASE AUTH
========================================== */

onAuthStateChanged(
    auth,
    async function (user) {
        if (!user) {
            firebaseHistory = [];
            firebaseReady = false;
            currentUserUID = null;
            showActive();
            return;
        }

        currentUserUID = user.uid;
        await loadFirebaseHistory();

        if (isInitialLoad) {
            isInitialLoad = false;
            showActive();
        }
    }
);


/* ==========================================
   INITIAL LOAD
========================================== */

showActive();

</script>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPTMarkets | Withdrawal Management</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:#eaf1fb;
}

header{
    padding:17px 22px;
    background:#0c1b2d;
    border-bottom:1px solid #20354e;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

header h2{margin:0;font-size:20px}
header a{color:#62c8e8;text-decoration:none;font-size:14px}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 16px 35px;
}

.subtitle{color:#91a5bd;margin-top:7px}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin:22px 0;
}

.stat,.panel,.request{
    background:#0d1c2e;
    border:1px solid #20364f;
    border-radius:15px;
}

.stat{padding:17px}
.stat span{color:#9aacc2;font-size:13px}
.stat strong{display:block;font-size:27px;margin-top:9px}

.tabs{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin:20px 0;
}

.tab{
    border:1px solid #29425e;
    background:#10243a;
    color:#dce9f8;
    padding:10px 17px;
    border-radius:9px;
    cursor:pointer;
    font-weight:600;
}

.tab.active{
    background:#087da5;
    border-color:#087da5;
    color:white;
}

/* REQUEST CARD */
.request{
    position:relative;
    padding:19px;
    margin-bottom:16px;
    border-radius:17px;
    background:linear-gradient(145deg,#10243a,#0b1a2b);
    border:1px solid #29435f;
    box-shadow:0 7px 20px rgba(0,0,0,.16);
    overflow:hidden;
}

.request-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:22px 0 15px;
    border-bottom:1px solid #263b52;
}

.request-date{
    position:absolute;
    top:13px;
    right:18px;
    color:#91a5bd;
    font-size:11px;
    text-align:right;
}

.amount{
    font-size:24px;
    font-weight:bold;
    color:#55d5ad;
}

.request-id{
    color:#91a5bd;
    font-size:12px;
    margin-top:6px;
    overflow-wrap:anywhere;
}

.status{
    padding:7px 12px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.pending{background:#493717;color:#ffd36b}
.successful{background:#123f34;color:#65e0b2}
.rejected{background:#4b2028;color:#ff9aa5}

/* DETAILS GRID */
.details{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin:15px 0 4px;
}

.detail{
    background:#081727;
    border:1px solid #142b40;
    padding:12px 13px;
    border-radius:11px;
    min-width:0;
}

.detail small{
    display:block;
    color:#8fa6bf;
    font-size:11px;
    margin-bottom:7px;
}

.detail strong{
    display:block;
    color:#dce8f6;
    font-size:13px;
    font-weight:600;
    line-height:1.5;
    overflow-wrap:anywhere;
}

.copy-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.copy-row strong{min-width:0}

.copy-btn{
    flex-shrink:0;
    border:1px solid #315675;
    background:#15334d;
    color:#c9edff;
    padding:6px 10px;
    border-radius:7px;
    cursor:pointer;
    font-size:11px;
}

.copy-btn:hover{background:#1c4969}

/* ACTIONS */
.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:16px;
    padding-top:13px;
    border-top:1px solid #263b52;
}

.actions button{
    border:0;
    border-radius:8px;
    padding:10px 18px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:13px;
}

.approve{background:#12845e}
.approve:hover{background:#159b6e}

.reject{background:#a93646}
.reject:hover{background:#c13d50}

.delete{
    background:#582532;
    border:1px solid #914052!important;
    color:#ffb5bf!important;
    margin-left:auto;
}
.delete:hover{background:#793044}

.processed-note{
    color:#91a5bd;
    font-size:12px;
    margin:13px 0 0;
    line-height:1.5;
}

.empty,.loading{
    text-align:center;
    padding:35px;
    color:#9aacc2;
    background:#0d1c2e;
    border:1px solid #20364f;
    border-radius:13px;
}

.error{
    color:#ff9aa5;
    white-space:pre-wrap;
    font-size:13px;
}

@media(max-width:600px){
    header{padding:15px}
    header h2{font-size:16px}
    header a{font-size:12px}
    .container{margin:19px auto}
    .stats{grid-template-columns:1fr;gap:10px}
    .stat{padding:14px}
    .stat strong{font-size:23px}
    .details{grid-template-columns:1fr}
    .request{padding:15px}
    .request-date{right:14px;font-size:10px}
    .request-top{padding-top:23px}
    .amount{font-size:22px}
    .actions button{flex:1}
    .delete{margin-left:0}
}
</style>
</head>

<body>

<header>
    <h2>CPTMarkets — Withdrawals</h2>
    <a href="admin-dashboard.html">← Admin Dashboard</a>
</header>

<main class="container">

    <h2>Withdrawal Management</h2>
    <p class="subtitle">Review and manage customer withdrawal requests.</p>

    <section class="stats">
        <div class="stat">
            <span>Pending Requests</span>
            <strong id="pendingCount">0</strong>
        </div>

        <div class="stat">
            <span>Approved Requests</span>
            <strong id="approvedCount">0</strong>
        </div>

        <div class="stat">
            <span>Rejected Requests</span>
            <strong id="rejectedCount">0</strong>
        </div>
    </section>

    <nav class="tabs">
        <button class="tab active" data-filter="Pending">Pending</button>
        <button class="tab" data-filter="Successful">Approved</button>
        <button class="tab" data-filter="Rejected">Rejected</button>
        <button class="tab" data-filter="All">All Requests</button>
    </nav>

    <div id="requestList" class="loading">
        Loading withdrawal requests...
    </div>

    <p id="pageMessage" class="error"></p>

</main>

<script type="module" src="admin-withdrawals.js"></script>

</body>
</html>

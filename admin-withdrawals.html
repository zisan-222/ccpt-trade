
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPTMarkets | Withdrawal Management</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:#eaf1fb;
}
header{
    padding:18px 22px;
    background:#0c1b2d;
    border-bottom:1px solid #20354e;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}
header h2{margin:0;font-size:20px}
header a{color:#62c8e8;text-decoration:none;font-size:14px}
.container{max-width:1150px;margin:25px auto;padding:0 16px}
.subtitle{color:#91a5bd;margin-top:7px}
.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin:22px 0;
}
.stat,.panel,.request{
    background:#0d1c2e;
    border:1px solid #20364f;
    border-radius:13px;
}
.stat{padding:18px}
.stat span{color:#9aacc2;font-size:13px}
.stat strong{display:block;font-size:27px;margin-top:9px}
.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}
.tab{
    border:1px solid #29425e;
    background:#10243a;
    color:#dce9f8;
    padding:11px 18px;
    border-radius:9px;
    cursor:pointer;
}
.tab.active{background:#087da5;border-color:#087da5;color:white}
.request{padding:19px;margin-bottom:15px}
.request-top{
    display:flex;justify-content:space-between;
    align-items:center;gap:10px;flex-wrap:wrap;
    border-bottom:1px solid #263b52;padding-bottom:13px;
}
.amount{font-size:23px;font-weight:bold;color:#55d5ad}
.status{
    padding:6px 11px;border-radius:20px;
    font-size:12px;font-weight:bold;
}
.pending{background:#493717;color:#ffd36b}
.successful{background:#123f34;color:#65e0b2}
.rejected{background:#4b2028;color:#ff9aa5}
.details{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;margin:17px 0;
}
.detail{
    background:#091727;padding:12px;border-radius:8px;
    min-width:0;
}
.detail small{display:block;color:#91a5bd;margin-bottom:6px}
.detail strong{overflow-wrap:anywhere;font-size:14px}
.copy-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.copy-btn{
    border:1px solid #31506e;background:#18334e;
    color:#d9f4ff;padding:6px 10px;border-radius:6px;
    cursor:pointer;font-size:12px;
}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.actions button{
    border:0;border-radius:8px;padding:11px 19px;
    color:white;font-weight:bold;cursor:pointer;
}
.approve{background:#12845e}
.reject{background:#a93646}
.empty,.loading{
    text-align:center;padding:35px;color:#9aacc2;
}
.error{color:#ff9aa5;white-space:pre-wrap}
@media(max-width:600px){
    .stats{grid-template-columns:1fr}
    .details{grid-template-columns:1fr}
    header h2{font-size:17px}
}
</style>
</head>

<body>
<header>
    <h2>CPTMarkets — Withdrawals</h2>
    <a href="admin-dashboard.html">← Admin Dashboard</a>
</header>

<main class="container">
    <h2>Withdrawal Management</h2>
    <p class="subtitle">Review and manage customer withdrawal requests.</p>

    <section class="stats">
        <div class="stat">
            <span>Pending Requests</span>
            <strong id="pendingCount">0</strong>
        </div>
        <div class="stat">
            <span>Approved Requests</span>
            <strong id="approvedCount">0</strong>
        </div>
        <div class="stat">
            <span>Rejected Requests</span>
            <strong id="rejectedCount">0</strong>
        </div>
    </section>

    <nav class="tabs">
        <button class="tab active" data-filter="Pending">Pending</button>
        <button class="tab" data-filter="Successful">Approved</button>
        <button class="tab" data-filter="Rejected">Rejected</button>
        <button class="tab" data-filter="All">All Requests</button>
    </nav>

    <div id="requestList" class="loading">Loading withdrawal requests...</div>
    <p id="pageMessage" class="error"></p>
</main>

<script type="module" src="admin-withdrawals.js"></script>
</body>
</html>

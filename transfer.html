<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CptMarkets - Transfer</title>

    <link rel="stylesheet" href="transfer.css">
</head>

<body>

    <div class="transfer-page">

        <!-- HEADER -->
        <header class="transfer-header">

            <button class="back-btn" onclick="history.back()">
                ‹
            </button>

            <h1>Transfer</h1>

            <div class="header-space"></div>

        </header>


        <!-- TRANSFER CARD -->
        <main class="transfer-content">

            <section class="transfer-card">

                <div class="card-title">
                    <div class="title-icon">⇄</div>

                    <div>
                        <h2>Transfer</h2>
                        <p>Transfer funds between accounts</p>
                    </div>
                </div>


                <!-- FROM -->
                <div class="field-group">

                    <label>From</label>

                    <div class="account-box">

                        <div class="account-icon">
                            💼
                        </div>

                        <div class="account-info">
                            <strong>Funding Account</strong>
                            <span>Available Balance</span>
                        </div>

                        <div class="account-arrow">
                            ›
                        </div>

                    </div>

                </div>


                <!-- SWITCH -->
                <div class="switch-area">

                    <button type="button" class="switch-btn">
                        ⇅
                    </button>

                </div>


                <!-- TO -->
                <div class="field-group">

                    <label>To</label>

                    <div class="account-box">

                        <div class="account-icon">
                            📈
                        </div>

                        <div class="account-info">
                            <strong>Trading Account</strong>
                            <span>Trading Balance</span>
                        </div>

                        <div class="account-arrow">
                            ›
                        </div>

                    </div>

                </div>


                <!-- AMOUNT -->
                <div class="field-group amount-group">

                    <label>Transfer Amount</label>

                    <div class="amount-box">

                        <span class="currency">$</span>

                        <input
                            type="number"
                            id="transferAmount"
                            placeholder="0.00"
                            min="0"
                            step="0.01"
                        >

                        <span class="currency-code">
                            USD
                        </span>

                    </div>

                </div>


                <!-- AVAILABLE BALANCE -->
                <div class="balance-info">

                    <span>Available Balance</span>

                    <strong id="availableBalance">
                        $0.00
                    </strong>

                </div>


                <!-- SUBMIT -->
                <button
                    type="button"
                    class="submit-transfer"
                    id="submitTransfer"
                >
                    Confirm Transfer
                </button>


                <!-- MESSAGE -->
                <div
                    id="transferMessage"
                    class="transfer-message"
                    style="display:none;"
                ></div>

            </section>


            <!-- INFO -->
            <section class="transfer-info">

                <div class="info-icon">
                    ℹ
                </div>

                <div>
                    <strong>Transfer Information</strong>

                    <p>
                        Transfers are processed securely between
                        your accounts.
                    </p>
                </div>

            </section>

        </main>

    </div>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const amountInput = document.querySelector(
        'input[type="number"], input[placeholder*="0.00"]'
    );

    const confirmButton = document.querySelector(
        'button'
    );

    const balanceElement = document.querySelector(
        '.available-balance'
    );

    // Account balance
    // যদি তোমার balance.js localStorage-এ balance রাখে,
    // এই key থেকে balance নেওয়া হবে।
    let balance = parseFloat(localStorage.getItem("balance")) || 0;

    function showMessage(message) {
        let oldMessage = document.getElementById("transfer-message");

        if (oldMessage) {
            oldMessage.remove();
        }

        const box = document.createElement("div");
        box.id = "transfer-message";
        box.style.marginTop = "15px";
        box.style.padding = "15px";
        box.style.borderRadius = "12px";
        box.style.textAlign = "center";
        box.style.fontWeight = "700";
        box.style.fontSize = "16px";
        box.style.background = "#292929";
        box.style.color = "#ffffff";
        box.textContent = message;

        confirmButton.parentNode.insertBefore(
            box,
            confirmButton.nextSibling
        );
    }

    if (confirmButton) {
        confirmButton.addEventListener("click", function () {

            const amount = parseFloat(
                amountInput ? amountInput.value : 0
            ) || 0;

            if (amount <= 0) {
                showMessage("Please enter a transfer amount.");
                return;
            }

            if (balance < amount) {
                showMessage("Insufficient Balance");
                return;
            }

            showMessage("Contact Your Customer Service");
        });
    }

});
</script>
    
</body>

</html>

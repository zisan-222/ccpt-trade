<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CptMarkets - Transfer</title>

    <link rel="stylesheet" href="transfer.css">
</head>

<body>

    <div class="transfer-page">

        <!-- ================= HEADER ================= -->

        <header class="transfer-header">

            <button
                type="button"
                class="back-btn"
                onclick="history.back()"
                aria-label="Go Back"
            >
                <span>‹</span>
            </button>

            <h1>Transfer</h1>

            <div class="header-space"></div>

        </header>


        <!-- ================= MAIN ================= -->

        <main class="transfer-content">

            <section class="transfer-card">

                <!-- CARD GLOW -->
                <div class="card-glow"></div>


                <!-- ================= TITLE ================= -->

                <div class="card-title">

                    <div class="title-icon">
                        <span>⇄</span>
                    </div>

                    <div class="title-text">

                        <h2>Transfer Funds</h2>

                        <p>
                            Move funds between your accounts
                        </p>

                    </div>

                </div>


                <!-- ================= ACCOUNT AREA ================= -->

                <div
                    class="accounts-area"
                    id="accountsArea"
                >

                    <!-- FUNDING -->

                    <div
                        class="account-slot funding-slot"
                        data-account="funding"
                    >

                        <div class="field-label">
                            From
                        </div>

                        <div class="account-box">

                            <div class="account-icon funding-icon">
                                <span>💼</span>
                            </div>

                            <div class="account-info">

                                <strong>
                                    Funding Account
                                </strong>

                                <span>
                                    Available Balance
                                </span>

                            </div>

                            <div class="account-arrow">
                                ›
                            </div>

                        </div>

                    </div>


                    <!-- ================= SWAP ================= -->

                    <div class="switch-area">

                        <div class="switch-line"></div>

                        <button
                            type="button"
                            class="switch-btn"
                            id="switchButton"
                            aria-label="Switch accounts"
                        >

                            <span class="switch-icon">
                                ⇅
                            </span>

                            <span class="switch-ripple"></span>

                        </button>

                        <div class="switch-line"></div>

                    </div>


                    <!-- TRADING -->

                    <div
                        class="account-slot trading-slot"
                        data-account="trading"
                    >

                        <div class="field-label">
                            To
                        </div>

                        <div class="account-box">

                            <div class="account-icon trading-icon">
                                <span>📈</span>
                            </div>

                            <div class="account-info">

                                <strong>
                                    Trading Account
                                </strong>

                                <span>
                                    Trading Balance
                                </span>

                            </div>

                            <div class="account-arrow">
                                ›
                            </div>

                        </div>

                    </div>

                </div>


                <!-- ================= AMOUNT ================= -->

                <div class="field-group amount-group">

                    <label>
                        Transfer Amount
                    </label>

                    <div
                        class="amount-box"
                        id="amountBox"
                    >

                        <span class="currency">
                            $
                        </span>

                        <input
                            type="number"
                            id="transferAmount"
                            placeholder="0.00"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            autocomplete="off"
                        >

                        <span class="currency-code">
                            USD
                        </span>

                    </div>

                </div>


                <!-- ================= BALANCE ================= -->

                <div class="balance-info">

                    <div class="balance-label">

                        <span class="balance-dot"></span>

                        <span>
                            Available Balance
                        </span>

                    </div>

                    <strong id="availableBalance">
                        $0.00
                    </strong>

                </div>


                <!-- ================= DIRECTION ================= -->

                <div
                    class="transfer-direction"
                    id="transferDirection"
                >
                    <span class="direction-dot"></span>

                    <span>
                        Funding Account
                    </span>

                    <span class="direction-arrow">
                        →
                    </span>

                    <span>
                        Trading Account
                    </span>
                </div>


                <!-- ================= SUBMIT ================= -->

                <button
                    type="button"
                    class="submit-transfer"
                    id="submitTransfer"
                >

                    <span class="button-shine"></span>

                    <span class="button-content">
                        <span>Confirm Transfer</span>
                        <span class="button-arrow">→</span>
                    </span>

                </button>


                <!-- ================= MESSAGE ================= -->

                <div
                    id="transferMessage"
                    class="transfer-message"
                    style="display:none;"
                ></div>

            </section>


            <!-- ================= INFORMATION ================= -->

            <section class="transfer-info">

                <div class="info-icon">
                    <span>i</span>
                </div>

                <div class="info-text">

                    <strong>
                        Transfer Information
                    </strong>

                    <p>
                        Transfers are processed securely
                        between your accounts.
                    </p>

                </div>

            </section>

        </main>

    </div>


    <!-- BALANCE SYSTEM -->
    <script src="balance.js"></script>

    <!-- TRANSFER SYSTEM -->
    <script src="transfer.js"></script>

</body>

</html>

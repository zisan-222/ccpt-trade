
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CptMarkets - Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #050b14; color: #fff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: rgba(16, 29, 49, 0.9); padding: 30px; border-radius: 12px; border: 1px solid #1a2f4c; box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { color: #ff9900; margin-top: 0; text-align: center; font-size: 24px; }
        p { color: #869bb5; text-align: center; font-size: 14px; margin-bottom: 25px; }
        label { font-size: 13px; color: #869bb5; display: block; margin-bottom: 8px; font-weight: bold; }
        select, input, button { padding: 14px; margin-bottom: 20px; display: block; width: 100%; box-sizing: border-box; border-radius: 6px; font-size: 15px; }
        select, input { background: #050b14; color: white; border: 1px solid #1a2f4c; transition: 0.3s; }
        select:focus, input:focus { border-color: #ff9900; outline: none; }
        button { background: linear-gradient(to bottom, #ffe054, #cc9900); border: none; cursor: pointer; font-weight: bold; color: #000; transition: 0.3s; margin-top: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,153,0,0.3); }
    </style>
</head>
<body>

    <div class="card">
        <h2>Admin Dashboard</h2>
        <p>শুধুমাত্র প্রধান পরিচালক ব্যালেন্স যোগ করতে পারবেন</p>
        
        <label>১. ইউজার সিলেক্ট করুন:</label>
        <select id="userSelect">
            <option value="">ইউজার তালিকা লোড হচ্ছে...</option>
        </select>

        <label>২. ডেমো ডলারের পরিমাণ:</label>
        <input type="number" id="amountInput" placeholder="যেমন: 500">
        
        <button id="addBalanceBtn">ডলার ট্রান্সফার করুন</button>
    </div>

    <script type="module">
      import { initializeApp } from "https://gstatic.com";
      import { getFirestore, collection, getDocs, doc, updateDoc, increment } from "https://gstatic.com";

      // আপনার ফায়ারবেস কনফিগ
      const firebaseConfig = {
        apiKey: "AIzaSyApKKni5cB26UoJVod6pGhrzLYYv",
        authDomain: "://firebaseapp.com",
        projectId: "ccpt-trade",
        storageBucket: "ccpt-trade.firebasestorage.app",
        messagingSenderId: "461751033270",
        appId: "1:461751033270:web:7fdc3f9a206cbf2",
        measurementId: "G-V1RSJDECT"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const userSelect = document.getElementById("userSelect");
      const amountInput = document.getElementById("amountInput");
      const addBalanceBtn = document.getElementById("addBalanceBtn");

      // ডাটাবেজ থেকে রেজিস্টার্ড ইউজারদের তালিকা নিয়ে আসা
      async function loadUsers() {
          userSelect.innerHTML = '<option value="">ইউজার সিলেক্ট করুন</option>';
          try {
              const querySnapshot = await getDocs(collection(db, "users"));
              querySnapshot.forEach((doc) => {
                  const data = doc.data();
                  const option = document.createElement("option");
                  option.value = data.uid;
                  option.textContent = `${data.name} (${data.email}) - $${data.balance || 0}`;
                  userSelect.appendChild(option);
              });
          } catch (error) {
              userSelect.innerHTML = '<option value="">লোড ব্যর্থ! সিকিউরিটি লক সচল আছে।</option>';
          }
      }

      loadUsers();

      // ব্যালেন্স যোগ করার বাটন হ্যান্ডলার
      addBalanceBtn.addEventListener("click", async () => {
          const selectedUserId = userSelect.value;
          const amount = parseFloat(amountInput.value);

          if (!selectedUserId || isNaN(amount) || amount <= 0) {
              alert("অনুগ্রহ করে সঠিক ইউজার এবং ডলারের পরিমাণ দিন।");
              return;
          }

          try {
              const userRef = doc(db, "users", selectedUserId);
              await updateDoc(userRef, {
                  balance: increment(amount)
              });
              alert("ডেমো ডলার সফলভাবে ট্রান্সফার হয়েছে!");
              amountInput.value = "";
              loadUsers(); 
          } catch (error) {
              alert("ব্যর্থ হয়েছে! ফায়ারবেস রুলসে আপনার এডমিন আইডি লক করা নেই।");
          }
      });
    </script>
</body>
</html>

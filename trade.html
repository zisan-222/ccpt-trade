<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPT Markets - Demo Trade</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#071a36;
color:white;
}

.header{
background:#0b2c59;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.balance{
margin:15px;
background:#123b73;
padding:15px;
border-radius:12px;
text-align:center;
}

.balance h1{
margin:0;
color:#ffcc00;
font-size:40px;
}

.chart{
margin:15px;
height:250px;
background:#102b55;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
color:#999;
}

.buttons{
display:flex;
gap:15px;
padding:15px;
}

.buy{
flex:1;
background:#00c853;
padding:15px;
border:none;
color:white;
font-size:20px;
border-radius:10px;
}

.sell{
flex:1;
background:#ff1744;
padding:15px;
border:none;
color:white;
font-size:20px;
border-radius:10px;
}

.history{
margin:15px;
background:#123b73;
padding:15px;
border-radius:12px;
}

.trade-item{
padding:10px;
border-bottom:1px solid #2b4d7a;
}
</style>

</head>

<body>


<div class="header">
    <h2>BTC/USDT</h2>
    <p style="color:#00ff66;">Price: $118,540.25 (+2.54%)</p>
</div>

<div class="chart">
    <iframe
        src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BTCUSDT&interval=1&theme=dark&style=1&locale=en"
        width="100%"
        height="350"
        frameborder="0">
    </iframe>
</div>

<div style="padding:15px;">

<label>Lot Size</label>
<input id="lot" type="number" value="0.01"
style="width:100%;padding:12px;margin-top:8px;border-radius:8px;border:none;">

<br><br>

<div style="display:flex;gap:10px;">
<button class="buy" style="flex:1;">BUY</button>
<button class="sell" style="flex:1;">SELL</button>
</div>

<p id="status"
style="margin-top:15px;color:#00ff66;font-weight:bold;"></p>


<div class="history">
    <h3>Open Orders</h3>

    <div class="trade-item">
        No open orders
    </div>

    <h3 style="margin-top:20px;">Trade History</h3>

    <div class="trade-item">
        No trade history
    </div>
</div>
<script>
const openOrders = document.querySelector(".history");

document.querySelector(".buy").onclick = function () {
    openOrders.innerHTML = `
    <h3>Open Orders</h3>
    <div class="trade-item" style="color:#00ff66;">
        BUY Order Opened
    </div>
    <h3 style="margin-top:20px;">Trade History</h3>
    `;
};

document.querySelector(".sell").onclick = function () {
    openOrders.innerHTML = `
    <h3>Open Orders</h3>
    <div class="trade-item" style="color:#ff4444;">
        SELL Order Opened
    </div>
    <h3 style="margin-top:20px;">Trade History</h3>
    `;
};
</script>

</body>
</html>

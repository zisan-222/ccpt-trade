<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CptMarkets - Trade</title>

<link rel="stylesheet" href="trade.css">
<link rel="stylesheet" href="trade.professional.css">
<link rel="stylesheet" href="trade-popup.css">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://s3.tradingview.com/tv.js"></script>

</head>

<body>

<div class="trade-page">

<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="trade-header">

    <a href="dashboard.html" class="back-btn">
        <i class="fa-solid fa-chevron-left"></i>
    </a>

    <div class="pair-box">
        <h1>XAUUSD</h1>
        <p>Gold / USD</p>
    </div>

    <div class="header-icons">

        <button onclick="window.location.href='orders.html'">
            <i class="fa-regular fa-clipboard"></i>
        </button>

        <button onclick="window.location.href='markets.html'">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <button id="languageBtn" class="language-btn" type="button"
          style="background:none;border:none;cursor:pointer;font-size:20px;padding:2px;line-height:1;">
          🇬🇧
        </button>

    </div>

</header>


<!-- =========================================================
     PRICE
     ========================================================= -->

<section class="price-box">

    <h2 id="livePrice">
        4269.29
    </h2>

    <div class="change green" id="changeBox">
        +0.52%
    </div>

    <p>
        Gold/USD
    </p>

</section>


<!-- =========================================================
     INDICATORS
     ========================================================= -->

<div class="indicator-bar">

    <button class="active">MA</button>
    <button>EMA</button>
    <button>BOLL</button>
    <button>RSI</button>
    <button>MACD</button>

</div>


<!-- =========================================================
     TRADINGVIEW CHART
     ========================================================= -->

<div class="chart-card">

    <div id="tvchart"></div>

</div>


<!-- =========================================================
     TIMEFRAME
     ========================================================= -->

<div class="timeframe">

    <button class="active">1m</button>
    <button>5m</button>
    <button>15m</button>
    <button>30m</button>
    <button>1h</button>
    <button>1d</button>

</div>


<!-- =========================================================
     LEVERAGE / TRADE PANEL
     ========================================================= -->

<section class="trade-panel">

    <h3 data-key="leverage">Leverage</h3>

    <div class="leverage-grid">

        <button>10x</button>
        <button>20x</button>
        <button>50x</button>
        <button class="active">100x</button>

        <button>150x</button>
        <button>200x</button>
        <button>300x</button>
        <button>500x</button>

        <button>1000x</button>
        <button>2000x</button>

    </div>


    <div class="mode-switch">

        <button class="active">
            By Amount
        </button>

        <button>
            By Lots
        </button>

    </div>


    <label>
        Amount / Margin (USD)
    </label>

    <input
    type="number"
    id="amount"
    value=""
    placeholder="Enter Amount">


    <div class="tp-sl">

        <div>

            <label>
                TP Price
            </label>

            <input
                type="number"
                id="tpPrice"
                placeholder="Optional">

        </div>


        <div>

            <label>
                SL Price
            </label>

            <input
                type="number"
                id="slPrice"
                placeholder="Optional">

        </div>

    </div>


    <div class="summary">

        <div>
            <span data-key="leverage">Leverage</span>
            <strong id="levValue">100x</strong>
        </div>

        <div>
            <span data-key="convertedLots">Converted Lots</span>
            <strong id="lotsValue">0.02 Lot</strong>
        </div>

        <div>
            <span data-key="contractValue">Contract Value</span>
            <strong>$10,000.00</strong>
        </div>

        <div>
            <span>Est. Margin</span>
            <strong id="marginValue">$100.00</strong>
        </div>

    </div>


    <div class="trade-buttons">

        <button
            class="long-btn"
            id="longBtn"
            type="button">
            Long
        </button>

        <button
            class="short-btn"
            id="shortBtn"
            type="button">
            Short
        </button>

    </div>

</section>


<!-- =========================================================
     OPEN TRADE

     IMPORTANT:
     The old inline trade modal and inline popup HTML have
     intentionally been removed.

     trade.js now calls trade-popup.js, and trade-popup.js
     creates/displays the professional popup itself.
     ========================================================= -->

<div
    class="open-trade-card"
    id="openTradeCard">

    <div class="open-trade-header">

        <h3>
            Open Trade
        </h3>

        <span id="positionSide">
            LONG
        </span>

    </div>


    <div class="open-trade-info">

        <div>
            <span data-key="entryPrice">Entry Price</span>
            <strong id="entryPrice">0.00</strong>
        </div>

        <div>
            <span data-key="currentPrice">Current Price</span>
            <strong id="currentTradePrice">0.00</strong>
        </div>

        <div>
            <span data-key="amount">Amount</span>
            <strong id="tradeAmount">$0.00</strong>
        </div>

        <div>
            <span>Profit / Loss</span>
            <strong id="tradePL">$0.00</strong>
        </div>

    </div>


    <button
        class="close-trade-btn"
        id="closeTradeBtn"
        type="button">

        Close Trade

    </button>

</div>


<!-- =========================================================
     BOTTOM NAVIGATION
     ========================================================= -->

<nav class="bottom-nav">

    <a href="dashboard.html">
        <i class="fa-solid fa-house"></i>
        <span data-key="navHome">Home</span>
    </a>

    <a href="markets.html">
        <i class="fa-solid fa-chart-line"></i>
        <span data-key="navMarkets">Markets</span>
    </a>

    <a href="trade.html" class="trade-btn">
        <i class="fa-solid fa-arrow-up-arrow-down"></i>
    </a>

    <a href="assets.html">
        <i class="fa-solid fa-wallet"></i>
        <span data-key="navAssets">Assets</span>
    </a>

    <a href="mine.html">
        <i class="fa-solid fa-user"></i>
        <span data-key="navMine">Mine</span>
    </a>

</nav>

</div>


<!-- =========================================================
     SCRIPTS
     ========================================================= -->

<script src="balance.js"></script>
<script src="trade.js"></script>

<!--
    This file is intentionally loaded as a module because the
    popup system is a separate JS module. It exposes its public
    functions through window so trade.js can call them.
-->
<script type="module" src="trade-popup.js"></script>


<script src="lang.js"></script>
<script src="translator.js"></script>
</body>
</html>

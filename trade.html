<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CptMarkets Trade</title>

    <link rel="stylesheet" href="trade.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div class="trade-page">

    <!-- Header -->

    <header class="trade-header">

        <a href="dashboard.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="pair-box">

            <h2>XAU/USD</h2>

            <span>Gold Spot</span>

        </div>

        <div class="price-box">

            <h2 id="livePrice">3253.89</h2>

            <span id="priceChange">+0.80%</span>

        </div>

    </header>

    <!-- TradingView Style Chart -->

    <section class="chart-card">

        <div id="tvChart"></div>

    </section>

    <!-- Trade Panel -->

    <section class="trade-card">

        <div class="input-group">

            <label>Amount (USD)</label>

            <input
                type="number"
                id="tradeAmount"
                value="100"
                min="10">

        </div>

        <div class="input-group">

            <label>Duration</label>

            <select id="tradeTime">

                <option value="30">30 Seconds</option>

                <option value="60">1 Minute</option>

                <option value="300">5 Minutes</option>

            </select>

        </div>

                <div class="trade-buttons">

            <button id="buyBtn" class="buy-btn">
                <i class="fa-solid fa-arrow-trend-up"></i>
                BUY
            </button>

            <button id="sellBtn" class="sell-btn">
                <i class="fa-solid fa-arrow-trend-down"></i>
                SELL
            </button>

        </div>

    </section>

    <!-- Active Trade -->

    <section class="active-card">

        <h3>Active Trade</h3>

        <div class="trade-row">
            <span>Pair</span>
            <strong>XAU/USD</strong>
        </div>

        <div class="trade-row">
            <span>Direction</span>
            <strong id="direction">Waiting...</strong>
        </div>

        <div class="trade-row">
            <span>Amount</span>
            <strong id="amount">$0.00</strong>
        </div>

        <div class="trade-row">
            <span>Time Left</span>
            <strong id="countdown">00:00</strong>
        </div>

        <div class="trade-row">
            <span>Result</span>
            <strong id="result">-</strong>
        </div>

    </section>

    <!-- Trade History -->

    <section class="history-card">

        <h3>Trade History</h3>

        <div id="historyList">

            <p class="empty-history">
                No trades yet.
            </p>

        </div>

    </section>

</div>

<script src="trade.js"></script>

</body>
</html>

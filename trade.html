<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CptMarkets Trade</title>

<link rel="stylesheet" href="trade.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

</head>

<body>

<div class="trade-page">

    <!-- HEADER -->

    <header class="trade-header">

        <a href="dashboard.html" class="back-btn">
            <i class="fa-solid fa-chevron-left"></i>
        </a>

        <div class="pair-box">

            <h2>XAU/USD</h2>

            <span>Gold / USD</span>

        </div>

        <div class="price-box">

            <h3 id="livePrice">3253.89</h3>

            <small id="priceChange">+0.80%</small>

        </div>

    </header>

    <!-- CHART -->

    <section class="chart-card">

        <div class="indicator-bar">

            <button class="indicator active">MA</button>

            <button class="indicator">EMA</button>

            <button class="indicator">BOLL</button>

            <button class="indicator">RSI</button>

            <button class="indicator">MACD</button>

        </div>

        <div id="tvChart"></div>

        <div class="timeframe">

            <button class="tf active">1m</button>

            <button class="tf">5m</button>

            <button class="tf">15m</button>

            <button class="tf">30m</button>

            <button class="tf">1h</button>

            <button class="tf">1d</button>

        </div>

    </section>
        <!-- LEVERAGE -->

    <section class="trade-panel">

        <h3 class="panel-title">Leverage</h3>

        <div class="leverage-grid">

            <button class="lev-btn">10x</button>
            <button class="lev-btn">20x</button>
            <button class="lev-btn">50x</button>
            <button class="lev-btn active">100x</button>

            <button class="lev-btn">150x</button>
            <button class="lev-btn">200x</button>
            <button class="lev-btn">300x</button>
            <button class="lev-btn">500x</button>

            <button class="lev-btn">1000x</button>
            <button class="lev-btn">2000x</button>

        </div>

        <div class="mode-switch">

            <button class="mode-btn active">By Amount</button>

            <button class="mode-btn">By Lots</button>

        </div>

        <label>Amount / Margin (USD)</label>

        <input
            type="number"
            id="amount"
            value="100">

        <div class="price-inputs">

            <div>

                <label>TP Price</label>

                <input
                    type="number"
                    placeholder="Optional">

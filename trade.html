<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CptMarkets Trade</title>

<link rel="stylesheet" href="trade.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="trade-container">

<!-- Header -->

<header class="trade-header">

<a href="dashboard.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

</a>

<div class="market-info">

<h2>XAU/USD</h2>

<p>Gold Spot</p>

</div>

<div class="live-price">

<h3 id="livePrice">3253.20</h3>

<span id="priceChange" class="up">

+0.18%

</span>

</div>

</header>

<!-- Chart -->

<section class="chart-section">

<canvas id="tradeChart"></canvas>

</section>

<!-- Trade Control -->

<section class="trade-control">

<div class="input-group">

<label>Amount (USD)</label>

<input
type="number"
id="tradeAmount"
value="100"
min="10">

</div>

<div class="input-group">

<label>Duration</label>

<select id="tradeTime">

<option value="30">30 Seconds</option>

<option value="60">1 Minute</option>

<option value="300">5 Minutes</option>

</select>

</div>

<div class="trade-buttons">

<button
class="buy-btn"
id="buyBtn">

<i class="fa-solid fa-arrow-trend-up"></i>

BUY

</button>

<button
class="sell-btn"
id="sellBtn">

<i class="fa-solid fa-arrow-trend-down"></i>

SELL

</button>

</div>

</section>
<!-- Active Trade -->

<section class="active-trade">

    <h3>Active Trade</h3>

    <div class="trade-row">
        <span>Pair</span>
        <strong id="pairName">XAU/USD</strong>
    </div>

    <div class="trade-row">
        <span>Direction</span>
        <strong id="direction">Waiting...</strong>
    </div>

    <div class="trade-row">
        <span>Amount</span>
        <strong id="amount">$0.00</strong>
    </div>

    <div class="trade-row">
        <span>Time Left</span>
        <strong id="countdown">00:00</strong>
    </div>

    <div class="trade-row">
        <span>Result</span>
        <strong id="result">No Trade</strong>
    </div>

</section>

<!-- Trade History -->

<section class="history-section">

    <div class="history-header">
        <h3>Trade History</h3>
    </div>

    <div id="historyList">

        <div class="empty-history">
            No trade history available.
        </div>

    </div>

</section>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Trade Script -->
<script src="trade.js"></script>

</body>
</html>

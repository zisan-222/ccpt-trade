<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CptMarkets - Settings</title>
<link rel="stylesheet" href="markets.css">
<style>
#settingsLangItem:hover { background: #1d2d50 !important; }
</style>
</head>
<body>

<div class="market-container">
    <header class="market-header">
        <div class="logo" style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:22px; text-shadow: 0 2px 5px rgba(0,0,0,0.5);">🛡️</span> 
            <span style="background: linear-gradient(135deg, #ffc928, #ff9800); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 2px 10px rgba(255,201,40,0.3);" data-key="settingsTitle">Settings</span>
        </div>
        <div class="icons">
            <button id="languageBtn" class="language-btn" type="button"
              style="background:none;border:none;cursor:pointer;font-size:22px;padding:0 6px;line-height:1;color:#fff;">
              🇬🇧
            </button>
            <a href="mine.html" style="text-decoration:none; font-size:20px; color:#fff;" title="Back">✕</a>
        </div>
    </header>

    <div class="market-list" style="margin-top:20px;">
        <div class="market-item" style="cursor:default;">
            <div>
                <h3>Account Security</h3>
                <p>Change password and security options</p>
            </div>
            <div class="price"><span>🔒</span></div>
        </div>

        <div class="market-item" id="settingsLangItem" style="cursor:pointer; transition: background 0.2s;">
            <div>
                <h3 data-key="language">Language</h3>
                <p id="settingsLangText">English (UK)</p>
            </div>
            <div class="price">
                <span id="settingsLangFlag" style="font-size:22px;">🇬🇧</span>
            </div>
        </div>

        <div class="market-item" style="cursor:default;">
            <div>
                <h3>Dark Mode</h3>
                <p>Active (Professional Theme)</p>
            </div>
            <div class="price"><span class="green">ON</span></div>
        </div>

        <div class="market-item" style="cursor:default;">
            <div>
                <h3>App Version</h3>
                <p>v2.5.0 Pro</p>
            </div>
            <div class="price"><span style="color:#888;">Latest</span></div>
        </div>
    </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
<a href="dashboard.html">🏠<br>Home</a>
<a href="markets.html">📈<br>Markets</a>
<a href="trade.html" class="center-trade-btn" title="Trade"><span>⇄</span></a>
<a href="assets.html">💼<br>Assets</a>
<a href="mine.html">👤<br>Mine</a>
</div>


<script src="lang.js"></script>
<script src="translator.js"></script>
</body>
</html>

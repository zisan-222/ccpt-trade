<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal - CptMarkets</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #04060f 0%, #0b1120 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Header Style */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(30, 41, 59, 0.8);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .back-btn {
            color: #facc15;
            font-size: 15px;
            text-decoration: none;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(250, 204, 21, 0.2);
            padding: 8px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .back-btn:hover {
            background: #334155;
            border-color: #facc15;
        }
        .header h1 {
            color: #facc15;
            font-size: 18px;
            font-weight: 800;
            margin: 0;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Container */
        .container {
            padding: 24px 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* 3D Hero Icon Section */
        .hero-section {
            text-align: center;
            margin-bottom: 25px;
        }
        .withdraw-hero-icon {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .withdraw-icon-glow {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(245, 197, 66, 0.15);
            filter: blur(12px);
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(0.95); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        .withdraw-icon-circle {
            position: relative;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            font-size: 28px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 8px 20px rgba(0,0,0,0.4);
        }
        .hero-section h2 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px;
            color: #f8fafc;
        }
        .hero-section p {
            color: #94a3b8;
            font-size: 13.5px;
            margin: 0;
            line-height: 1.5;
        }

        /* Form Card Box */
        .withdraw-card {
            background: linear-gradient(145deg, #0f172a, #080d1a);
            border: 1px solid rgba(51, 65, 85, 0.6);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 15px;
        }
        .input-wrapper input, .input-wrapper select {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            padding: 12px 14px 12px 42px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .input-wrapper input:focus, .input-wrapper select:focus {
            border-color: #facc15;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.15);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffe88a, #f5c542, #d79600);
            border: none;
            padding: 14px;
            border-radius: 12px;
            color: #111827;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(245, 197, 66, 0.25);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 197, 66, 0.4);
        }

        /* Popup Notification Box */
        .popup-message {
            display: none;
            margin-top: 15px;
            padding: 14px;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(250, 204, 21, 0.3);
            text-align: center;
            font-size: 13px;
            color: #f8fafc;
            line-height: 1.5;
        }

        /* Security Notice */
        .security-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            text-align: left;
        }
        .security-box i {
            color: #facc15;
            font-size: 16px;
            margin-top: 2px;
        }
        .security-box p {
            margin: 0;
            font-size: 11.5px;
            color: #8491a8;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h1><i class="fa-solid fa-shield-halved"></i> CptMarkets</h1>
        <div style="width: 35px;"></div>
    </div>

    <div class="container">
        <!-- 3D Hero Section -->
        <div class="hero-section">
            <div class="withdraw-hero-icon">
                <div class="withdraw-icon-glow"></div>
                <div class="withdraw-icon-circle">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </div>
            </div>
            <h2>International Withdrawal</h2>
            <p>Secure global transfer to your crypto wallet or bank account.</p>
        </div>

        <!-- Withdrawal Form Card -->
        <div class="withdraw-card">
            <form id="withdrawForm" onsubmit="handleInternationalWithdraw(event)">
                <div class="input-group">
                    <label>International Payment Method</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-globe"></i>
                        <select id="paymentMethod" required>
                            <option value="" disabled selected>Select global payment system</option>
                            <option value="crypto">Crypto Wallet (USDT / Binance TRC20)</option>
                            <option value="bank">International Bank Wire Transfer</option>
                            <option value="wallet">Electronic Wallet (Skrill / Neteller)</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Withdrawal Amount (USD)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-dollar-sign"></i>
                        <input type="number" id="withdrawAmount" placeholder="Enter amount (Min $10)" min="1" step="0.01" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Wallet Address / Account Details & Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-address-card"></i>
                        <input type="text" id="walletAddress" placeholder="Enter wallet address or account number" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Security Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="securityPassword" placeholder="Enter trading / fund password" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Submit Request</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <!-- Professional Popup Notification -->
                <div id="popupMessage" class="popup-message"></div>
            </form>
        </div>

        <!-- Security Notice -->
        <div class="security-box">
            <i class="fa-solid fa-shield-cat"></i>
            <p><strong>Global Security:</strong> All financial transactions are heavily encrypted and processed securely according to international compliance standards.</p>
        </div>
    </div>

    <!-- Firebase SDK & Validation Logic -->
    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
        const firebaseConfig = await import("./firebase/firebase-config.js");
        const auth = firebaseConfig.auth;
        const db = firebaseConfig.db;

        let userBalance = 0;

        // Fetch live balance from Firebase
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userRef = doc(db, "users", user.uid);
                    const docSnap = await getDoc(userRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        userBalance = Number(data.balance) || 0;
                    }
                } catch (err) {
                    console.error("Balance fetch error:", err);
                }
            }
        });

        window.handleInternationalWithdraw = async function(event) {
            event.preventDefault();

            const amountInput = parseFloat(document.getElementById("withdrawAmount").value);
            const popup = document.getElementById("popupMessage");

            popup.style.display = "block";

            // Condition 1: Check if balance is 0 or empty
            if (userBalance <= 0) {
                popup.style.color = "#f87171";
                popup.innerHTML = "Your account balance is insufficient. Please recharge first.";
                return;
            }

            // Condition 2: Check if withdrawal amount exceeds balance
            if (amountInput > userBalance) {
                popup.style.color = "#f87171";
                popup.innerHTML = "Your withdrawal amount exceeds available balance. Please check your funds.";
                return;
            }

            // Condition 3: If balance is available but needs customer service verification
            popup.style.color = "#facc15";
            popup.innerHTML = "Withdrawal request received. Please contact Customer Service to complete your verification.";

            setTimeout(() => {
                if (typeof window.openSupportChat === "function") {
                    window.openSupportChat();
                }
            }, 2000);
        };
    </script>
</body>
</html>

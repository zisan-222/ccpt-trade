<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 720 360"
     preserveAspectRatio="xMidYMid slice">

  <defs>

    <!-- Premium dark blue background -->
    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0"
            stop-color="#07172d"/>

      <stop offset="0.48"
            stop-color="#061d3a"/>

      <stop offset="1"
            stop-color="#020a18"/>

    </linearGradient>


    <!-- Gold lighting -->
    <radialGradient id="goldGlow"
                    cx="78%"
                    cy="25%"
                    r="58%">

      <stop offset="0"
            stop-color="#f7c843"
            stop-opacity="0.30"/>

      <stop offset="0.45"
            stop-color="#d89d1e"
            stop-opacity="0.10"/>

      <stop offset="1"
            stop-color="#000000"
            stop-opacity="0"/>

    </radialGradient>


    <!-- Gold candle gradient -->
    <linearGradient id="gold"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

      <stop offset="0"
            stop-color="#ffe38a"/>

      <stop offset="0.45"
            stop-color="#f7c843"/>

      <stop offset="1"
            stop-color="#b87908"/>

    </linearGradient>


    <!-- Soft shadow -->
    <filter id="shadow">

      <feDropShadow
          dx="0"
          dy="4"
          stdDeviation="5"
          flood-color="#000000"
          flood-opacity="0.45"/>

    </filter>


    <!-- Candle glow -->
    <filter id="candleGlow">

      <feGaussianBlur
          stdDeviation="5"
          result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>

  </defs>



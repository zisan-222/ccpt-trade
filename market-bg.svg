<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 430"
     width="1200"
     height="430"
     preserveAspectRatio="xMidYMid slice">

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="50%" stop-color="#07172b"/>
      <stop offset="100%" stop-color="#09203f"/>
    </linearGradient>

    <!-- 3D Bullish Candle Gradient (Green/Cyan Glow) -->
    <linearGradient id="bull3D" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffb4"/>
      <stop offset="40%" stop-color="#00b882"/>
      <stop offset="80%" stop-color="#007a56"/>
      <stop offset="100%" stop-color="#004d36"/>
    </linearGradient>
    <linearGradient id="bullTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80ffe1"/>
      <stop offset="100%" stop-color="#00b882"/>
    </linearGradient>

    <!-- 3D Bearish Candle Gradient (Red/Coral Glow) -->
    <linearGradient id="bear3D" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="40%" stop-color="#d32f2f"/>
      <stop offset="80%" stop-color="#9a0007"/>
      <stop offset="100%" stop-color="#5f0004"/>
    </linearGradient>
    <linearGradient id="bearTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9999"/>
      <stop offset="100%" stop-color="#d32f2f"/>
    </linearGradient>

    <!-- Old Map Golden Gradient -->
    <linearGradient id="oldMapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99c47" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6e4f13" stop-opacity="0.15"/>
    </linearGradient>

    <!-- TradingView EMA Line Gradient -->
    <linearGradient id="emaLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="50%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#ffeb3b"/>
    </linearGradient>

    <!-- TradingView Grid Pattern -->
    <pattern id="tvGrid" width="60" height="40" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 40" fill="none" stroke="#1e2d42" stroke-width="1" stroke-dasharray="2,2"/>
    </pattern>

    <!-- Filters for 3D Glow & Shadows -->
    <filter id="glow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow3D">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. MAIN BACKGROUND -->
  <rect width="1200" height="430" fill="url(#bg)"/>
  
  <!-- 2. TRADINGVIEW GRID -->
  <rect width="1200" height="430" fill="url(#tvGrid)" opacity="0.8"/>

  <!-- 3. VINTAGE/OLD WORLD MAP BACKGROUND LAYER -->
  <g stroke="#b8860b" stroke-width="1" stroke-dasharray="3,1" fill="url(#oldMapGrad)" filter="url(#shadow3D)">
    <!-- North America (Old Compass/Line Style) -->
    <path d="M50 110 L90 80 L140 65 L200 85 L260 120 L240 150 L180 180 L120 150 Z"/>
    <path d="M70 120 L130 90 L180 110 L220 140 M100 140 L160 120"/>
    <!-- South America -->
    <path d="M230 200 L280 220 L270 290 L230 350 L200 300 L220 240 Z"/>
    <path d="M240 230 L260 280 M220 260 L250 310"/>
    <!-- Europe & Africa -->
    <path d="M510 100 L580 90 L630 110 L600 150 L530 140 Z"/>
    <path d="M530 150 L610 160 L590 270 L540 280 L520 200 Z"/>
    <!-- Asia -->
    <path d="M630 100 L750 70 L900 90 L1020 140 L950 190 L800 170 L650 130 Z"/>
    <path d="M700 110 L850 100 M750 140 L920 130"/>
    <!-- Australia -->
    <path d="M920 290 L1040 280 L1050 340 L950 350 Z"/>
    <!-- Old Navigation Lines / Rhumb Lines -->
    <path d="M0 215 H1200 M600 0 V430 M300 0 L900 430 M900 0 L300 430" stroke="#8b6508" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- 4. TRADINGVIEW INDICATORS & AXIS -->
  <!-- Right Price Axis Bar -->
  <rect x="1135" y="0" width="65" height="430" fill="#0b1726" stroke="#1e2d42" stroke-width="1"/>
  <g fill="#607d8b" font-family="monospace" font-size="11">
    <text x="1142" y="50">68,450.00</text>
    <text x="1142" y="120">66,200.50</text>
    <text x="1142" y="190">64,110.00</text>
    <text x="1142" y="260">62,800.25</text>
    <text x="1142" y="330">60,150.00</text>
    <text x="1142" y="400">58,900.00</text>
  </g>

  <!-- Live Price Badge (TradingView Style) -->
  <g transform="translate(1135, 135)">
    <rect width="65" height="22" rx="3" fill="#00b882"/>
    <text x="5" y="15" fill="#fff" font-family="monospace" font-size="11" font-weight="bold">65,420.50</text>
  </g>

  <!-- Volume Bars (Bottom) -->
  <g opacity="0.4">
    <rect x="50" y="360" width="16" height="40" fill="#ff5252"/>
    <rect x="110" y="340" width="16" height="60" fill="#00b882"/>
    <rect x="170" y="370" width="16" height="30" fill="#ff5252"/>
    <rect x="230" y="320" width="16" height="80" fill="#00b882"/>
    <rect x="290" y="350" width="16" height="50" fill="#00b882"/>
    <rect x="350" y="380" width="16" height="20" fill="#ff5252"/>
    <rect x="410" y="310" width="16" height="90" fill="#00b882"/>
    <rect x="470" y="330" width="16" height="70" fill="#ff5252"/>
    <rect x="530" y="290" width="16" height="110" fill="#00b882"/>
    <rect x="590" y="340" width="16" height="60" fill="#ff5252"/>
    <rect x="650" y="300" width="16" height="100" fill="#00b882"/>
    <rect x="710" y="280" width="16" height="120" fill="#00b882"/>
    <rect x="770" y="320" width="16" height="80" fill="#ff5252"/>
    <rect x="830" y="260" width="16" height="140" fill="#00b882"/>
    <rect x="890" y="240" width="16" height="160" fill="#00b882"/>
    <rect x="950" y="270" width="16" height="130" fill="#ff5252"/>
    <rect x="1010" y="210" width="16" height="190" fill="#00b882"/>
    <rect x="1070" y="180" width="16" height="220" fill="#00b882"/>
  </g>

  <!-- 5. 3D CYLINDER CANDLESTICKS (Inside Old Map & Grid Layout) -->
  <g filter="url(#shadow3D)">
    
    <!-- Candle 1 (Bullish 3D) -->
    <line x1="58" y1="280" x2="58" y2="370" stroke="#00ffb4" stroke-width="3"/>
    <rect x="46" y="300" width="24" height="50" rx="3" fill="url(#bull3D)"/>
    <ellipse cx="58" cy="300" rx="12" ry="4" fill="url(#bullTop)"/>

    <!-- Candle 2 (Bearish 3D) -->
    <line x1="118" y1="240" x2="118" y2="350" stroke="#ff5252" stroke-width="3"/>
    <rect x="106" y="260" width="24" height="70" rx="3" fill="url(#bear3D)"/>
    <ellipse cx="118" cy="260" rx="12" ry="4" fill="url(#bearTop)"/>

    <!-- Candle 3 (Bullish 3D) -->
    <line x1="178" y1="270" x2="178" y2="360" stroke="#00ffb4" stroke-width="3"/>
    <rect x="166" y="280" width="24" height="60" rx="3" fill="url(#bull3D)"/>
    <ellipse cx="178" cy="280" rx="12" ry="4" fill="url(#bullTop)"/>

    <!-- Candle 4 (Bullish 3D) -->
    <line x1="238" y1="200" x2="238" y2="310" stroke="#00ffb4" stroke-width="3"/>
    <rect x="226" y="220" width="24" height="70" rx="3" fill="url(#bull3D)"/>
    <ellipse cx="238" cy="220" rx="12" ry="4" fill="url(#bullTop)"/>

    <!-- Candle 5 (Bearish 3D) -->
    <line x1="298" y1="210" x2="298" y2="310" stroke="#ff5252" stroke-width="3"/>
    <rect x="286" y="230" width="24" height="50" rx="3" fill="url(#bear3D)"/>
    <ellipse cx="298" cy="230" rx="12" ry="4" fill="url(#bearTop)"/>

    <!-- Candle 6 (Bullish 3D) -->
    <line x1="358" y1="180" x2="358" y2="280" stroke="#00ffb4" stroke-width="3"/>
    <rect x="346" y="200" width="24" height="65" rx="3" fill="url(#bull3D)"/>
    <ellipse cx="358" cy="200" rx="12" ry="4" fill="url(#bullTop)"/>

    <!-- Candle 7 (Bearish 3D) -->
    <line x1="418" y1="190" x2="418" y2="290" stroke="#ff5252" stroke-width="3"/>
    <rect x="406" y="210" width="24" height="60" rx="3" fill="url(#bear3D)"/>
    <ellipse cx="418" cy="210" rx="12" ry="4" fill="url(#bearTop)"/>

    <!-- Candle 8 (Bullish 3D) -->
    <line x1="478" y1="140" x2="478" y2="250" stroke="#00ffb4" stroke-width="3"/>
    <rect x="466" y="160" width="24" height="75" rx="3" fill="url(#bull3D)"/>
    <ellipse cx="478" cy="160" rx="12" ry="4" fill="url(#bullTop)"/>

    <!-- Candle 9 (Bearish 3D) -->
    <line x1="538" y1="160" x2="538" y2="270" stroke="#ff5252" stroke-width="3"/>
    <rect x="526" y="180" width="24" height="70" rx="3" fill="url(#bear3D)"/>
    <ellipse cx="538" cy="180" rx="12" ry="4" fill="url(#bearTop)"/>

    <!-- Candle 10 (Bullish 3D) -->
    <line x1="598" y1="120" x2="598" y2="220" stroke="#00ffb4" stroke-width="3"/>
    <rect x="586" y="140" width="24" height="65" rx="3" fill="url(#bull3D)"/>
    <ellipse cx="598" cy="140" rx="12" ry="4" fill="url(#bullTop)"/>

    <!-- Candle 11 (Bullish 3D - Peak) -->
    <line x1="658" y1="80" x2="658" y2="200" stroke="#00ffb4" stroke-width="3"/>
    <rect x="646" y="100" width="24" height="80" rx="3" fill="url(#bull3D)"/>
    <ellipse cx="658" cy="100" rx="12" ry="4" fill="url(#bullTop)"/>

    <!-- Candle 12 (Bearish 3D) -->
    <line x1="718" y1="110" x2="718" y2="230" stroke="#ff5252" stroke-width="3"/>
    <rect x="706" y="130" width="24" height="75" rx="3" fill="url(#bear3D)"/>
    <ellipse cx="718" cy="130" rx="12" ry="4" fill="url(#bearTop)"/>

    <!-- Candle 13 (Bullish 3D) -->
    <line x1="778" y1="100" x2="778" y2="210" stroke="#00ffb4" stroke-width="3"/>
    <rect x="766" y="120" width="24" height="70" rx="3" fill="url(#bull3D)"/>
    <ellipse cx="778" cy="120" rx="12" ry="4" fill="url(#bullTop)"/>

    <!-- Candle 14 (Bullish 3D) -->
    <line x1="838" y1="70" x2="838" y2="180" stroke="#00ffb4" stroke-width="3"/>
    <rect x="826" y="90" width="24" height="70" rx="3" fill="url(#bull3D)"/>
    <ellipse cx="838" cy="90" rx="12" ry="4" fill="url(#bullTop)"/>

    <!-- Candle 15 (Bullish 3D Strong) -->
    <line x1="898" y1="50" x2="898" y2="160" stroke="#00ffb4" stroke-width="3"/>
    <rect x="886" y="70" width="24" height="75" rx="3" fill="url(#bull3D)"/>
    <ellipse cx="898" cy="70" rx="12" ry="4" fill="url(#bullTop)"/>

    <!-- Candle 16 (Bearish 3D Adjustment) -->
    <line x1="958" y1="70" x2="958" y2="170" stroke="#ff5252" stroke-width="3"/>
    <rect x="946" y="90" width="24" height="60" rx="3" fill="url(#bear3D)"/>
    <ellipse cx="958" cy="90" rx="12" ry="4" fill="url(#bearTop)"/>

    <!-- Candle 17 (Bullish 3D All-Time High) -->
    <line x1="1018" y1="30" x2="1018" y2="140" stroke="#00ffb4" stroke-width="3"/>
    <rect x="1006" y="50" width="24" height="75" rx="3" fill="url(#bull3D)"/>
    <ellipse cx="1018" cy="50" rx="12" ry="4" fill="url(#bullTop)"/>

    <!-- Candle 18 (Bullish 3D Current) -->
    <line x1="1078" y1="20" x2="1078" y2="120" stroke="#00ffb4" stroke-width="3"/>
    <rect x="1066" y="40" width="24" height="65" rx="3" fill="url(#bull3D)"/>
    <ellipse cx="1078" cy="40" rx="12" ry="4" fill="url(#bullTop)"/>

  </g>

  <!-- 6. TRADINGVIEW MOVING AVERAGE (EMA) TREND LINE -->
  <path d="
    M 58 320
    Q 118 290, 178 300
    T 298 250
    T 418 230
    T 538 200
    T 658 120
    T 778 140
    T 898 80
    T 1078 45"
    fill="none"
    stroke="url(#emaLine)"
    stroke-width="3.5"
    stroke-linecap="round"
    filter="url(#glow3D)"/>

  <!-- Horizontal Price Target Line (TradingView Style) -->
  <line x1="0" y1="145" x2="1135" y2="145" stroke="#00b882" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Top Overlay Frame -->
  <rect x="2" y="2" width="1196" height="426" rx="20" fill="none" stroke="#2a3b50" stroke-width="3"/>
</svg>

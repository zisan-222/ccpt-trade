<svg xmlns="http://w3.org" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- ডার্ক ব্লু ফাইন্যান্সিয়াল ব্যাকগ্রাউন্ড গ্রেডিয়েন্ট -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020719"/>
      <stop offset="50%" stop-color="#05143a"/>
      <stop offset="100%" stop-color="#02081d"/>
    </linearGradient>

    <!-- হরাইজন গোল্ডেন ও ব্লু মিক্সড গ্লো  -->
    <radialGradient id="centerGlow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#0052cc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- ক্যান্ডেলস্টিক ও ট্রেন্ড লাইনের প্রিমিয়াম গোল্ডেন গ্রেডিয়েন্ট -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <!-- ক্যান্ডেলস্টিক ফিল কালার -->
    <linearGradient id="candleBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdf00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b58900" stop-opacity="0.5"/>
    </linearGradient>

    <!-- নিয়ন লাইটিং ও গ্লো ফিল্টার -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ব্যাকগ্রাউন্ড লেয়ার সমূহ -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#centerGlow)"/>

  <!-- ২ডি ওয়ার্ল্ড ম্যাপ আউটলাইন পাথ (ছবির ব্যাকগ্রাউন্ডের মতো) -->
  <g fill="none" stroke="#102b6b" stroke-width="1.5" opacity="0.35" transform="translate(40, 60) scale(1.8)">
    <path d="M50,50 L70,40 L90,45 L110,65 L100,90 L90,120 L105,150 L95,180 L105,220 L95,260 L80,240 L75,200 L85,160 L65,140 L50,110 Z M90,120 L110,130 L120,150 L115,180 L105,190 L95,180 Z" />
    <path d="M120,20 L150,15 L160,35 L140,50 L125,40 Z" />
    <path d="M220,70 L250,55 L280,60 L295,80 L280,105 L265,120 L285,155 L295,190 L280,220 L260,240 L250,200 L255,170 L230,155 L215,110 Z" />
    <path d="M295,80 L340,50 L400,55 L440,70 L425,120 L405,145 L425,180 L390,205 L365,190 L345,145 L320,125 Z" />
    <path d="M345,145 L355,165 L365,155 L370,175 L360,185 L350,175 Z" />
    <path d="M405,220 L430,215 L440,240 L410,250 Z" />
  </g>

  <!-- গোল্ডেন ডাটা নেটওয়ার্ক লাইন -->
  <g stroke="#ffdf00" stroke-width="1" opacity="0.4" fill="none">
    <path d="M300,300 L500,200 L750,320 L1000,250 L1300,400 L1600,220" />
    <path d="M500,200 L680,120 L900,280 L1200,150 L1450,350 L1750,180" stroke-width="0.8" />
    <path d="M300,300 Q600,450 900,280 T1600,220" stroke="#0052cc" stroke-width="1.5" />
    <path d="M750,320 L1200,150" />
    <path d="M1000,250 L1450,350" />
  </g>

  <!-- নেটওয়ার্ক ডাটা নোড বা জ্বলজ্বলে পয়েন্ট -->
  <g fill="url(#goldGrad)" filter="url(#neonGlow)" opacity="0.8">
    <circle cx="500" cy="200" r="6" />
    <circle cx="680" cy="120" r="4" fill="#ffffff" />
    <circle cx="750" cy="320" r="7" />
    <circle cx="900" cy="280" r="5" />
    <circle cx="1200" cy="150" r="8" />
    <circle cx="1450" cy="350" r="6" />
    <circle cx="1600" cy="220" r="5" />
  </g>

  <!-- নিচ দিয়ে প্রবাহিত মূল গোল্ডেন ট্রেন্ড লাইন -->
  <path d="M 100,950 Q 450,900 700,650 T 1300,550 T 1920,250" fill="none" stroke="#fffb00" stroke-width="3.5" filter="url(#neonGlow)"/>

  <!-- ক্যান্ডেলস্টিক চার্ট -->
  <g fill="url(#candleBody)" stroke="url(#goldGrad)" stroke-width="1.8">
    <line x1="150" y1="910" x2="150" y2="960" /><rect x="142" y="920" width="16" height="30" />
    <line x1="250" y1="860" x2="250" y2="920" /><rect x="242" y="875" width="16" height="35" />
    <line x1="350" y1="800" x2="350" y2="870" /><rect x="342" y="815" width="16" height="40" />
    <line x1="450" y1="730" x2="450" y2="810" /><rect x="442" y="745" width="16" height="50" />
    <line x1="560" y1="680" x2="560" y2="760" /><rect x="552" y="695" width="16" height="50" filter="url(#neonGlow)" />
    <line x1="680" y1="610" x2="680" y2="700" /><rect x="672" y="625" width="16" height="55" />
    <line x1="800" y1="550" x2="800" y2="640" /><rect x="792" y="565" width="16" height="60" />
    <line x1="920" y1="520" x2="920" y2="590" /><rect x="912" y="530" width="16" height="45" />
    <line x1="1050" y1="460" x2="1050" y2="540" /><rect x="1042" y="475" width="16" height="50" />
    <line x1="1180" y1="400" x2="1180" y2="490" /><rect x="1172" y="415" width="16" height="60" filter="url(#neonGlow)" />
    <line x1="1300" y1="350" x2="1300" y2="430" /><rect x="1292" y="365" width="16" height="50" />
    <line x1="1420" y1="290" x2="1420" y2="380" /><rect x="1412" y="305" width="16" height="65" />
    <line x1="1540" y1="220" x2="1540" y2="310" /><rect x="1532" y="235" width="16" height="60" filter="url(#neonGlow)" />
    <line x1="1660" y1="160" x2="1660" y2="260" /><rect x="1652" y="175" width="16" height="70" />
    <line x1="1780" y1="90" x2="1780" y2="200" /><rect x="1772" y="110" width="16" height="75" filter="url(#neonGlow)" />
  </g>

  <!-- ট্রেন্ড লাইনের হোয়্যান্ট স্পট -->
  <g fill="#ffffff" filter="url(#neonGlow)">
    <circle cx="680" cy="650" r="5" />
    <circle cx="1180" cy="445" r="5" />
    <circle cx="1660" cy="210" r="6" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 430"
     width="1200"
     height="430"
     preserveAspectRatio="xMidYMid slice">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#050b18"/>
      <stop offset="48%"  stop-color="#071a32"/>
      <stop offset="100%" stop-color="#063a78"/>
    </linearGradient>

    <!-- Gold -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1a5"/>
      <stop offset="35%" stop-color="#ffd15a"/>
      <stop offset="75%" stop-color="#e6a72e"/>
      <stop offset="100%" stop-color="#a96c15"/>
    </linearGradient>

    <!-- Bull candle -->
    <linearGradient id="bull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe999"/>
      <stop offset="45%" stop-color="#e9b842"/>
      <stop offset="100%" stop-color="#b8791b"/>
    </linearGradient>

    <!-- Bear candle -->
    <linearGradient id="bear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8faabd"/>
      <stop offset="100%" stop-color="#31506b"/>
    </linearGradient>

    <!-- Map -->
    <linearGradient id="map" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102d4a"/>
      <stop offset="100%" stop-color="#071b31"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid" width="60" height="43"
             patternUnits="userSpaceOnUse">
      <path d="M60 0H0V43"
            fill="none"
            stroke="#28506e"
            stroke-width="1"
            opacity=".25"/>
    </pattern>

    <!-- Map dots -->
    <pattern id="mapDots"
             width="10"
             height="10"
             patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1"
              fill="#d9a63b"
              opacity=".55"/>
      <circle cx="7" cy="7" r=".7"
              fill="#f4c75c"
              opacity=".35"/>
    </pattern>

    <!-- Glow -->
    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="3"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <filter id="bigGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="10"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>



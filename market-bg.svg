<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06152b"/>
      <stop offset="55%" stop-color="#071d38"/>
      <stop offset="100%" stop-color="#020b1b"/>
    </linearGradient>

    <!-- Gold -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c58b18"/>
      <stop offset="45%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#d99b18"/>
    </linearGradient>

    <!-- Candle -->
    <linearGradient id="candleGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe99a"/>
      <stop offset="100%" stop-color="#d69a20"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glowGold">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60"
            fill="none"
            stroke="#3b6287"
            stroke-opacity=".14"
            stroke-width="1"/>
    </pattern>

    <!-- World map simplified -->
    <path id="world"
      d="
      M95 125
      L130 105 170 108 190 128 178 145 148 146 130 160
      112 151 92 157 76 145 82 132 Z

      M205 165
      L230 150 258 155 275 173 267 193
      250 204 238 230 225 252 214 246
      207 220 216 201 204 184 Z

      M315 112
      L345 94 382 98 402 113 438 110 464 126
      493 124 516 140 505 157 475 160
      452 150 430 161 407 155 388 165
      363 157 342 169 320 155 Z

      M535 165
      L565 151 592 158 610 177 603 199
      580 207 566 228 549 216 556 194 540 184 Z

      M630 110
      L665 96 700 103 724 121 758 118
      783 132 805 127 829 141 820 157
      790 160 768 151 742 162 716 155
      695 169 670 158 648 148 Z

      M850 184
      L875 175 901 184 916 202 908 219
      888 226 870 215 852 222 838 207 Z

      M948 240
      L978 229 1007 235 1025 252
      1012 270 982 276 959 267 941 254 Z
      "/>
  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1200" height="420" fill="url(#bg)"/>

  <rect width="1200" height="420" fill="url(#grid)"/>


  <!-- Atmospheric glow -->

  <ellipse
    cx="930"
    cy="145"
    rx="250"
    ry="150"
    fill="#dba51e"
    opacity=".10"
    filter="url(#softGlow)"
  />

  <ellipse
    cx="300"
    cy="300"
    rx="280"
    ry="130"
    fill="#1464a0"
    opacity=".10"
    filter="url(#softGlow)"
  />


  <!-- ================================================= -->
  <!-- WORLD MAP -->
  <!-- ================================================= -->

  <use
    href="#world"
    fill="none"
    stroke="#9bb8d4"
    stroke-width="2"
    stroke-opacity=".28"
  />

  <!-- Map golden network -->

  <g fill="none"
     stroke="#d7a52a"
     stroke-width="1.5"
     stroke-opacity=".38">

    <path d="M130 138 Q260 185 345 130"/>
    <path d="M345 130 Q470 110 570 185"/>
    <path d="M570 185 Q700 130 820 150"/>
    <path d="M820 150 Q910 190 985 250"/>

    <path d="M220 250 Q360 180 500 225"/>
    <path d="M500 225 Q650 260 780 190"/>
    <path d="M780 190 Q880 170 960 250"/>

  </g>


  <!-- ================================================= -->
  <!-- NETWORK NODES -->
  <!-- ================================================= -->

  <g fill="#ffd75a" filter="url(#glowGold)">

    <circle cx="145" cy="138" r="4"/>

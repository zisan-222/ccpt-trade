<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 650"
     width="1600"
     height="650"
     preserveAspectRatio="xMidYMid slice">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020916"/>
      <stop offset="55%" stop-color="#06162b"/>
      <stop offset="100%" stop-color="#020a17"/>
    </linearGradient>

    <!-- Gold -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="45%" stop-color="#d99b32"/>
      <stop offset="100%" stop-color="#fff0a8"/>
    </linearGradient>

    <!-- Candle gradient -->
    <linearGradient id="candle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd76b"/>
      <stop offset="100%" stop-color="#c98b22"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="70"
             height="50"
             patternUnits="userSpaceOnUse">
      <path d="M70 0H0V50"
            fill="none"
            stroke="#193554"
            stroke-width="1"
            opacity=".22"/>
    </pattern>

  </defs>

  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1600" height="650" fill="url(#bg)"/>

  <rect width="1600"
        height="650"
        fill="url(#grid)"/>


  <!-- ================================================= -->
  <!-- WORLD MAP - STYLIZED 2D -->
  <!-- ================================================= -->

  <g fill="#0b2947"
     stroke="#d39b38"
     stroke-width="1.2"
     opacity=".9">

    <!-- North America -->
    <path d="
      M90 160
      L130 125
      L190 105
      L250 112
      L300 140
      L335 175
      L320 205
      L280 218
      L250 245
      L220 260
      L205 300
      L170 290
      L145 255
      L118 240
      L105 205
      L75 195
      Z"/>

    <!-- South America -->
    <path d="
      M285 305
      L325 315
      L350 350
      L345 390
      L325 430
      L310 480
      L280 530
      L250 500
      L245 450
      L258 410
      L270 370
      L255 335
      Z"/>

    <!-- Europe -->
    <path d="
      M690 145
      L735 125
      L780 132
      L815 150
      L850 160
      L835 182
      L800 190
      L765 178
      L730 185
      L700 170
      Z"/>

    <!-- Asia -->
    <path d="
      M820 145
      L880 110
      L950 100
      L1020 115
      L1100 105
      L1170 130
      L1240 150
      L1290 185
      L1260 215
      L1190 205
      L1130 220
      L1080 205
      L1020 220
      L965 200
      L910 185
      L860 175
      Z"/>

    <!-- Africa -->
    <path d="
      M735 220
      L800 205
      L850 225
      L865 275
      L850 330
      L820 380
      L785 420
      L750 390
      L725 340
      L705 290
      Z"/>

    <!-- Australia -->
    <path d="
      M1110 395
      L1170 375
      L1235 390
      L1280 425
      L1265 465
      L1215 480
      L1160 465
      L1120 440
      Z"/>

    <!-- Greenland -->
    <path d="
      M440 70
      L500 50
      L560 65
      L580 105
      L540 130
      L475 120
      L445 95
      Z"/>

  </g>


  <!-- ================================================= -->
  <!-- MAP DOT NETWORK -->
  <!-- ================================================= -->

  <g fill="#f6c75a" filter="url(#glow)">

    <circle cx="170" cy="175" r="3"/>
    <circle cx="235" cy="205" r="3"/>
    <circle cx="295" cy="165" r="4"/>
    <circle cx="315" cy="220" r="3"/>

    <circle cx="280" cy="360" r="3"/>
    <circle cx="300" cy="420" r="3"/>

    <circle cx="720" cy="155" r="4"/>
    <circle cx="770" cy="165" r="3"/>
    <circle cx="805" cy="145" r="3"/>

    <circle cx="900" cy="150" r="4"/>
    <circle cx="970" cy="130" r="3"/>
    <circle cx="1050" cy="145" r="4"/>
    <circle cx="1120" cy="160" r="3"/>
    <circle cx="1190" cy="180" r="4"/>

    <circle cx="760" cy="250" r="4"/>
    <circle cx="805" cy="300" r="3"/>
    <circle cx="790" cy="350" r="4"/>

    <circle cx="1160" cy="420" r="4"/>
    <circle cx="1220" cy="430" r="3"/>

  </g>


  <!-- ================================================= -->
  <!-- CONNECTION LINES -->
  <!-- ================================================= -->

  <g fill="none"
     stroke="#dca83f"
     stroke-width="1"
     opacity=".45">

    <path d="M170 175 Q450 80 720 155"/>
    <path d="M235 205 Q500 120 900 150"/>
    <path d="M295 165 Q600 100 1050 145"/>
    <path d="M720 155 Q900 90 1190 180"/>
    <path d="M760 250 Q1000 150 1190 180"/>
    <path d="M805 300 Q1000 220 1160 420"/>
    <path d="M315 220 Q600 260 760 250"/>

  </g>


  <!-- ================================================= -->
  <!-- GLOWING GLOBAL POINTS -->
  <!-- ================================================= -->

  <g fill="#ffd35c" filter="url(#glow)">

    <circle cx="170" cy="175" r="5"/>
    <circle cx="295" cy="165" r="6"/>
    <circle cx="720" cy="155" r="6"/>
    <circle cx="900" cy="150" r="6"/>
    <circle cx="1050" cy="145" r="6"/>
    <circle cx="1190" cy="180" r="5"/>
    <circle cx="790" cy="350" r="5"/>
    <circle cx="1160" cy="420" r="5"/>

  </g>


  <!-- ================================================= -->
  <!-- CANDLESTICK CHART -->
  <!-- ================================================= -->

  <g stroke="#e4ae3f"
     stroke-width="2">

    <!-- candle 1 -->
    <line x1="930" y1="450" x2="930" y2="525"/>
    <rect x="921" y="475"
          width="18"
          height="35"
          fill="url(#candle)"
          stroke="#f3c65c"/>

    <!-- candle 2 -->
    <line x1="975" y1="425" x2="975" y2="500"/>
    <rect x="966" y="445"
          width="18"
          height="38"
          fill="url(#candle)"/>

    <!-- candle 3 -->
    <line x1="1020" y1="440" x2="1020" y2="510"/>
    <rect x="1011" y="455"
          width="18"
          height="35"
          fill="#173b5d"
          stroke="#8ca5bd"/>

    <!-- candle 4 -->
    <line x1="1065" y1="390" x2="1065" y2="475"/>
    <rect x="1056" y="410"
          width="18"
          height="45"
          fill="url(#candle)"/>

    <!-- candle 5 -->
    <line x1="1110" y1="365" x2="1110" y2="455"/>
    <rect x="1101" y="380"
          width="18"
          height="50"
          fill="url(#candle)"/>

    <!-- candle 6 -->
    <line x1="1155" y1="385" x2="1155" y2="445"/>
    <rect x="1146" y="400"
          width="18"
          height="30"
          fill="#173b5d"
          stroke="#8ca5bd"/>

    <!-- candle 7 -->
    <line x1="1200" y1="330" x2="1200" y2="425"/>
    <rect x="1191" y="350"
          width="18"
          height="55"
          fill="url(#candle)"/>

    <!-- candle 8 -->
    <line x1="1245" y1="300" x2="1245" y2="400"/>
    <rect x="1236" y="320"
          width="18"
          height="58"
          fill="url(#candle)"/>

    <!-- candle 9 -->
    <line x1="1290" y1="325" x2="1290" y2="385"/>
    <rect x="1281" y="335"
          width="18"
          height="32"
          fill="#173b5d"
          stroke="#8ca5bd"/>

    <!-- candle 10 -->
    <line x1="1335" y1="260" x2="1335" y2="370"/>
    <rect x="1326" y="275"
          width="18"
          height="65"
          fill="url(#candle)"/>

    <!-- candle 11 -->
    <line x1="1380" y1="225" x2="1380" y2="335"/>
    <rect x="1371" y="240"
          width="18"
          height="65"
          fill="url(#candle)"/>

    <!-- candle 12 -->
    <line x1="1425" y1="205" x2="1425" y2="300"/>
    <rect x="1416" y="215"
          width="18"
          height="55"
          fill="url(#candle)"/>

    <!-- candle 13 -->
    <line x1="1470" y1="165" x2="1470" y2="270"/>
    <rect x="1461" y="180"
          width="18"
          height="65"
          fill="url(#candle)"/>

    <!-- candle 14 -->
    <line x1="1515" y1="125" x2="1515" y2="230"/>
    <rect x="1506" y="140"
          width="18"
          height="65"
          fill="url(#candle)"/>

  </g>


  <!-- ================================================= -->
  <!-- RISING TREND LINE -->
  <!-- ================================================= -->

  <path d="
    M900 515
    C980 500 1010 470 1060 455
    S1130 410 1170 420
    S1240 350 1280 365
    S1350 300 1390 310
    S1450 230 1510 185
    S1560 130 1590 105"

    fill="none"
    stroke="url(#gold)"
    stroke-width="4"
    filter="url(#glow)"/>


  <!-- ================================================= -->
  <!-- VOLUME BARS -->
  <!-- ================================================= -->

  <g fill="#123454" opacity=".75">

    <rect x="880" y="570" width="25" height="35"/>
    <rect x="920" y="545" width="25" height="60"/>
    <rect x="960" y="560" width="25" height="45"/>
    <rect x="1000" y="525" width="25" height="80"/>
    <rect x="1040" y="550" width="25" height="55"/>
    <rect x="1080" y="510" width="25" height="95"/>
    <rect x="1120" y="535" width="25" height="70"/>
    <rect x="1160" y="500" width="25" height="105"/>
    <rect x="1200" y="480" width="25" height="125"/>
    <rect x="1240" y="465" width="25" height="140"/>
    <rect x="1280" y="440" width="25" height="165"/>
    <rect x="1320" y="420" width="25" height="185"/>
    <rect x="1360" y="400" width="25" height="205"/>
    <rect x="1400" y="380" width="25" height="225"/>
    <rect x="1440" y="350" width="25" height="255"/>
    <rect x="1480" y="320" width="25" height="285"/>
    <rect x="1520" y="290" width="25" height="315"/>
  </g>


  <!-- ================================================= -->
  <!-- BOTTOM GOLDEN WAVE -->
  <!-- ================================================= -->

  <path d="
    M0 590
    C180 540 300 625 470 580
    S750 530 900 595
    S1180 625 1350 570
    S1500 540 1600 565"

    fill="none"
    stroke="#b98228"
    stroke-width="3"
    opacity=".65"/>

  <path d="
    M0 610
    C180 560 300 640 470 600
    S750 555 900 615
    S1180 645 1350 595
    S1500 565 1600 585"

    fill="none"
    stroke="#31506d"
    stroke-width="2"
    opacity=".6"/>


  <!-- ================================================= -->
  <!-- DARK OVERLAY FOR TEXT / UI -->
  <!-- ================================================= -->

  <rect x="0"
        y="0"
        width="1600"
        height="650"
        fill="url(#bg)"
        opacity=".12"/>

</svg>

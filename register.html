<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CPTMarkets - Register</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="background"></div>

<div class="login-container">

<div class="login-card">

<div class="logo-area">

<h1>
<span class="gold">Create</span>
<span class="white"> Account</span>
</h1>

<p>Join CptMarkets for global trading</p>

</div>

<form id="registerForm">

<div class="form-group">

<label>Username</label>

<div class="input-box">

<input
type="text"
id="username"
placeholder="Username"
required>

</div>

</div>

<div class="form-group">

<label>Password</label>

<div class="input-box">

<input
type="password"
id="password"
placeholder="Password (min. 6 chars)"
required>

</div>

</div>

<div class="form-group">

<label>Confirm Password</label>

<div class="input-box">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

</div>

<div class="form-group">

<label>Invite Code</label>

<div class="input-box">

<input
type="text"
id="invite"
placeholder="Invite Code (optional)">

</div>

</div>

<button
type="submit"
class="login-btn">

Register

</button>

</form>

<div class="bottom-links">

<span>
Already have an account?
</span>

<a href="index.html">
Go to Sign In
</a>

</div>

</div>

</div>


<script type="module">

import { auth, db }
from "./firebase/firebase-config.js";

import {
    createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    doc,
    setDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const registerForm =
    document.getElementById("registerForm");


registerForm.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        const username =
            document
            .getElementById("username")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        const invite =
            document
            .getElementById("invite")
            .value
            .trim();


        if (!username) {

            alert("Please enter a username.");

            return;
        }


        if (password.length < 6) {

            alert(
                "Password must be at least 6 characters."
            );

            return;
        }


        if (password !== confirmPassword) {

            alert(
                "Passwords do not match!"
            );

            return;
        }


        try {

            /*
             * Firebase Authentication needs
             * an email address.
             *
             * We create an internal email
             * from the username.
             */

            const email =
                username.toLowerCase()
                + "@cptmarkets.local";


            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            /*
             * Save user information
             * in Firestore.
             */

            await setDoc(
                doc(db, "users", user.uid),
                {

                    uid: user.uid,

                    username: username,

                    email: email,

                    inviteCode: invite,

                    balance: 0,

                    createdAt:
                        new Date()

                }
            );


            /*
             * Keep a small local session
             * temporarily for the existing
             * dashboard system.
             */

            localStorage.setItem(
                "currentUser",
                JSON.stringify({

                    uid: user.uid,

                    username: username,

                    email: email,

                    balance: 0

                })
            );


            alert(
                "Registration Successful!"
            );


            window.location.href =
                "index.html";


        } catch (error) {

            console.error(
                "Registration failed:",
                error
            );


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                alert(
                    "This username is already registered."
                );

            } else {

                alert(
                    "Registration failed: "
                    + error.message
                );

            }

        }

    }
);

</script>

</body>

</html>

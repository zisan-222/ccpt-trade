<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CptMarkets - Create Account</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: radial-gradient(circle at top, #0f1c2e, #050b14); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; padding: 20px; text-align: center; }
        h1 { color: #ff9900; font-size: 32px; margin-bottom: 5px; }
        p { color: #6d7f95; font-size: 14px; margin-bottom: 30px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; color: #869bb5; font-size: 14px; margin-bottom: 8px; }
        input { width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: #ff9900; }
        .register-btn { width: 100%; padding: 15px; background: #ff9900; border: none; border-radius: 30px; color: #000; font-weight: bold; font-size: 18px; margin-top: 15px; cursor: pointer; transition: 0.2s; }
        .register-btn:hover { background: #e08800; }
        .footer-links { display: flex; justify-content: space-between; margin-top: 25px; font-size: 14px; }
        .footer-links span { color: #869bb5; }
        .footer-links a { color: #ff9900; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Create Account</h1>
    <p>Join CptMarkets for global trading</p>

    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="input-group">
            <label>Username</label>
            <input type="text" placeholder="Username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="••••••••" required>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" placeholder="••••••••" required>
        </div>

        <div class="input-group">
            <label>Invite Code</label>
            <input type="text" placeholder="Invite Code (optional)">
        </div>

        <button type="submit" class="register-btn">Register</button>
    </form>

    <div class="footer-links">
        <span>Already have an account?</span>
        <a href="#">Go to Sign In</a>
    </div>
</div>

</body>
</html>

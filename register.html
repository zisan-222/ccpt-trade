<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CPTMarkets - Register</title>

<link rel="stylesheet" href="register-premium.css">

<!-- ==========================================
     PROFESSIONAL POPUP CSS
========================================== -->

<link rel="stylesheet" href="popup.css">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

</head>


<body>

<div class="background"></div>


<div class="login-container">

<div class="login-card">

<!-- LANGUAGE BUTTON -->
<button class="language-btn" type="button">🇬🇧</button>

<!-- ==========================================
     3D MULTI-COLOR LOGO & TITLE
========================================== -->

<div class="logo-area">

<div class="brand-logo">
    <div class="logo-circle">
        <span class="logo-arrow">↗</span>
        <span class="logo-cpt">CPT</span>
        <span class="logo-markets">MARKETS</span>
        <span class="logo-uk">UK</span>
    </div>
</div>

<h1>
<span class="gold">Create</span>
<span class="white"> Account</span>
</h1>

<p>
Join CptMarkets for global trading
</p>

</div>


<!-- ==========================================
     REGISTER FORM
========================================== -->

<form id="registerForm">


<!-- USERNAME -->

<div class="form-group">

<label>
Username
</label>

<div class="input-box">

<i class="fa-regular fa-user input-icon"></i>

<input
    type="text"
    id="username"
    placeholder="Enter Username"
    autocomplete="username"
    required
>

</div>

</div>


<!-- PASSWORD -->

<div class="form-group">

<label>
Password
</label>

<div class="input-box">

<i class="fa-solid fa-lock input-icon"></i>

<input
    type="password"
    id="password"
    placeholder="Password (min. 6 chars)"
    autocomplete="new-password"
    required
>

<i class="fa-regular fa-eye password-toggle"></i>

</div>

</div>


<!-- CONFIRM PASSWORD -->

<div class="form-group">

<label>
Confirm Password
</label>

<div class="input-box">

<i class="fa-solid fa-lock input-icon"></i>

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm Password"
    autocomplete="new-password"
    required
>

<i class="fa-regular fa-eye password-toggle"></i>

</div>

</div>


<!-- INVITE -->

<div class="form-group">

<label>
Invite Code
</label>

<div class="input-box">

<i class="fa-solid fa-ticket input-icon"></i>

<input
    type="text"
    id="invite"
    placeholder="Invite Code (optional)"
>

</div>

</div>


<!-- REGISTER BUTTON -->

<button
    type="submit"
    class="login-btn"
    id="registerBtn"
>

Register

</button>


</form>


<!-- ==========================================
     LOGIN LINK (PROFESSIONAL 3D)
========================================== -->
<div class="bottom-links">
    <span class="has-question">
        <i class="fa-regular fa-circle-question"></i> Already have an account?
    </span>
    <a href="index.html" class="sign-in-btn">
        Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i>
    </a>
</div>




<!-- ==========================================
     PROFESSIONAL POPUP SYSTEM
========================================== -->

<script src="popup.js"></script>



<!-- ==========================================
     FIREBASE REGISTRATION
========================================== -->

<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import {
    auth,
    db
}
from "./firebase/firebase-config.js";


import {
    createUserWithEmailAndPassword,
    deleteUser
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    setDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* ==========================================
   FORM
========================================== */

const registerForm =
    document.getElementById(
        "registerForm"
    );


const registerButton =
    document.getElementById(
        "registerBtn"
    );



/* ==========================================
   REGISTER
========================================== */

registerForm.addEventListener(
    "submit",
    async function (e) {

        e.preventDefault();


        /* ======================================
           GET INPUT
        ====================================== */

        const usernameInput =
            document.getElementById(
                "username"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );


        const inviteInput =
            document.getElementById(
                "invite"
            );


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;


        const invite =
            inviteInput.value.trim();



        /* ======================================
           VALIDATION
        ====================================== */

        if (!username) {

            showCPTPopup(
                "error",
                "Username Required",
                "Please enter a username to create your account.",
                null,
                "Try Again"
            );

            usernameInput.focus();

            return;

        }


        /*
         * Username rules
         *
         * Letters
         * Numbers
         * Underscore
         * 3-20 characters
         */

        const usernamePattern =
            /^[a-zA-Z0-9_]{3,20}$/;


        if (
            !usernamePattern.test(
                username
            )
        ) {

            showCPTPopup(
                "error",
                "Invalid Username",
                "Username must be 3-20 characters and can contain only letters, numbers, and underscore.",
                null,
                "Try Again"
            );

            usernameInput.focus();

            return;

        }


        if (
            password.length < 6
        ) {

            showCPTPopup(
                "error",
                "Weak Password",
                "Password must be at least 6 characters.",
                null,
                "Try Again"
            );

            passwordInput.focus();

            return;

        }


        if (
            password !==
            confirmPassword
        ) {

            showCPTPopup(
                "error",
                "Password Mismatch",
                "Passwords do not match. Please enter the same password in both fields.",
                null,
                "Try Again"
            );

            confirmPasswordInput.focus();

            return;

        }



        /* ======================================
           DISABLE BUTTON
        ====================================== */

        registerButton.disabled =
            true;


        registerButton.textContent =
            "Creating Account...";



        /* ======================================
           NORMALIZE USERNAME
        ====================================== */

        const normalizedUsername =
            username.toLowerCase();


        /*
         * Firebase Authentication
         * requires an email.
         *
         * We keep the existing system
         * compatible with script.js.
         */

        const email =
            normalizedUsername +
            "@cptmarkets.local";



        let createdFirebaseUser =
            null;



        try {


            /* ==================================
               CREATE FIREBASE AUTH ACCOUNT
            ================================== */

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            createdFirebaseUser =
                userCredential.user;


            const uid =
                createdFirebaseUser.uid;



            /* ==================================
               CREATE 8 DIGIT USER ID
            ================================== */

            const userId =
                String(
                    Math.floor(
                        10000000 +
                        Math.random() *
                        90000000
                    )
                );



            /* ==================================
               USER DATA
            ================================== */

            const userData = {

                uid:
                    uid,

                userId:
                    userId,

                username:
                    username,

                usernameLower:
                    normalizedUsername,

                email:
                    email,

                inviteCode:
                    invite,

                balance:
                    0,

                createdAt:
                    new Date()

            };



            /* ==================================
               SAVE FIRESTORE USER
            ================================== */

            await setDoc(

                doc(
                    db,
                    "users",
                    uid
                ),

                userData

            );



            /* ==================================
               LOCAL SESSION
            ================================== */

            localStorage.setItem(

                "currentUser",

                JSON.stringify({

                    uid:
                        uid,

                    userId:
                        userId,

                    username:
                        username,

                    email:
                        email,

                    balance:
                        0

                })

            );



            /* ==================================
               PROFESSIONAL SUCCESS POPUP
            ================================== */

            showCPTPopup(
                "success",
                "Account Created!",
                "Your account has been created successfully.",
                userId,
                "Continue",
                function () {

                    window.location.href =
                        "dashboard.html";

                }
            );


        } catch (error) {


            console.error(
                "Registration failed:",
                error
            );



            /* ==================================
               IMPORTANT ROLLBACK
            ================================== */

            if (
                createdFirebaseUser
            ) {

                try {

                    await deleteUser(
                        createdFirebaseUser
                    );

                    console.log(
                        "Incomplete Firebase account removed."
                    );

                } catch (deleteError) {

                    console.error(
                        "Rollback failed:",
                        deleteError
                    );

                }

            }



            /* ==================================
               ERROR POPUP
            ================================== */

            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                showCPTPopup(
                    "error",
                    "Username Already Exists",
                    "This username is already registered. Please choose another username.",
                    null,
                    "Try Again"
                );

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                showCPTPopup(
                    "error",
                    "Invalid Username",
                    "The username format is invalid. Please enter a valid username.",
                    null,
                    "Try Again"
                );

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                showCPTPopup(
                    "error",
                    "Weak Password",
                    "Password is too weak. Please use at least 6 characters.",
                    null,
                    "Try Again"
                );

            }

            else if (
                error.code ===
                "permission-denied" ||
                error.code ===
                "firestore/permission-denied"
            ) {

                showCPTPopup(
                    "error",
                    "Registration Failed",
                    "Account could not be saved because Firestore permission was denied.",
                    null,
                    "Try Again"
                );

            }

            else {

                showCPTPopup(
                    "error",
                    "Registration Failed",
                    error.message ||
                    "Unknown error",
                    null,
                    "Try Again"
                );

            }


        } finally {


            /* ==================================
               ENABLE BUTTON
            ================================== */

            registerButton.disabled =
                false;


            registerButton.textContent =
                "Register";


        }

    }
);


</script>


<!-- ==========================================
     PASSWORD TOGGLE
========================================== -->

<script src="password-toggle.js"></script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CptMarkets - Create Account</title>
    <!-- Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-[#031129] text-white flex justify-center items-center min-h-screen font-sans">

    <div class="w-full max-w-md p-6 bg-[#05193e] rounded-2xl shadow-xl border border-blue-900 mx-4">
        <!-- ২য় ছবির মতো হেডার ডিজাইন -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-amber-400">Create Account</h1>
            <p class="text-xs text-gray-400 mt-1">Join CptMarkets for global trading</p>
        </div>

        <!-- ইনপুট ফিল্ডসমূহ -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1 ml-1">Username</label>
                <input type="text" id="regUser" placeholder="Username" class="w-full px-4 py-3 bg-[#031129] border border-blue-900 rounded-xl focus:outline-none focus:border-amber-400 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1 ml-1">Password</label>
                <input type="password" id="regPass" placeholder="Password (min. 6 chars)" class="w-full px-4 py-3 bg-[#031129] border border-blue-900 rounded-xl focus:outline-none focus:border-amber-400 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1 ml-1">Confirm Password</label>
                <input type="password" id="regConfirm" placeholder="Confirm Password" class="w-full px-4 py-3 bg-[#031129] border border-blue-900 rounded-xl focus:outline-none focus:border-amber-400 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1 ml-1">Invite Code</label>
                <input type="text" id="inviteCode" placeholder="Invite Code (optional)" class="w-full px-4 py-3 bg-[#031129] border border-blue-900 rounded-xl focus:outline-none focus:border-amber-400 text-sm">
            </div>

            <!-- গোল্ডেন উজ্জ্বল রেজিস্টার বাটন -->
            <button onclick="handleRegister()" class="w-full py-3.5 bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 text-[#031129] font-bold text-sm rounded-xl shadow-lg hover:brightness-110 active:scale-[0.99] transition duration-200">
                Register
            </button>
        </div>

        <!-- নিচে লগইন পেজে ফিরে যাওয়ার লিংক -->
        <div class="mt-6 text-center text-xs font-medium">
            <span class="text-gray-400">Already have an account?</span>
            <a href="index.html" class="text-amber-400 ml-1 hover:underline">Go to Sign In</a>
        </div>
    </div>

    <!-- অ্যাকাউন্ট জেনারেশন ও ইউনিক UID তৈরি করার লজিক -->
    <script>
        function handleRegister() {
            var u = document.getElementById('regUser').value.trim();
            var p = document.getElementById('regPass').value.trim();
            var c = document.getElementById('regConfirm').value.trim();

            if(!u || !p || !c) { alert("সবগুলো তথ্য সঠিকভাবে পূরণ করুন!"); return; }
            if(p.length < 6) { alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!"); return; }
            if(p !== c) { alert("পাসওয়ার্ড দুটি মেলেনি!"); return; }

            var users = JSON.parse(localStorage.getItem('users')) || [];
            
            // ইউজারনেম আগে থেকে আছে কিনা চেক করা
            var exists = users.some(function(user) { return user.username === u; });
            if(exists) { alert("এই ইউজারনেমটি ইতিমধ্যে ব্যবহার করা হয়েছে!"); return; }

            // অটোমেটিক ৬ ডিজিটের ইউনিক ইউজার আইডি (UID) তৈরি করার লজিক
            var uid = Math.floor(100000 + Math.random() * 900000).toString();

            // নতুন ইউজারের প্রোফাইল ডাটাবেজ (লোকাল স্টোরেজ)-এ সেভ করা
            var newUser = { uid: uid, username: u, password: p, balance: 0.00 };
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));

            alert("রেজিস্ট্রেশন সফল হয়েছে!\nআপনার ইউনিক UID হলো: " + uid);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

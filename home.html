<!DOCTYPE html>

<header class="header">

<section class="banner">

</button>

<i class="fa-solid fa-users"></i>

<p>Copy Trade</p>

</div>

        <button class="btn deposit">Deposit</button>

    <!-- Menu Grid -->
    <div class="menu-grid">

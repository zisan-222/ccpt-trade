<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CPTMarkets Dashboard</title>

<link rel="stylesheet" href="home.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="dashboard">

<!-- Banner -->

<div class="banner">

<h1>Cpt<span>Markets</span></h1>

<p>Global integrated financial trading platform</p>

</div>

<!-- Assets Card -->

<div class="asset-card">

<div class="asset-top">

<h3>Total Assets (USD)</h3>

<i class="fa-regular fa-eye"></i>

</div>

<h2>$0.00</h2>

<p>

Floating P/L

<span class="green">+0.00</span>

&nbsp;&nbsp;

Equity

<b>$0.00</b>

</p>

<div class="action-buttons">

<button class="deposit">Deposit</button>

<button>Withdraw</button>

<button>Transfer</button>

</div>

</div>

<!-- Menu -->

<div class="menu-grid">

<div class="menu-item">

<i class="fa-solid fa-headset"></i>

<span>Support</span>

</div>

<div class="menu-item">

<i class="fa-solid fa-wallet"></i>

<span>Withdraw</span>

</div>

<div class="menu-item">

<i class="fa-solid fa-right-left"></i>

<span>Transfer</span>

</div>

<div class="menu-item">

<i class="fa-solid fa-users"></i>

<span>Copy Trade</span>

</div>

<div class="menu-item">

<i class="fa-regular fa-credit-card"></i>

<span>Loan</span>

</div>

<div class="menu-item">

<i class="fa-solid fa-chart-column"></i>

<span>Wealth</span>

</div>

<div class="menu-item">

<i class="fa-solid fa-pickaxe"></i>

<span>Mining</span>

</div>

<div class="menu-item">

<i class="fa-solid fa-gift"></i>

<span>Invite</span>

</div>

</div>
<!-- Hot Markets -->

<div class="hot-market">

<div class="title">

<h3>Hot Markets</h3>

<a href="#">View All ></a>

</div>

<div class="market-list">

<div class="market-item">

<span>BTC/USDT</span>

<strong>$118,250.45</strong>

</div>

<div class="market-item">

<span>ETH/USDT</span>

<strong>$4,215.18</strong>

</div>

<div class="market-item">

<span>XAU/USD</span>

<strong>$3,412.80</strong>

</div>

</div>

</div>

<!-- Bottom Navigation -->

<div class="bottom-nav">

<a href="#" class="active">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>

<a href="#">

<i class="fa-solid fa-chart-line"></i>

<span>Markets</span>

</a>

<a href="#" class="trade">

<i class="fa-solid fa-arrow-right-arrow-left"></i>

</a>

<a href="#">

<i class="fa-solid fa-wallet"></i>

<span>Assets</span>

</a>

<a href="#">

<i class="fa-regular fa-user"></i>

<span>Mine</span>

</a>

</div>

</div>

<script src="home.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CptMarkets - Users</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<header class="admin-header">

    <div class="admin-brand">

        <div class="admin-icon">
            CM
        </div>

        <div>
            <h1>CptMarkets</h1>
            <span>Administrator Panel</span>
        </div>

    </div>

    <button
        id="adminLogout"
        class="logout-btn">
        Logout
    </button>

</header>


<main class="admin-container">

    <section class="welcome-section">

        <h2>User Management</h2>

        <p>
            Manage registered demo users.
        </p>

    </section>


    <!-- SEARCH -->

    <section class="user-search">

        <input
            type="text"
            id="userUidInput"
            placeholder="Enter Firebase User UID">

        <button
            id="searchUserBtn"
            class="login-btn">
            Search User
        </button>

    </section>


    <!-- RESULT -->

    <section
        id="userResult"
        class="user-result"
        style="display:none;">

        <div class="user-card">

            <h3 id="userName">
                User
            </h3>

            <p>
                UID:
                <span id="userUid"></span>
            </p>

            <p>
                Email:
                <span id="userEmail"></span>
            </p>

            <div class="balance-box">

                <span>
                    Demo Balance
                </span>

                <strong id="userBalance">
                    $0.00
                </strong>

            </div>


            <!-- BALANCE CONTROL -->

            <h3>
                Balance Control
            </h3>

            <input
                type="number"
                id="balanceAmount"
                placeholder="Amount"
                min="0"
                step="0.01">


            <div class="balance-buttons">

                <button
                    id="addBalanceBtn">
                    + Add Balance
                </button>

                <button
                    id="removeBalanceBtn">
                    − Remove Balance
                </button>

            </div>


            <p
                id="actionMessage"
                class="action-message">
            </p>

        </div>

    </section>


    <section
        id="notFound"
        class="user-card"
        style="display:none;">

        <h3>
            User not found
        </h3>

        <p>
            No registered user was found
            with this UID.
        </p>

    </section>

</main>


<script
    type="module"
    src="admin-users.js">
</script>

</body>

</html>

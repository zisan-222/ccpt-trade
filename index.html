<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#020710"
    >

    <title>CPTMarkets - Login</title>

    <!-- =====================================================
         MAIN WEBSITE STYLE
         ===================================================== -->
    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- =====================================================
         PROFESSIONAL LOGIN STYLE
         ===================================================== -->
    <link
        rel="stylesheet"
        href="index-professional.css"
    >

    <!-- =====================================================
         POPUP STYLE
         ===================================================== -->
    <link
        rel="stylesheet"
        href="popup.css"
    >

    <!-- =====================================================
         FONT AWESOME
         ===================================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>


<body>

    <!-- =====================================================
         PAGE
         ===================================================== -->

    <main class="login-page">

        <!-- =================================================
             LOGIN CARD
             ================================================= -->

        <section class="login-card">

            <!-- =================================================
                 LANGUAGE BUTTON
                 ================================================= -->

            <button
                class="language-btn"
                type="button"
                aria-label="Language"
                title="Language"
            >
                🇬🇧
            </button>


            <!-- =================================================
                 BACKGROUND MARKET GRAPHIC
                 ================================================= -->

            <div
                class="market-background"
                aria-hidden="true"
            >

                <div class="market-lines line-1"></div>

                <div class="market-lines line-2"></div>

                <div class="market-lines line-3"></div>


                <div class="market-bars">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="market-dots"></div>

                <div class="circle-glow"></div>

            </div>


            <!-- =================================================
                 BRAND / LOGO
                 ================================================= -->

            <header class="brand-area">

                <div class="brand-logo">

                    <div class="logo-ring">

                        <span>CPT</span>

                        <i
                            class="fa-solid fa-arrow-up-right"
                            aria-hidden="true"
                        ></i>

                    </div>


                    <div class="logo-markets">
                        MARKETS
                    </div>


                    <div class="logo-uk">
                        UK
                    </div>

                </div>


                <h1>
                    CptMarkets
                </h1>


                <div class="gift-title">

                    <span></span>

                    <strong>GIFT</strong>

                    <span></span>

                </div>

            </header>


            <!-- =================================================
                 LOGIN FORM
                 ================================================= -->

            <form
                id="loginForm"
                class="login-form"
                novalidate
            >

                <!-- =============================================
                     USERNAME
                     ============================================= -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>


                    <div class="input-box">

                        <div
                            class="input-icon"
                            aria-hidden="true"
                        >

                            <i class="fa-regular fa-user"></i>

                        </div>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Username"
                            autocomplete="username"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                        >

                    </div>

                </div>


                <!-- =============================================
                     PASSWORD
                     ============================================= -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="input-box">

                        <div
                            class="input-icon"
                            aria-hidden="true"
                        >

                            <i class="fa-solid fa-lock"></i>

                        </div>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                            title="Show password"
                        >

                            <i
                                class="fa-regular fa-eye"
                                aria-hidden="true"
                            ></i>

                        </button>

                    </div>

                </div>


                <!-- =============================================
                     SIGN IN BUTTON
                     ============================================= -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Go to Sign In
                </button>


                <!-- =============================================
                     ACCOUNT LINKS
                     ============================================= -->

                <nav
                    class="login-links"
                    aria-label="Account options"
                >

                    <a
                        href="register.html"
                        class="login-link"
                    >

                        <i
                            class="fa-solid fa-user-plus"
                            aria-hidden="true"
                        ></i>

                        <span>
                            Create Account
                        </span>

                    </a>


                    <a
                        href="#"
                        id="forgotPassword"
                        class="login-link"
                    >

                        <i
                            class="fa-solid fa-lock"
                            aria-hidden="true"
                        ></i>

                        <span>
                            Forgot Password?
                        </span>

                    </a>

                </nav>

            </form>


            <!-- =================================================
                 BOTTOM MARKET GRAPHIC
                 ================================================= -->

            <div
                class="bottom-market"
                aria-hidden="true"
            >

                <div class="bottom-line"></div>


                <div class="bottom-bars">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         POPUP JAVASCRIPT
         ===================================================== -->

    <script src="popup.js"></script>


    <!-- =====================================================
         LOGIN / FIREBASE JAVASCRIPT
         ===================================================== -->

    <script
        type="module"
        src="script.js"
    ></script>

</body>
</html>

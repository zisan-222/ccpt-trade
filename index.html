<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CptMarkets - Login</title>
    <!-- Icons and Fonts Library -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background: radial-gradient(circle, #0c1a30, #050b14); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { width: 340px; background: rgba(13, 27, 50, 0.85); padding: 30px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); text-align: center; border: 1px solid #1a3154; position: relative;}
        .logo-area { margin-bottom: 25px; }
        .logo { font-size: 28px; font-weight: bold; color: #f39c12; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .sub-logo { font-size: 12px; color: #8a99ad; letter-spacing: 3px; margin-top: 5px; text-transform: uppercase; }
        
        .input-group { text-align: left; margin-top: 15px; position: relative; }
        label { display: block; font-size: 14px; color: #a0aec0; margin-bottom: 5px; font-weight: 500; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 12px; color: #52647c; font-size: 16px; }
        input { width: 100%; padding: 12px 12px 12px 40px; background: #091324; border: 1px solid #1d2d44; border-radius: 8px; color: white; box-sizing: border-box; font-size: 15px; transition: 0.3s; }
        input:focus { border-color: #f39c12; outline: none; box-shadow: 0 0 5px rgba(243,156,18,0.2); }
        
        .btn-gold { width: 100%; padding: 14px; background: linear-gradient(90deg, #f1c40f, #f39c12); border: none; border-radius: 25px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 25px; box-shadow: 0 4px 15px rgba(243,156,18,0.3); transition: 0.2s; }
        .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(243,156,18,0.4); }
        
        .action-links { display: flex; justify-content: space-between; margin-top: 20px; font-size: 13px; }
        .action-links a { color: #f1c40f; text-decoration: none; display: flex; align-items: center; gap: 5px; }
        .action-links a:hover { text-decoration: underline; }
        
        /* Language Dropdown Top Bar Bar */
        .lang-bar { position: absolute; top: 15px; right: 15px; z-index: 999; }
        .goog-te-gadget-simple { background-color: rgba(13, 27, 50, 0.5) !important; border: 1px solid #1d2d44 !important; border-radius: 4px !important; padding: 3px 6px !important; }
        .goog-te-gadget-simple span { color: #f1c40f !important; }
    </style>
</head>
<body>

<div class="login-box">
    <!-- Language Selector Dropdown (Google Translator) -->
    <div class="lang-bar" id="google_translate_element"></div>

    <div class="logo-area">
        <div class="logo"><i class="fa-solid fa-shield-halved"></i> CptMarkets</div>
        <div class="sub-logo">GIFTP</div>
    </div>
    
    <div class="input-group">
        <label>Username</label>
        <div class="input-wrapper">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="Username" autocomplete="off">
        </div>
    </div>
    
    <div class="input-group">
        <label>Password</label>
        <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Password">
        </div>
    </div>
    
    <button class="btn-gold" onclick="handleLogin()">Go to Sign In</button>
    
    <div class="action-links">
        <!-- এটি আপনাকে সরাসরি কোনো এরর ছাড়াই register.html পেজে নিয়ে যাবে -->
        <a href="register.html"><i class="fa-solid fa-user-plus"></i> Create Account</a>
        <a href="#"><i class="fa-solid fa-key"></i> Forgot Password?</a>
    </div>
</div>

<script>
    // ⚠️ নিচে আপনার কপি করা Firebase Realtime Database লিঙ্কটি অবশ্যই বসাবেন ⚠️
    const FIREBASE_URL = "http://ccpt-trade.vercel.app;

    function handleLogin() {
        const user = document.getElementById("username").value.trim().toLowerCase();
        const pass = document.getElementById("password").value;

        if(user === "" || pass === "") {
            alert("Please enter both Username and Password!");
            return;
        }
        
        // ক্লাউড ডাটাবেজ থেকে তথ্য ভ্যালিডেশন
        fetch(`${FIREBASE_URL}/users/${user}.json`)
        .then(response => response.json())
        .then(data => {
            if(data !== null && data.password === btoa(pass)) {
                localStorage.setItem("current_logged_user", user);
                localStorage.setItem("is_logged", "true");
                window.location.href = "dashboard.html";
            } else {
                alert("Invalid Username or Password!");
            }
        })
        .catch(err => {
            console.error(err);
            alert("Database connection error! Check your Firebase Link.");
        });
    }
</script>

<!-- Google Language Script for Multi-language Support -->
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,bn,ar,hi,es,zh-CN'}, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//://google.com"></script>

</body>
</html>

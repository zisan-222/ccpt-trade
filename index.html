<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>CPTMarkets - Login</title>

    <!-- Website CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index-professional.css">
    <link rel="stylesheet" href="popup.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <!-- Language -->
        <button class="language-btn" type="button" aria-label="Language">
            🇬🇧
        </button>

        <!-- Background Design -->
        <div class="market-background">

            <div class="market-lines line-1"></div>
            <div class="market-lines line-2"></div>
            <div class="market-lines line-3"></div>

            <div class="market-bars">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
            </div>

            <div class="market-dots"></div>
            <div class="circle-glow"></div>

        </div>

        <!-- Logo -->
        <div class="brand-area">

            <div class="brand-logo">

                <div class="logo-ring">
                    <span>CPT</span>
                    <i class="fa-solid fa-arrow-up-right"></i>
                </div>

                <div class="logo-markets">MARKETS</div>
                <div class="logo-uk">UK</div>

            </div>

            <h1>CptMarkets</h1>

            <div class="gift-title">
                <span></span>
                GIFT
                <span></span>
            </div>

        </div>

        <!-- Login Form -->
        <form id="loginForm" class="login-form">

            <div class="form-group">

                <label for="username">Username</label>

                <div class="input-box">

                    <div class="input-icon">
                        <i class="fa-regular fa-user"></i>
                    </div>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username"
                        autocomplete="username"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label for="password">Password</label>

                <div class="input-box">

                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required>

                    <i class="fa-regular fa-eye
                              password-toggle"
                       id="togglePassword"
                       role="button"
                       tabindex="0"></i>

                </div>

            </div>


            <button type="submit"
                    class="login-btn">

                Go to Sign In

            </button>


            <div class="login-links">

                <a href="register.html"
                   class="login-link">

                    <i class="fa-solid fa-user-plus"></i>

                    Create Account

                </a>


                <a href="#"
                   id="forgotPassword"
                   class="login-link">

                    <i class="fa-solid fa-lock"></i>

                    Forgot Password?

                </a>

            </div>

        </form>


        <!-- Bottom Design -->

        <div class="bottom-market">

            <div class="bottom-line"></div>

            <div class="bottom-bars">

                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span>

            </div>

        </div>

    </div>

</div>

<!-- Existing JS (unchanged) -->
<script src="popup.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>

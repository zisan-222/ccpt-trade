<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CptMarkets - Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: radial-gradient(circle at top, #0f1c2e, #050b14); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; padding: 30px 20px; background: rgba(11, 25, 44, 0.6); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #ff9900; font-size: 32px; margin-bottom: 5px; }
        p { color: #6d7f95; font-size: 12px; margin-bottom: 30px; letter-spacing: 2px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; color: #869bb5; font-size: 14px; margin-bottom: 8px; }
        input { width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: #ff9900; }
        .login-btn { width: 100%; padding: 15px; background: linear-gradient(to right, #ffcc00, #ff9900); border: none; border-radius: 30px; color: #000; font-weight: bold; font-size: 18px; margin-top: 15px; cursor: pointer; }
        .footer-links { display: flex; justify-content: space-between; margin-top: 25px; font-size: 14px; }
        .footer-links a { color: #ff9900; text-decoration: none; }
        .footer-links a.gray { color: #869bb5; }
    </style>
</head>
<body>

<div class="container">
    <h1>CptMarkets</h1>
    <p>GIFTP</p>

    <form id="loginForm">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="login-user" placeholder="Username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="login-pass" placeholder="Password" required>
        </div>

        <button type="submit" class="login-btn">Go to Sign In</button>
    </form>

    <div class="footer-links">
        <a href="register.html">Create Account</a>
        <a href="#" class="gray">Forgot Password?</a>
    </div>
</div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let user = document.getElementById('login-user').value;
            let pass = document.getElementById('login-pass').value;

            // মেমোরি থেকে সেভ করা তথ্য তুলে আনা হচ্ছে
            let savedUser = localStorage.getItem('savedUser');
            let savedPass = localStorage.getItem('savedPass');

            // চেক করা হচ্ছে তথ্য সঠিক কি না
            if (user === savedUser && pass === savedPass) {
                window.location.href = 'dashboard.html'; // সঠিক হলে ড্যাশবোর্ডে নিয়ে যাবে
            } else {
                alert("ভুল ইউজারনেম অথবা পাসওয়ার্ড! দয়া করে সঠিক তথ্য দিন।");
            }
        });
    </script>
</body>
</html>

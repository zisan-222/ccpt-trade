<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPTMarkets - Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="background"></div>

<div class="login-box">

    <!-- Language -->
    <div class="language">
        🇬🇧
    </div>

    <!-- Logo -->
    <div class="logo-area">
        <h1>
            <span class="gold">CPT</span><span class="white">Markets</span>
        </h1>

        <p>G I F T P</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm">

        <label>Username</label>

        <div class="input-box">
            <i class="fa-regular fa-user"></i>

            <input
            type="text"
            id="username"
            placeholder="Username"
            required>
        </div>

        <label>Password</label>

        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
            type="password"
            id="password"
            placeholder="Password"
            required>

            <i
            class="fa-regular fa-eye"
            id="togglePassword"></i>

        </div>

        <button
        type="submit"
        class="login-btn">
            Go to Sign In
        </button>

    </form>

    <div class="bottom-links">

        <a href="register.html">
            <i class="fa-solid fa-user-plus"></i>
            Create Account
        </a>

        <a href="#">
            <i class="fa-solid fa-lock"></i>
            Forgot Password?
        </a>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>

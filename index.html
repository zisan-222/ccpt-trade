<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPTMarkets - Trading</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #021024 0%, #05162e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(5, 22, 46, 0.6);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Top Language Flag Container */
        .header-action {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .flag-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-image: url('https://wikimedia.org');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* Logos & Headings */
        .logo-title {
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .logo-title span {
            color: #ffc800;
        }

        .subtitle {
            font-size: 14px;
            color: #8fa0b5;
            letter-spacing: 4px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .page-title {
            font-size: 28px;
            color: #ff9900;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 13px;
            color: #7b8fa3;
            margin-bottom: 35px;
        }

        /* Form Controls */
        .form-group {
            text-align: left;
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #a4b4c7;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #566981;
            font-size: 16px;
        }

        .input-wrapper .toggle-password {
            left: auto;
            right: 15px;
            cursor: pointer;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: #091d36;
            border: 1px solid #142d4c;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-wrapper input::placeholder {
            color: #3b4e66;
        }

        .input-wrapper input:focus {
            border-color: #ffc800;
            background: #0d2544;
        }

        /* Buttons */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #ffc800;
            border: none;
            border-radius: 25px;
            color: #000000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #e6b400;
            box-shadow: 0 4px 15px rgba(255, 200, 0, 0.3);
        }

        /* Footer Links */
        .form-footer {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .form-footer a {
            color: #ffc800;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-footer a i {
            font-size: 12px;
        }

        .center-footer {
            justify-content: center;
            gap: 5px;
            color: #7b8fa3;
        }

        /* Utility Class to Toggle Views */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ================= SIGN IN INTERFACE ================= -->
        <div id="signin-view">
            <div class="header-action">
                <div class="flag-icon"></div>
            </div>
            
            <h1 class="logo-title"><span>CPT</span>Markets</h1>
            <p class="subtitle">giftp</p>

            <form onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" placeholder="Username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-pass" placeholder="Password" required>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePass('login-pass')"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Go to Sign In</button>
            </form>

            <div class="form-footer">
                <a href="#" id="go-to-register"><i class="fa-solid fa-user-plus"></i> Create Account</a>
                <a href="#"><i class="fa-solid fa-lock"></i> Forgot Password?</a>
            </div>
        </div>

        <!-- ================= REGISTER INTERFACE ================= -->
        <div id="register-view" class="hidden">
            <h2 class="page-title">Create Account</h2>
            <p class="page-subtitle">Join CptMarkets for global trading</p>

            <form onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="Username" style="padding-left: 15px;" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="********" style="padding-left: 15px;" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="********" style="padding-left: 15px;" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Invite Code</label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="Invite Code (optional)" style="padding-left: 15px;">
                    </div>
                </div>

                <button type="submit" class="btn-submit">Register</button>
            </form>

            <div class="form-footer center-footer">
                <span>Already have an account?</span>
                <a href="#" id="go-to-signin">Go to Sign In</a>
            </div>
        </div>

    </div>

    <!-- JavaScript to Handle Switching Views -->
    <script>
        const signinView = document.getElementById('signin-view');
        const registerView = document.getElementById('register-view');
        const goToRegister = document.getElementById('go-to-register');
        const goToSignin = document.getElementById('go-to-signin');

        // Switch to Register Screen
        goToRegister.addEventListener('click', (e) => {
            e.preventDefault();
            signinView.classList.add('hidden');
            registerView.classList.remove('hidden');
        });

        // Switch to Sign In Screen
        goToSignin.addEventListener('click', (e) => {
            e.preventDefault();
            registerView.classList.add('hidden');
            signinView.classList.remove('remove'); // Safe reset
            signinView.className = "container-child"; // Fallback smooth handle
            signinView.classList.remove('hidden');
        });

        // Password Show/Hide Toggle Function
        function togglePass(id) {
            const input = document.getElementById(id);
            const icon = input.nextElementSibling;
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CptMarkets - GIFTP</title>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0e1e38, #050a14);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Container */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(18, 26, 43, 0.8);
            padding: 40px 30px;
            border-radius: 15px;
            border: 1px solid #1a2a47;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Flag / Language Icon */
        .lang-flag {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 20px;
            cursor: pointer;
        }

        /* Logo Area */
        .logo-box {
            margin-bottom: 30px;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            border: 2px solid #e0a92d;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 10px;
            color: #e0a92d;
            font-weight: bold;
            font-size: 20px;
        }

        .brand-name {
            font-size: 28px;
            font-weight: bold;
            color: #f7ca44;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(247, 202, 68, 0.3);
        }

        .sub-brand {
            font-size: 14px;
            color: #8fa0bc;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #8fa0bc;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: #0e1626;
            border: 1px solid #233554;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-wrapper input:focus {
            border-color: #f7ca44;
        }

        /* Icons inside Inputs */
        .input-icon {
            position: absolute;
            left: 15px;
            color: #5a6e85;
            font-size: 18px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            color: #5a6e85;
            cursor: pointer;
        }

        /* Action Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, #f0be35, #cfa01f);
            color: #050a14;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(240, 190, 53, 0.3);
            margin-top: 10px;
            transition: opacity 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        /* Links Area */
        .links-container {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 14px;
        }

        .link-item {
            color: #e0a92d;
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .link-item:hover {
            text-decoration: underline;
        }

        /* Pop-up Modal (Create Account) */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #121a2b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #233554;
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            color: #8fa0bc;
            cursor: pointer;
        }

        .modal-title {
            color: #f7ca44;
            font-size: 22px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Main Login Card -->
    <div class="login-container">
        <!-- Top Right Flag -->
        <span class="lang-flag">🇬🇧</span>

        <!-- Logo -->
        <div class="logo-box">
            <div class="logo-circle">CPT</div>
            <div class="brand-name">CptMarkets</div>
            <div class="sub-brand">GIFTP</div>
        </div>

        <!-- Login Form -->
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="loginUser" placeholder="Username" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="loginPass" placeholder="Password" required>
                    <span class="toggle-password" onclick="togglePass('loginPass')">👁️</span>
                </div>
            </div>

            <button type="submit" class="btn-submit">Go to Sign In</button>
        </form>

        <!-- Bottom Links -->
        <div class="links-container">
            <span class="link-item" onclick="openRegisterModal()">👤 Create Account</span>
            <span class="link-item" onclick="alert('Reset option coming soon!')">🔒 Forgot Password?</span>
        </div>
    </div>

    <!-- Create Account Modal (Pop-up) -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeRegisterModal()">&times;</span>
            <div class="modal-title">Create Account</div>
            
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>New Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="regUser" placeholder="Choose a username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="regEmail" placeholder="yourname@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="regPass" placeholder="Create strong password" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Register Now</button>
            </form>
        </div>
    </div>

    <!-- JavaScript Interactions -->
    <script>
        // Modal controls
        function openRegisterModal() {
            document.getElementById("registerModal").style.display = "flex";
        }

        function closeRegisterModal() {
            document.getElementById("registerModal").style.display = "none";
        }

        // Toggle Password Visibility
        function togglePass(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

        // Form Submit Actions
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById("loginUser").value;
            alert("Logging in as: " + user);
        }

        function handleRegister(event) {
            event.preventDefault();
            const user = document.getElementById("regUser").value;
            alert("Account successfully created for: " + user);
            closeRegisterModal();
        }

        // Close modal if user clicks outside of it
        window.onclick = function(event) {
            const modal = document.getElementById("registerModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>

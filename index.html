<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CptMarkets - Login</title>
    <!-- Vercel এবং মোবাইল ব্রাউজার ফ্রেন্ডলি ক্লাসিক Tailwind CSS CDN -->
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .bg-custom {
            background-color: #031129;
            background-image: radial-gradient(circle at center, rgba(13, 148, 136, 0.05) 0%, transparent 70%), url('https://transparenttextures.com');
            background-size: cover; position: relative;
        }
        .bg-custom::after {
            content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 120px;
            background: url('https://ibb.co') no-repeat bottom center;
            background-size: contain; opacity: 0.12; pointer-events: none;
        }
    </style>
</head>
<body class="bg-custom text-white flex justify-center items-center min-h-screen font-sans relative overflow-hidden">

    <div class="absolute top-4 right-4 z-10 bg-[#05193e] border border-blue-900 rounded-md p-1 flex items-center justify-center">
        <img src="https://flagcdn.com" alt="UK Flag" class="w-5 h-auto rounded-sm">
    </div>

    <div class="w-full max-w-md p-6 bg-[#05193e] rounded-2xl shadow-2xl border border-blue-900 mx-4 relative z-10">
        
        <div class="text-center mb-8 relative">
            <div class="text-[10px] uppercase text-amber-500 font-bold tracking-widest flex items-center justify-center gap-1">
                <i class="fa-solid fa-chart-line text-[9px]"></i> CPT MARKETS UK
            </div>
            <h1 class="text-3xl font-extrabold text-amber-400 mt-1 tracking-tight">CptMarkets</h1>
            <p class="text-xs text-blue-300 font-medium mt-0.5 tracking-[0.25em]">GIFTP</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1.5 ml-1">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400"><i class="fa-regular fa-user text-sm"></i></span>
                    <input type="text" id="username" placeholder="Username" class="w-full pl-11 pr-4 py-3 bg-[#031129] border border-blue-900 rounded-xl focus:outline-none focus:border-amber-400 text-sm placeholder-gray-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1.5 ml-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400"><i class="fa-solid fa-lock text-sm"></i></span>
                    <input type="password" id="password" placeholder="Password" class="w-full pl-11 pr-11 py-3 bg-[#031129] border border-blue-900 rounded-xl focus:outline-none focus:border-amber-400 text-sm placeholder-gray-500">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500 cursor-pointer hover:text-gray-400"><i class="fa-regular fa-eye-slash text-sm"></i></span>
                </div>
            </div>

            <button onclick="handleLogin()" class="w-full py-3.5 mt-4 bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 text-[#031129] font-bold text-sm rounded-xl shadow-lg hover:brightness-110 active:scale-[0.99] transition duration-200">
                Go to Sign In
            </button>
        </div>

        <div class="flex justify-between items-center mt-6 px-1 text-xs font-medium text-amber-400/90">
            <a href="register.html" class="hover:text-amber-300 transition flex items-center gap-1.5"><i class="fa-solid fa-user-plus text-[11px]"></i> Create Account</a>
            <a href="#" class="hover:text-amber-300 transition flex items-center gap-1.5"><i class="fa-solid fa-unlock-keyhole text-[11px]"></i> Forgot Password?</a>
        </div>
    </div>

    <script>
        function handleLogin() {
            var u = document.getElementById('username').value.trim();
            var p = document.getElementById('password').value.trim();

            if(!u || !p) { alert("ইউজারনেম ও পাসওয়ার্ড লিখুন!"); return; }

            // 🔒 আপনার কাস্টম এডমিন লগইন ডিটেইলস এখানে চেক হবে
            if(u === "admin" && p === "admin123") {
                localStorage.setItem('currentUserUid', '000000');
                localStorage.setItem('role', 'admin');
                window.location.href = 'dashboard.html';
                return;
            }

            var users = JSON.parse(localStorage.getItem('users')) || [];
            var found = users.find(function(user) { return user.username === u && user.password === p; });

            if(found) {
                localStorage.setItem('currentUserUid', found.uid);
                localStorage.setItem('role', 'user');
                window.location.href = 'dashboard.html';
            } else {
                alert("ভুল ইউজারনেম বা পাসওয়ার্ড!");
            }
        }
    </script>
</body>
</html>

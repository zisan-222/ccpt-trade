<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CPTMarkets - Login</title>


    <!-- =====================================================
         EXISTING WEBSITE CSS
         DO NOT REMOVE
    ====================================================== -->

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="index-professional.css">


    <!-- =====================================================
         NEW PREMIUM LOGIN DESIGN
         NEW FILE
    ====================================================== -->

    <link rel="stylesheet" href="login-premium.css">


    <!-- =====================================================
         EXISTING POPUP CSS
         DO NOT REMOVE
    ====================================================== -->

    <link rel="stylesheet" href="popup.css">


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


    <!-- =====================================================
         PREMIUM LOGIN PAGE
    ====================================================== -->

    <div class="login-page">


        <div class="login-card">


            <!-- =================================================
                 LANGUAGE
            ================================================== -->

            <button
                class="language-btn"
                type="button"
                aria-label="Language">

                🇬🇧

            </button>


            <!-- =================================================
                 MARKET BACKGROUND
            ================================================== -->

            <div class="market-background">


                <div class="market-dots"></div>


                <div class="market-bars">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="market-lines line-1"></div>

                <div class="market-lines line-2"></div>

                <div class="market-lines line-3"></div>


            </div>


            <!-- =================================================
                 BRAND AREA
            ================================================== -->

            <div class="brand-area">


                <div class="brand-logo">


                    <div class="logo-ring">

                        <span>CPT</span>

                        <i class="fa-solid fa-arrow-up-right"></i>

                    </div>


                    <div class="logo-markets">

                        MARKETS

                    </div>


                    <div class="logo-uk">

                        UK

                    </div>


                </div>


                <h1>

                    CptMarkets

                </h1>


                <div class="gift-title">

                    <span></span>

                    GIFT

                    <span></span>

                </div>


            </div>


            <!-- =================================================
                 EXISTING LOGIN FORM
                 IMPORTANT IDs ARE PRESERVED FOR script.js
            ================================================== -->

            <form
                id="loginForm"
                class="login-form">


                <!-- =================================================
                     USERNAME
                ================================================== -->

                <div class="form-group">


                    <label for="username">

                        Username

                    </label>


                    <div class="input-box">


                        <div class="input-icon">

                            <i class="fa-regular fa-user"></i>

                        </div>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Username"
                            autocomplete="username"
                            required>


                    </div>


                </div>


                <!-- =================================================
                     PASSWORD
                ================================================== -->

                <div class="form-group">


                    <label for="password">

                        Password

                    </label>


                    <div class="input-box">


                        <div class="input-icon">

                            <i class="fa-solid fa-lock"></i>

                        </div>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required>


                        <!--
                            IMPORTANT:
                            script.js directly changes
                            fa-eye / fa-eye-slash on THIS element.
                        -->

                        <i
                            class="fa-regular fa-eye password-toggle"
                            id="togglePassword"
                            role="button"
                            tabindex="0"
                            aria-label="Show password">
                        </i>


                    </div>


                </div>


                <!-- =================================================
                     LOGIN BUTTON
                     script.js searches for .login-btn
                ================================================== -->

                <button
                    type="submit"
                    class="login-btn">

                    Go to Sign In

                </button>


                <!-- =================================================
                     BOTTOM LINKS
                ================================================== -->

                <div class="login-links">


                    <a
                        href="register.html"
                        class="login-link">


                        <i class="fa-solid fa-user-plus"></i>


                        <span>

                            Create Account

                        </span>


                    </a>


                    <a
                        href="#"
                        class="login-link">


                        <i class="fa-solid fa-lock"></i>


                        <span>

                            Forgot Password?

                        </span>


                    </a>


                </div>


            </form>


            <!-- =================================================
                 BOTTOM MARKET DECORATION
            ================================================== -->

            <div class="bottom-market">


                <div class="bottom-line"></div>


                <div class="bottom-bars">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


            </div>


        </div>


    </div>


    <!-- =====================================================
         EXISTING PROFESSIONAL POPUP SYSTEM
         DO NOT REMOVE
    ====================================================== -->

    <script src="popup.js"></script>


    <!-- =====================================================
         EXISTING LOGIN / FIREBASE SYSTEM
         DO NOT CHANGE
    ====================================================== -->

    <script type="module" src="script.js"></script>


</body>

</html>

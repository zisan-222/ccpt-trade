<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>CPTMarkets - Login</title>

    <!-- Main Website CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Professional Login CSS -->
    <link rel="stylesheet" href="index-professional.css">

    <!-- Popup CSS -->
    <link rel="stylesheet" href="popup.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>


<body>

    <!-- =====================================================
         CPTMARKETS LOGIN PAGE
         ===================================================== -->

    <main class="login-page">

        <section class="login-card">


            <!-- =================================================
                 LANGUAGE BUTTON
                 ================================================= -->

            <button
                class="language-btn"
                type="button"
                aria-label="Language">

                🇬🇧

            </button>


            <!-- =================================================
                 CIRCULAR MARKET BACKGROUND
                 ================================================= -->

            <div
                class="market-background"
                aria-hidden="true">

                <div class="market-lines line-1"></div>

                <div class="market-lines line-2"></div>

                <div class="market-lines line-3"></div>


                <div class="market-bars">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="market-dots"></div>

                <div class="circle-glow"></div>

            </div>


            <!-- =================================================
                 BRAND / LOGO
                 ================================================= -->

            <header class="brand-area">

                <div class="brand-logo">


                    <!-- CPT Circular Logo -->

                    <div class="logo-ring">

                        <span>CPT</span>

                        <i class="fa-solid fa-arrow-up-right"></i>

                    </div>


                    <!-- Markets -->

                    <div class="logo-markets">
                        MARKETS
                    </div>


                    <!-- UK -->

                    <div class="logo-uk">
                        UK
                    </div>

                </div>


                <!-- Main Brand Name -->

                <h1>
                    CptMarkets
                </h1>


                <!-- Gift -->

                <div class="gift-title">

                    <span></span>

                    <strong>GIFT</strong>

                    <span></span>

                </div>

            </header>


            <!-- =================================================
                 LOGIN FORM
                 IMPORTANT IDs PRESERVED FOR script.js
                 ================================================= -->

            <form
                id="loginForm"
                class="login-form"
                autocomplete="on">


                <!-- =================================================
                     USERNAME
                     ================================================= -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>


                    <div class="input-box">


                        <div
                            class="input-icon"
                            aria-hidden="true">

                            <i class="fa-regular fa-user"></i>

                        </div>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Username"
                            autocomplete="username"
                            required>


                    </div>

                </div>


                <!-- =================================================
                     PASSWORD
                     ================================================= -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="input-box">


                        <div
                            class="input-icon"
                            aria-hidden="true">

                            <i class="fa-solid fa-lock"></i>

                        </div>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required>


                        <!-- Password Toggle
                             ID preserved for script.js -->

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password">

                            <i class="fa-regular fa-eye"></i>

                        </button>


                    </div>

                </div>


                <!-- =================================================
                     LOGIN BUTTON
                     ================================================= -->

                <button
                    type="submit"
                    class="login-btn">

                    <span>
                        Go to Sign In
                    </span>

                </button>


                <!-- =================================================
                     ACCOUNT LINKS
                     ================================================= -->

                <div class="login-links">


                    <!-- Create Account -->

                    <a
                        href="register.html"
                        class="login-link">

                        <i class="fa-solid fa-user-plus"></i>

                        <span>
                            Create Account
                        </span>

                    </a>


                    <!-- Forgot Password -->

                    <a
                        href="#"
                        id="forgotPassword"
                        class="login-link">

                        <i class="fa-solid fa-lock"></i>

                        <span>
                            Forgot Password?
                        </span>

                    </a>


                </div>

            </form>


            <!-- =================================================
                 BOTTOM MARKET GRAPHIC
                 ================================================= -->

            <div
                class="bottom-market"
                aria-hidden="true">


                <div class="bottom-line"></div>


                <div class="bottom-bars">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>


        </section>

    </main>


    <!-- =====================================================
         EXISTING JAVASCRIPT
         ===================================================== -->

    <script src="popup.js"></script>

    <script
        type="module"
        src="script.js">
    </script>


</body>

</html>

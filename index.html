<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CPTMarkets - Login</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="background"></div>

<div class="login-container">

<div class="login-card">

<div class="language">
🇬🇧
</div>

<div class="logo-area">

<h1>

<span class="gold">
CPT
</span>

<span class="white">
Markets
</span>

</h1>

<p>G I F T P</p>

</div>

<form id="loginForm">

<div class="form-group">

<label>
Username
</label>

<div class="input-box">

<i class="fa-regular fa-user"></i>

<input
type="text"
id="username"
placeholder="Username"
required>

</div>

</div>

<div class="form-group">

<label>
Password
</label>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<i
class="fa-regular fa-eye"
id="togglePassword">
</i>

</div>

</div>

<button
type="submit"
class="login-btn">

Go to Sign In

</button>
 <div class="bottom-links">

<a href="register.html">

<i class="fa-solid fa-user-plus"></i>

Create Account

</a>

<a href="#">

<i class="fa-solid fa-lock"></i>

Forgot Password?

</a>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>

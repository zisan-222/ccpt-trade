<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invite Friends</title>

    <link rel="stylesheet" href="invite.css">
</head>

<body>

    <!-- Header -->
    <header class="invite-header">

        <button
            type="button"
            class="back-btn"
            onclick="goBack()"
            aria-label="Go back">
            ‹
        </button>

        <h1>Invite Friends</h1>

        <div class="header-space"></div>

    </header>


    <main class="invite-container">

        <!-- Invite Code Card -->
        <section class="invite-code-card">

            <div class="invite-code-title">
                My Invite Code
            </div>

            <div
                id="inviteCode"
                class="invite-code">
                56771056
            </div>

            <button
                type="button"
                id="copyInviteBtn"
                class="copy-btn">
                Copy Invite Link
            </button>

        </section>


        <!-- Statistics -->
        <section class="stats-card">

            <div class="stat-item">

                <div
                    id="inviteCount"
                    class="stat-number">
                    0
                </div>

                <div class="stat-label">
                    Invitees
                </div>

            </div>


            <div class="stat-item">

                <div class="stat-number commission">
                    $0.00
                </div>

                <div class="stat-label">
                    Total Commission
                </div>

            </div>

        </section>


        <!-- Referrals -->
        <section class="referrals-card">

            <h2>My Referrals</h2>

            <div
                id="referralsList"
                class="referrals-list">

                <div class="no-referrals">
                    No referrals
                </div>

            </div>

        </section>

    </main>


    <!-- Copy Success Message -->
    <div
        id="copyToast"
        class="copy-toast">
        Invite code copied!
    </div>


    <script src="invite.js"></script>
    <script src="lang.js"></script>
<script src="translator.js"></script>


</body>
</html>

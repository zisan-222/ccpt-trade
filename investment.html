<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>CptMarkets</title>

    <link
        rel="stylesheet"
        href="investment.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

<div id="investmentApp">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="investment-header">

        <button
            class="back-button"
            id="backButton"
            type="button"
            aria-label="Back"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <h1 id="pageTitle">
            Wealth
        </h1>

        <div class="header-space"></div>

    </header>


    <!-- =========================
         PAGE CONTENT
    ========================== -->

    <main class="investment-content">

        <!-- =====================
             TABS
        ====================== -->

        <div class="investment-tabs">

            <button
                class="investment-tab active"
                data-tab="wealthFund"
                type="button"
            >
                Wealth Fund
            </button>

            <button
                class="investment-tab"
                data-tab="miningPower"
                type="button"
            >
                Mining Power
            </button>

            <button
                class="investment-tab"
                data-tab="subscriptions"
                type="button"
            >
                My Subscriptions
            </button>

        </div>


        <!-- =====================
             WEALTH FUND
        ====================== -->

        <section
            id="wealthFund"
            class="tab-content active"
        >

            <div
                id="wealthProducts"
                class="products-container"
            >
                <!-- Products generated by investment.js -->
            </div>

        </section>


        <!-- =====================
             MINING POWER
        ====================== -->

        <section
            id="miningPower"
            class="tab-content"
        >

            <div
                id="miningProducts"
                class="products-container"
            >
                <!-- Mining products generated by investment.js -->
            </div>

        </section>


        <!-- =====================
             MY SUBSCRIPTIONS
        ====================== -->

        <section
            id="subscriptions"
            class="tab-content"
        >

            <div
                id="subscriptionsContainer"
                class="subscriptions-container"
            >

                <div class="empty-state">

                    <div class="empty-icon">
                        <i class="fa-solid fa-chart-pie"></i>
                    </div>

                    <h3>
                        No subscriptions
                    </h3>

                    <p>
                        Your active subscriptions will appear here.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         SUBSCRIBE BOTTOM SHEET
    ========================== -->

    <div
        id="subscribeOverlay"
        class="subscribe-overlay"
    >

        <div
            class="subscribe-sheet"
            id="subscribeSheet"
        >

            <div class="sheet-handle"></div>

            <div class="sheet-header">

                <h2>
                    Subscribe
                </h2>

                <button
                    id="closeSubscribe"
                    class="close-sheet"
                    type="button"
                    aria-label="Close"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>


            <!-- Product summary -->

            <div class="subscribe-product">

                <div
                    class="subscribe-product-icon"
                    id="subscribeProductIcon"
                >
                    <i class="fa-solid fa-chart-line"></i>
                </div>

                <div class="subscribe-product-info">

                    <h3 id="subscribeProductName">
                        Product
                    </h3>

                    <p id="subscribeProductDescription">
                        Product description
                    </p>

                </div>

            </div>


            <!-- Daily return -->

            <div class="subscribe-row">

                <span>
                    Daily Income
                </span>

                <strong
                    id="subscribeDailyIncome"
                    class="income-value"
                >
                    $0.00/day
                </strong>

            </div>


            <!-- Duration -->

            <div class="subscribe-row">

                <span>
                    Duration
                </span>

                <strong id="subscribeDuration">
                    1 days
                </strong>

            </div>


            <!-- Minimum -->

            <div class="subscribe-row">

                <span>
                    Minimum
                </span>

                <strong id="subscribeMinimum">
                    $10.00
                </strong>

            </div>


            <!-- Amount -->

            <div class="amount-section">

                <label for="subscriptionAmount">
                    Subscription Amount (USD)
                </label>

                <div class="amount-input-wrapper">

                    <span class="currency-symbol">
                        $
                    </span>

                    <input
                        id="subscriptionAmount"
                        type="number"
                        inputmode="decimal"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        autocomplete="off"
                    >

                </div>

                <div
                    id="amountError"
                    class="amount-error"
                ></div>

            </div>


            <!-- Confirm -->

            <button
                id="confirmSubscription"
                class="confirm-subscription"
                type="button"
            >
                Confirm Subscription
            </button>

        </div>

    </div>


    <!-- =========================
         SUCCESS MESSAGE
    ========================== -->

    <div
        id="successToast"
        class="success-toast"
    >

        <i class="fa-solid fa-circle-check"></i>

        <span id="successToastText">
            Subscription successful
        </span>

    </div>


</div>


<script src="investment.js"></script>

</body>
</html>

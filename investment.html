<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CptMarkets</title>

    <!-- Investment CSS -->
    <link rel="stylesheet" href="./investment.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

<div id="investmentApp">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="investment-header">

        <button
            class="back-button"
            id="backButton"
            type="button"
            aria-label="Back"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <h1 id="pageTitle">Wealth</h1>

        <div class="header-space" aria-hidden="true"></div>

    </header>


    <!-- =========================
         PAGE CONTENT
    ========================== -->

    <main class="investment-content">

        <!-- =====================
             TABS
        ====================== -->

        <nav
            class="investment-tabs"
            aria-label="Investment sections"
        >

            <button
                class="investment-tab active"
                data-tab="wealthFund"
                type="button"
            >
                Wealth Fund
            </button>

            <button
                class="investment-tab"
                data-tab="miningPower"
                type="button"
            >
                Mining Power
            </button>

            <button
                class="investment-tab"
                data-tab="subscriptions"
                type="button"
            >
                My Subscriptions
            </button>

        </nav>


        <!-- =====================
             WEALTH FUND
        ====================== -->

        <section
            id="wealthFund"
            class="tab-content active"
            aria-labelledby="wealthFundTab"
        >

            <div
                id="wealthProducts"
                class="products-container"
            >
                <!-- Products generated by investment.js -->
            </div>

        </section>


        <!-- =====================
             MINING POWER
        ====================== -->

        <section
            id="miningPower"
            class="tab-content"
            aria-labelledby="miningPowerTab"
        >

            <div
                id="miningProducts"
                class="products-container"
            >
                <!-- Mining products generated by investment.js -->
            </div>

        </section>


        <!-- =====================
             MY SUBSCRIPTIONS
        ====================== -->

        <section
            id="subscriptions"
            class="tab-content"
        >

            <div
                id="subscriptionsContainer"
                class="subscriptions-container"
            >

                <div class="empty-state">

                    <div class="empty-icon">
                        <i class="fa-solid fa-chart-pie"></i>
                    </div>

                    <h3>No subscriptions</h3>

                    <p>
                        Your active subscriptions will appear here.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         SUBSCRIBE BOTTOM SHEET
    ========================== -->

    <div
        id="subscribeOverlay"
        class="subscribe-overlay"
        aria-hidden="true"
    >

        <div
            class="subscribe-sheet"
            id="subscribeSheet"
            role="dialog"
            aria-modal="true"
            aria-labelledby="subscribeTitle"
        >

            <div class="sheet-handle"></div>

            <div class="sheet-header">

                <h2 id="subscribeTitle">
                    Subscribe
                </h2>

                <button
                    id="closeSubscribe"
                    class="close-sheet"
                    type="button"
                    aria-label="Close"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>


            <!-- =====================
                 PRODUCT SUMMARY
            ====================== -->

            <div class="subscribe-product">

                <div
                    class="subscribe-product-icon"
                    id="subscribeProductIcon"
                >
                    <i class="fa-solid fa-chart-line"></i>
                </div>

                <div class="subscribe-product-info">

                    <h3 id="subscribeProductName">
                        Product
                    </h3>

                    <p id="subscribeProductDescription">
                        Product description
                    </p>

                </div>

            </div>


            <!-- =====================
                 DAILY RETURN
            ====================== -->

            <div class="subscribe-row">

                <span>Daily Income</span>

                <strong
                    id="subscribeDailyIncome"
                    class="income-value"
                >
                    $0.00/day
                </strong>

            </div>


            <!-- =====================
                 DURATION
            ====================== -->

            <div class="subscribe-row">

                <span>Duration</span>

                <strong id="subscribeDuration">
                    1 days
                </strong>

            </div>


            <!-- =====================
                 MINIMUM
            ====================== -->

            <div class="subscribe-row">

                <span>Minimum</span>

                <strong id="subscribeMinimum">
                    $10.00
                </strong>

            </div>


            <!-- =====================
                 AMOUNT
            ====================== -->

            <div class="amount-section">

                <label for="subscriptionAmount">
                    Subscription Amount (USD)
                </label>

                <div class="amount-input-wrapper">

                    <span
                        class="currency-symbol"
                        aria-hidden="true"
                    >
                        $
                    </span>

                    <input
                        id="subscriptionAmount"
                        type="number"
                        inputmode="decimal"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        autocomplete="off"
                    >

                </div>

                <div
                    id="amountError"
                    class="amount-error"
                    role="alert"
                    aria-live="polite"
                ></div>

            </div>


            <!-- =====================
                 CONFIRM
            ====================== -->

            <button
                id="confirmSubscription"
                class="confirm-subscription"
                type="button"
            >
                Confirm Subscription
            </button>

        </div>

    </div>


    <!-- =========================
         SUCCESS MESSAGE
    ========================= -->

    <div
        id="successToast"
        class="success-toast"
        role="status"
        aria-live="polite"
    >

        <i class="fa-solid fa-circle-check"></i>

        <span id="successToastText">
            Subscription successful
        </span>

    </div>

</div>


<!-- Investment JavaScript -->
<script src="./investment.js" defer></script>
<script src="lang.js"></script>
<script src="translator.js"></script>

</body>
</html>

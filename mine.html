<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CptMarkets - Mine</title>

<link rel="stylesheet" href="mine.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="mine-container">

<!-- Header -->

<header class="mine-header">

<div class="logo">
<span>CptMarkets</span>
</div>

<div class="language">
<i class="fa-solid fa-globe"></i>
</div>

</header>

<!-- Profile Card -->

<section class="profile-card">

<div class="avatar">
E
</div>

<div class="profile-info">
    <h3 id="username">Loading...</h3>
    <p>UID: <span id="userid">Loading...</span></p>
</div>

</section>

<!-- Statistics -->

<section class="stats-card">

<div class="stat-box">
<h2>+0.00</h2>
<span>Today P/L</span>
</div>

<div class="stat-box">
<h2>+0.00</h2>
<span>Total P/L</span>
</div>

<div class="stat-box">
<h2>0</h2>
<span>Open</span>
</div>

<div class="divider"></div>

<div class="bottom-info">

<span>VIP Level V0</span>

<span>Credit Score 100</span>

</div>

</section>

<!-- Menu Card -->

<section class="menu-card">

<a class="menu-row">
<div class="icon">
<i class="fa-solid fa-sack-dollar"></i>
</div>
<span>My Assets</span>
<i class="fa-solid fa-angle-right"></i>
</a>

<a href="index.html" class="menu-row">
<div class="icon">
<i class="fa-solid fa-file-lines"></i>
</div>
<span>My Orders</span>
<i class="fa-solid fa-angle-right"></i>
</a>

<a class="menu-row">
<div class="icon">
<i class="fa-solid fa-users"></i>
</div>
<span>Copy Trading</span>
<i class="fa-solid fa-angle-right"></i>
</a>

<a class="menu-row">
<div class="icon">
<i class="fa-regular fa-credit-card"></i>
</div>
<span>Loan</span>
<i class="fa-solid fa-angle-right"></i>
</a>

<a class="menu-row">
<div class="icon">
<i class="fa-solid fa-chart-column"></i>
</div>
<span>Wealth / Mining</span>
<i class="fa-solid fa-angle-right"></i>
</a>

</section>
<!-- More Menu -->

<section class="menu-card">

    <a class="menu-row">
        <div class="icon">
            <i class="fa-solid fa-gift"></i>
        </div>
        <span>Invite Friends</span>
        <i class="fa-solid fa-angle-right"></i>
    </a>

    <a class="menu-row">
        <div class="icon">
            <i class="fa-solid fa-wallet"></i>
        </div>
        <span>Wallet Management</span>
        <i class="fa-solid fa-angle-right"></i>
    </a>

    <a class="menu-row">
        <div class="icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <span>Security</span>
        <i class="fa-solid fa-angle-right"></i>
    </a>

    <a class="menu-row">
        <div class="icon">
            <i class="fa-solid fa-bullhorn"></i>
        </div>
        <span>Announcements</span>
        <i class="fa-solid fa-angle-right"></i>
    </a>

    <a class="menu-row support-btn">
        <div class="icon">
            <i class="fa-solid fa-headset"></i>
        </div>
        <span>Support</span>
        <i class="fa-solid fa-angle-right"></i>
    </a>

</section>

<!-- Sign Out -->

<div class="signout-box">
    <button class="signout-btn">Sign Out</button>
</div>

<!-- Bottom Navigation -->

<nav class="bottom-nav">

    <a href="dashboard.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="#">
        <i class="fa-regular fa-chart-bar"></i>
        <span>Markets</span>
    </a>

    <a class="trade-btn">
        <i class="fa-solid fa-arrow-right-arrow-left"></i>
    </a>

    <a href="#">
        <i class="fa-solid fa-sack-dollar"></i>
        <span>Assets</span>
    </a>

    <a class="active" href="mine.html">
        <i class="fa-regular fa-user"></i>
        <span>Mine</span>
    </a>

</nav>

</div>

<script src="mine.js"></script>

</body>
</html>
